.lw-nrt-art{animation:pw-float 5.5s ease-in-out infinite, nrt-frost-pulse 3.2s ease-in-out infinite;}
.lw-nrt-card{background:linear-gradient(135deg,rgba(46,134,222,.07),rgba(143,211,255,.04),transparent);border:1px solid rgba(46,134,222,.28);box-shadow:inset 0 0 0 1px rgba(46,134,222,.1);}
.lw-nrt-card.locked{background:linear-gradient(135deg,var(--surface-2),transparent);border-color:var(--border-soft);box-shadow:none;}
.lw-nrt-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#2E86DE;margin-bottom:4px;}
.lw-nrt-progress-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-faint);margin-top:8px;}
/* Century Club: a third single, non-tiered special achievement — platinum/titanium/graphite palette with pure trading-blue energy accents, distinct from the ember Comeback Kid and the frost No Revenge Trading. A "resting heartbeat" glow pulse, never a flicker or flame, matching the badge's instrument-seal motif. */
@keyframes cc-glow-pulse{0%,100%{filter:drop-shadow(0 0 10px rgba(62,142,247,.35)) drop-shadow(0 0 2px rgba(255,255,255,.15));}50%{filter:drop-shadow(0 0 22px rgba(62,142,247,.6)) drop-shadow(0 0 6px rgba(255,255,255,.25));}}
.lw-cc-art{animation:pw-float 4.6s ease-in-out infinite, cc-glow-pulse 2.8s ease-in-out infinite;}
.lw-cc-card{background:linear-gradient(135deg,rgba(62,142,247,.07),rgba(126,196,255,.04),transparent);border:1px solid rgba(62,142,247,.28);box-shadow:inset 0 0 0 1px rgba(62,142,247,.08);}
.lw-cc-card.locked{background:linear-gradient(135deg,var(--surface-2),transparent);border-color:var(--border-soft);box-shadow:none;}
.lw-cc-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#3E8EF7;margin-bottom:4px;}
.lw-cc-progress-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-faint);margin-top:8px;}
/* Zero Revenge: a fourth single, non-tiered special achievement — "Frozen Storm," a pinwheel of faceted ice blades swirling around a calm, unmoving core, held in check by two slow counter-rotating broken bands. Cyan/ice-blue palette, distinct from the pure-blue crystal gem of No Revenge Trading, the ember flame of Comeback Kid, the platinum chronograph of Century Club, and the steel hourglass of Patience Pays. Unlike No Revenge Trading's resettable streak, Zero Revenge has zero tolerance: a single revenge-trading incident anywhere in a trader's entire history closes it off permanently — the strictest, rarest mark on the wall. */
@keyframes zr-frost-pulse{0%,100%{filter:drop-shadow(0 0 12px rgba(34,211,238,.32)) brightness(1);}50%{filter:drop-shadow(0 0 24px rgba(180,240,255,.5)) brightness(1.1);}}
.lw-zr-art{animation:pw-float 5s ease-in-out infinite, zr-frost-pulse 3.4s ease-in-out infinite;}
.lw-zr-card{background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(180,240,255,.04),transparent);border:1px solid rgba(34,211,238,.3);box-shadow:inset 0 0 0 1px rgba(34,211,238,.1);}
.lw-zr-card.locked{background:linear-gradient(135deg,var(--surface-2),transparent);border-color:var(--border-soft);box-shadow:none;}
.lw-zr-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#22D3EE;margin-bottom:4px;}
.lw-zr-progress-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-faint);margin-top:8px;}
/* Iron Hands: a fifth single, non-tiered special achievement — a forged-steel clamp closing on a titanium lock-core, gunmetal/steel/titanium palette with electric-blue energy accents only. A steady "grip lock" glow pulse, never a flicker, matching the badge's mechanical (not gemstone, not chronograph) motif. Distinct from every other special badge's shape (chamfered plate, not a circle) and color temperature (cool blue-steel, not ember, not ice-cyan, not platinum). */
@keyframes ih-grip-pulse{0%,100%{filter:drop-shadow(0 0 10px rgba(46,139,255,.32)) brightness(1);}50%{filter:drop-shadow(0 0 22px rgba(191,232,255,.5)) brightness(1.1);}}
.lw-ih-art{animation:pw-float 4.8s ease-in-out infinite, ih-grip-pulse 2.1s ease-in-out infinite;}
.lw-ih-card{background:linear-gradient(135deg,rgba(46,139,255,.07),rgba(191,232,255,.04),transparent);border:1px solid rgba(46,139,255,.28);box-shadow:inset 0 0 0 1px rgba(46,139,255,.1);}
.lw-ih-card.locked{background:linear-gradient(135deg,var(--surface-2),transparent);border-color:var(--border-soft);box-shadow:none;}
.lw-ih-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#2E8BFF;margin-bottom:4px;}
.lw-ih-progress-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-faint);margin-top:8px;}
/* Drawdown Shield: a sixth single, non-tiered special achievement — a vertical containment capsule holding a protected equity curve, ringed by two counter-rotating hexagonal energy fields. Deep blue/cyan/electric-blue/white palette only, the coolest and most clinical mark on the wall. A steady "barrier holding" glow pulse, distinct from every other badge's silhouette (vertical lens, not a circle, octagon, or shield) and color temperature. */
@keyframes ds-shield-pulse{0%,100%{filter:drop-shadow(0 0 10px rgba(58,214,255,.3)) brightness(1);}50%{filter:drop-shadow(0 0 22px rgba(58,214,255,.55)) brightness(1.1);}}
.lw-ds-art{animation:pw-float 5.2s ease-in-out infinite, ds-shield-pulse 2.4s ease-in-out infinite;}
.lw-ds-card{background:linear-gradient(135deg,rgba(58,214,255,.07),rgba(46,139,255,.04),transparent);border:1px solid rgba(58,214,255,.28);box-shadow:inset 0 0 0 1px rgba(58,214,255,.1);}
.lw-ds-card.locked{background:linear-gradient(135deg,var(--surface-2),transparent);border-color:var(--border-soft);box-shadow:none;}
.lw-ds-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#3AD6FF;margin-bottom:4px;}
.lw-ds-progress-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-faint);margin-top:8px;}
/* League Breaker: a seventh single, non-tiered special achievement — a domed portal archway with a shattered barrier at its midline, distinct from every ladder badge and every other special's silhouette (no octagon, no lens, no circle). Purple/electric-blue/cyan "dimensional breakthrough" palette with white energy highlights, the only warm-cool dual-hue mark on the wall. A "portal glow" breathing pulse, never a flicker, matching the badge's breakthrough motif. */
@keyframes lb-portal-pulse{0%,100%{filter:drop-shadow(0 0 12px rgba(124,58,237,.32)) drop-shadow(0 0 6px rgba(34,211,238,.2)) brightness(1);}50%{filter:drop-shadow(0 0 26px rgba(124,58,237,.55)) drop-shadow(0 0 14px rgba(34,211,238,.4)) brightness(1.12);}}
.lw-lb-art{animation:pw-float 4.7s ease-in-out infinite, lb-portal-pulse 2.6s ease-in-out infinite;}
.lw-lb-card{background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(34,211,238,.04),transparent);border:1px solid rgba(124,58,237,.3);box-shadow:inset 0 0 0 1px rgba(124,58,237,.1);}
.lw-lb-card.locked{background:linear-gradient(135deg,var(--surface-2),transparent);border-color:var(--border-soft);box-shadow:none;}
.lw-lb-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8B5CF6;margin-bottom:4px;}
.lw-lb-progress-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-faint);margin-top:8px;}
/* Full Circle: an eighth single, non-tiered special achievement — "Ascending Loop," a vertical figure-eight with a violet/blue origin loop and a cyan/gold mastery loop sharing one pinch-point, distinct from every ring/lens/octagon/arch silhouette on the wall. A slow, steady "growth breathing" glow pulse, never a flicker, matching the badge's continuous-circulation motif. */
@keyframes fc-growth-pulse{0%,100%{filter:drop-shadow(0 0 12px rgba(124,58,237,.3)) drop-shadow(0 0 6px rgba(34,211,238,.18)) brightness(1);}50%{filter:drop-shadow(0 0 24px rgba(255,215,106,.4)) drop-shadow(0 0 12px rgba(34,211,238,.35)) brightness(1.1);}}
.lw-fc-art{animation:pw-float 5.4s ease-in-out infinite, fc-growth-pulse 3s ease-in-out infinite;}
/* Improvement Arc: a ninth single, non-tiered special achievement — "Ascending Curve," a rising performance line with four brightening checkpoint nodes, distinct from every loop/ring/lens/octagon/arch on the wall. A steady "climbing momentum" glow pulse, never a flicker, matching the badge's line-chart motif. */
@keyframes ia-momentum-pulse{0%,100%{filter:drop-shadow(0 0 10px rgba(52,211,153,.3)) drop-shadow(0 0 6px rgba(34,211,238,.2)) brightness(1);}50%{filter:drop-shadow(0 0 22px rgba(34,211,238,.45)) drop-shadow(0 0 12px rgba(243,240,255,.35)) brightness(1.1);}}
.lw-ia-art{animation:pw-float 5s ease-in-out infinite, ia-momentum-pulse 2.6s ease-in-out infinite;}
/* Metronome: a tenth single, non-tiered special achievement — a tapered silver-and-navy instrument case with a swinging pendulum, distinct from every octagon/lens/arch/loop/curve silhouette on the wall. A steady "in-tempo" glow pulse timed to the pendulum's own 1.6s swing period, never a flicker, matching the badge's cadence motif. */
@keyframes mm-tempo-pulse{0%,100%{filter:drop-shadow(0 0 10px rgba(34,211,238,.3)) brightness(1);}50%{filter:drop-shadow(0 0 20px rgba(34,211,238,.5)) brightness(1.08);}}
.lw-mm-art{animation:pw-float 4.8s ease-in-out infinite, mm-tempo-pulse 1.6s ease-in-out infinite;}
.lw-mm-card{background:linear-gradient(135deg,rgba(34,211,238,.07),rgba(199,207,216,.04),transparent);border:1px solid rgba(34,211,238,.28);box-shadow:inset 0 0 0 1px rgba(34,211,238,.1);}
.lw-mm-card.locked{background:linear-gradient(135deg,var(--surface-2),transparent);border-color:var(--border-soft);box-shadow:none;}
.lw-mm-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#22D3EE;margin-bottom:4px;}
.lw-mm-progress-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-faint);margin-top:8px;}
/* Legend Status: the crown of the League Ladder and the single rarest mark on the wall — a large faceted diamond emblem beneath a floating crown, cradled by two golden laurel branches, with a faint candlestick pattern etched into the lower facets. Pure gold / platinum silver / deep black, with small electric-blue accent sparks only — the brightest, most layered glow stack on the entire wall, reserved for the top 2% composite score. */
@keyframes ls-prestige-pulse{0%,100%{filter:drop-shadow(0 0 16px rgba(255,215,106,.4)) drop-shadow(0 0 8px rgba(34,211,238,.18)) brightness(1);}50%{filter:drop-shadow(0 0 34px rgba(255,215,106,.65)) drop-shadow(0 0 16px rgba(199,207,216,.4)) brightness(1.18);}}
.lw-ls-art{animation:pw-float 5s ease-in-out infinite, ls-prestige-pulse 2.4s ease-in-out infinite;}
.lw-ls-card{background:linear-gradient(135deg,rgba(255,215,106,.1),rgba(199,207,216,.05),transparent);border:1px solid rgba(255,215,106,.4);box-shadow:inset 0 0 0 1px rgba(255,215,106,.15), 0 0 24px rgba(255,215,106,.08);}
.lw-ls-card.locked{background:linear-gradient(135deg,var(--surface-2),transparent);border-color:var(--border-soft);box-shadow:none;}
.lw-ls-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#FFD76A;margin-bottom:4px;}
.lw-ls-progress-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-faint);margin-top:8px;}
@keyframes pw-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.lw-pw-info{flex:1;min-width:0;}
.lw-pw-eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px;}
.lw-pw-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;margin-bottom:4px;}
.lw-pw-sub{font-size:12px;color:var(--text-muted);margin-bottom:9px;}
.lw-pw-rules{display:flex;flex-wrap:wrap;gap:6px;font-size:10.5px;color:var(--text-faint);margin-bottom:4px;}
.lw-pw-roadmap{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px;}
.lw-pw-node{text-align:center;opacity:.4;transition:.2s;}
.lw-pw-node.reached{opacity:1;}
.lw-pw-node-icon{width:38px;height:38px;margin:0 auto 5px;}
.lw-pw-node-label{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text);}
.lw-pw-node-req{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);}
@media (max-width:640px){
  .lw-pw-card{flex-direction:column;align-items:center;text-align:center;}
  .lw-pw-rules{justify-content:center;}
  .lw-pw-roadmap{grid-template-columns:repeat(5,1fr);gap:6px;}
}

/* --- DNA --- */
.lw-dna-grid{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center;}
.lw-dna-narrative{font-size:13px;color:var(--text-muted);line-height:1.7;}
.lw-dna-narrative b{color:var(--gold-light);font-weight:600;}
.lw-dna-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;}
.lw-dna-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;padding:6px 12px;border-radius:20px;background:var(--accent-dim);color:var(--gold-light);border:1px solid var(--gold-dim);}

/* --- Community wall --- */
.lw-tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
.lw-tab{padding:10px 16px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:.15s;}
.lw-tab:hover{color:var(--text);}
.lw-tab.active{color:var(--gold-light);border-bottom-color:var(--accent);}
.lw-wall-list{display:flex;flex-direction:column;gap:10px;}
.lw-wall-row{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;border-left:3px solid transparent;transition:.2s;}
.lw-wall-row:hover{border-color:rgba(30,111,217,.3);background:var(--surface);}
.lw-wall-row.you{border-left-color:var(--accent);background:var(--nav-active-bg);}
.lw-wall-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-dim);color:var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-weight:700;font-size:12.5px;flex-shrink:0;}
.lw-wall-name{font-weight:600;font-size:12.5px;color:var(--text);}
.lw-wall-league-chip{font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:10px;margin-left:8px;}
.lw-wall-score-block{margin-left:auto;display:flex;align-items:center;gap:20px;}
.lw-wall-score{text-align:right;}
.lw-wall-score-num{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--text);}
.lw-wall-score-lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint);}
.lw-wall-bar-wrap{width:64px;height:5px;background:var(--surface);border-radius:5px;overflow:hidden;}
.lw-wall-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold-light));}

/* ================================================================
   PREMIUM LEADERBOARD (stats bar / podium / controls / table)
   ================================================================ */

@keyframes lwFadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes lwPodiumRise{from{opacity:0;transform:translateY(28px) scale(.94);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes lwGlowPulse{0%,100%{box-shadow:0 0 18px 0 var(--lw-glow,rgba(255,215,106,.25));}50%{box-shadow:0 0 34px 4px var(--lw-glow,rgba(255,215,106,.4));}}
@keyframes lwShimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes lwCrownFloat{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-4px) rotate(4deg);}}
@keyframes lwPopIn{0%{opacity:0;transform:scale(.85);}100%{opacity:1;transform:scale(1);}}

.lw-reveal{opacity:0;}
.lw-reveal.in-view{animation:lwFadeUp .5s cubic-bezier(.2,.7,.3,1) forwards;}

/* --- Stats bar --- */
.lw-stats-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
.lw-stat-card{position:relative;background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--border-soft);border-radius:12px;padding:16px 16px 14px;overflow:hidden;transition:.25s cubic-bezier(.2,.7,.3,1);}
.lw-stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold-light));opacity:.6;}
.lw-stat-card:hover{transform:translateY(-3px);border-color:rgba(77,166,255,.35);box-shadow:0 12px 28px rgba(4,8,15,.35);}
.lw-stat-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--accent-glow);color:var(--gold-light);margin-bottom:10px;}
.lw-stat-val{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--text);letter-spacing:.2px;line-height:1;}
.lw-stat-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-faint);margin-top:7px;}
.lw-stat-sub{font-size:10.5px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* --- Podium --- */
.lw-podium-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:26px;}
.lw-podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:end;width:100%;max-width:760px;}
.lw-podium-card{position:relative;border-radius:16px;padding:22px 16px 20px;text-align:center;background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--border-soft);opacity:0;animation:lwPodiumRise .6s cubic-bezier(.2,.7,.3,1) forwards;}
.lw-podium-card.rank-1{order:2;padding-top:34px;padding-bottom:28px;border-color:rgba(255,215,106,.4);--lw-glow:rgba(255,215,106,.32);animation:lwPodiumRise .6s cubic-bezier(.2,.7,.3,1) forwards,lwGlowPulse 3.2s ease-in-out .6s infinite;z-index:2;}
.lw-podium-card.rank-2{order:1;border-color:rgba(201,212,224,.35);animation-delay:.12s;}
.lw-podium-card.rank-3{order:3;border-color:rgba(196,130,80,.35);animation-delay:.24s;}
.lw-podium-card.rank-1{background:linear-gradient(160deg,rgba(255,215,106,.10) 0%,var(--surface) 60%);}
.lw-podium-card.rank-2{background:linear-gradient(160deg,rgba(201,212,224,.08) 0%,var(--surface) 60%);}
.lw-podium-card.rank-3{background:linear-gradient(160deg,rgba(196,130,80,.08) 0%,var(--surface) 60%);}
.lw-podium-medal{width:38px;height:38px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:15px;color:#0A0A0A;position:relative;}
.rank-1 .lw-podium-medal{width:46px;height:46px;font-size:18px;background:linear-gradient(145deg,#FFE9A8,#D9A93C);box-shadow:0 0 20px rgba(255,215,106,.5);}
.rank-2 .lw-podium-medal{background:linear-gradient(145deg,#E4EBF3,#A6B4C4);box-shadow:0 0 14px rgba(201,212,224,.35);}
.rank-3 .lw-podium-medal{background:linear-gradient(145deg,#E0AE85,#A15C33);box-shadow:0 0 14px rgba(196,130,80,.35);}
.lw-podium-crown{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:20px;animation:lwCrownFloat 2.6s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,215,106,.6));}
.lw-podium-avatar{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-weight:700;font-size:20px;background:var(--accent-dim);color:var(--gold-light);border:2px solid var(--border-soft);}
.rank-1 .lw-podium-avatar{width:66px;height:66px;font-size:24px;border-color:rgba(255,215,106,.5);}
.lw-podium-name{font-weight:700;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lw-podium-league{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;margin-top:2px;}
.lw-podium-score{font-family:var(--font-mono);font-weight:700;font-size:26px;color:var(--text);margin-top:12px;}
.rank-1 .lw-podium-score{font-size:32px;color:#FFD76A;}
.lw-podium-score-lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-top:2px;}
.lw-podium-trend{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:10.5px;font-weight:700;margin-top:9px;padding:3px 9px;border-radius:10px;}
.lw-podium-trend.up{color:var(--profit);background:var(--profit-dim);}
.lw-podium-trend.down{color:var(--loss);background:var(--loss-dim);}
.lw-podium-trend.flat{color:var(--text-faint);background:var(--surface-2);}
.lw-podium-bar{height:6px;border-radius:6px;margin-top:14px;background:var(--surface-2);}
.rank-1 .lw-podium-bar{background:linear-gradient(90deg,rgba(255,215,106,.15),rgba(255,215,106,.55));}
.rank-2 .lw-podium-bar{background:linear-gradient(90deg,rgba(201,212,224,.12),rgba(201,212,224,.45));}
.rank-3 .lw-podium-bar{background:linear-gradient(90deg,rgba(196,130,80,.12),rgba(196,130,80,.45));}

/* --- Controls: search / period / sort --- */
.lw-controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px;}
.lw-search-wrap{position:relative;flex:1;min-width:180px;}
.lw-search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-faint);pointer-events:none;}
.lw-search-input{width:100%;padding:9px 12px 9px 34px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:20px;color:var(--text);font-size:12.5px;font-family:var(--font-body);outline:none;transition:.2s;}
.lw-search-input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-glow);}
.lw-period-pills{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:20px;padding:3px;}
.lw-period-pill{font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:7px 13px;border-radius:16px;border:none;background:none;color:var(--text-faint);cursor:pointer;transition:.2s;white-space:nowrap;}
.lw-period-pill.active{background:linear-gradient(135deg,var(--accent),var(--gold-dim));color:#fff;box-shadow:0 2px 10px var(--accent-glow);}
.lw-period-pill:hover:not(.active){color:var(--text);}

/* --- Table --- */
.lw-table-wrap{border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;background:var(--surface);}
.lw-table-scroll{max-height:560px;overflow-y:auto;}
.lw-table{width:100%;border-collapse:collapse;}
.lw-table thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);backdrop-filter:blur(8px);font-family:var(--font-mono);font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-faint);text-align:left;padding:12px 14px;border-bottom:1px solid var(--border-soft);cursor:pointer;user-select:none;white-space:nowrap;}
.lw-table thead th:hover{color:var(--gold-light);}
.lw-table thead th.active{color:var(--gold-light);}
.lw-table thead th.num,.lw-table td.num{text-align:right;}
.lw-table tbody tr{opacity:0;animation:lwFadeUp .4s cubic-bezier(.2,.7,.3,1) forwards;border-bottom:1px solid var(--border-soft);transition:background .18s,transform .18s;}
.lw-table tbody tr:last-child{border-bottom:none;}
.lw-table tbody tr:hover{background:var(--nav-active-bg);transform:translateX(2px);}
.lw-table tbody tr.you{background:var(--nav-active-bg);box-shadow:inset 3px 0 0 var(--accent);}
.lw-table tbody tr.you:hover{background:rgba(30,111,217,.22);}
.lw-table td{padding:11px 14px;font-size:12.5px;color:var(--text);vertical-align:middle;}
.lw-rank-cell{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-weight:700;}
.lw-rank-num{width:22px;text-align:center;color:var(--text-muted);}
.lw-rank-num.top1{color:#FFD76A;}
.lw-rank-num.top2{color:#C9D4E0;}
.lw-rank-num.top3{color:#C48250;}
.lw-trend-arrow{font-size:10px;font-weight:700;}
.lw-trend-arrow.up{color:var(--profit);}
.lw-trend-arrow.down{color:var(--loss);}
.lw-trend-arrow.flat{color:var(--text-faint);}
.lw-trader-cell{display:flex;align-items:center;gap:10px;}
.lw-trader-cell .lw-t-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-dim);color:var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-weight:700;font-size:12px;flex-shrink:0;}
.lw-t-name{font-weight:600;font-size:12.5px;color:var(--text);}
.lw-t-level{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);margin-top:1px;}
.lw-league-chip-sm{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:9px;}
.lw-score-cell{font-family:var(--font-mono);font-weight:700;}
.lw-mini-bar-wrap{width:56px;height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:inline-block;margin-left:8px;vertical-align:middle;}
.lw-mini-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold-light));}
.lw-badge-count{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11px;color:var(--gold-light);}

/* --- Row hover profile preview --- */
.lw-preview-pop{position:absolute;z-index:50;min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 16px 40px rgba(0,0,0,.45);pointer-events:none;opacity:0;animation:lwPopIn .18s ease forwards;}
.lw-preview-pop .lw-pp-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:6px;}
.lw-preview-pop .lw-pp-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);padding:3px 0;}
.lw-preview-pop .lw-pp-row b{color:var(--text);font-family:var(--font-mono);}

/* --- Skeleton loading --- */
.lw-skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border-soft) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:lwShimmer 1.4s ease-in-out infinite;border-radius:8px;}
.lw-skel-row{display:flex;align-items:center;gap:14px;padding:12px 16px;}
.lw-skel-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;}
.lw-skel-line{height:10px;border-radius:4px;flex:1;max-width:140px;}
.lw-skel-podium{height:190px;border-radius:16px;}

@media(max-width:860px){
  .lw-stats-bar{grid-template-columns:repeat(2,1fr);}
  .lw-podium{grid-template-columns:1fr;max-width:320px;}
  .lw-podium-card.rank-1,.lw-podium-card.rank-2,.lw-podium-card.rank-3{order:0;}
  .lw-table thead{display:none;}
  .lw-table,.lw-table tbody,.lw-table tr,.lw-table td{display:block;width:100%;}
  .lw-table tbody tr{padding:10px 14px;}
}

@media(max-width:860px){
  .lw-standing{grid-template-columns:1fr;}
  .lw-standing-left{border-right:none;border-bottom:1px solid var(--border-soft);}
  .lw-score-row{grid-template-columns:repeat(3,1fr);row-gap:16px;}
  .lw-spot-grid{grid-template-columns:1fr 1fr;}
  .lw-badge-grid{grid-template-columns:repeat(2,1fr);}
  .lw-dna-grid{grid-template-columns:1fr;}
  .lw-ladder-req{display:none;}
}
@media(max-width:640px){
  .lw-spot-grid{grid-template-columns:1fr;}
  .lw-wall-score-block{gap:10px;}
}

/* ===== BLUBLU AI — animated bubbles (nav icon) ===== */
@keyframes blubluIconDrift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(.6px,-1px) scale(1.05)}
  100%{transform:translate(0,0) scale(1)}
}
.blublu-icon-anim{position:relative;width:24px;height:24px;flex-shrink:0;display:inline-block;margin:-4px 0;}
.blublu-icon-anim i{position:absolute;display:block;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#dff3ff 0%,#8fd4ff 28%,#6e8ff0 58%,#4b3aa8 100%);

.blublu-fg{position:relative;z-index:1;}

.blublu-attach-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex-shrink:0;border:1px solid var(--border-soft);border-radius:12px;background:var(--surface-2);color:var(--text-muted);cursor:pointer;transition:border-color .18s ease,color .18s ease,transform .15s ease,box-shadow .18s ease;}
.blublu-attach-btn:hover{border-color:rgba(110,143,240,.5);color:#8fb8ff;transform:translateY(-1px);box-shadow:0 4px 14px -8px rgba(110,143,240,.5);}

@keyframes blubluMsgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.blublu-msg-row{display:flex;align-items:flex-end;gap:8px;animation:blubluMsgIn .28s ease both;}

.blublu-bubble.blublu-bubble-ai:hover{border-color:rgba(110,143,240,.3);}
.blublu-bubble.blublu-bubble-user{background:linear-gradient(135deg,#6e8ff0,#4b3aa8);color:#fff;border-bottom-right-radius:4px;box-shadow:0 6px 18px -10px rgba(74,58,168,.6);}
.blublu-msg-meta{display:flex;align-items:center;gap:8px;padding:0 3px;}
.blublu-msg-time{font-size:10.5px;color:var(--text-muted);font-family:'DM Mono',monospace;opacity:.75;}
.blublu-copy-btn{display:inline-flex;align-items:center;gap:4px;border:none;background:none;color:var(--text-muted);cursor:pointer;font-size:10.5px;padding:1px 4px;border-radius:5px;transition:color .15s,background .15s;opacity:0;}
.blublu-msg-row:hover .blublu-copy-btn{opacity:1;}
.blublu-copy-btn:hover{color:#8fb8ff;background:var(--surface-2);}
.blublu-copy-btn.copied{opacity:1;color:#00E5A0;}
.blublu-typing{display:inline-flex;align-items:center;gap:4px;padding:4px 2px;}

.blublu-typing span:nth-child(2){animation-delay:.15s;}
.blublu-typing span:nth-child(3){animation-delay:.3s;}
@keyframes blubluTypingDot{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
.blublu-welcome{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 4px;max-height:80px;opacity:1;overflow:hidden;transition:max-height .35s ease,opacity .3s ease,padding .35s ease,margin .35s ease;}
.blublu-welcome.collapsed{max-height:0;opacity:0;padding:0;margin:0;pointer-events:none;}
.blublu-welcome-logo{position:relative;width:30px;height:30px;flex-shrink:0;border-radius:50%;
  background:radial-gradient(circle at 30% 25%, #cfe8ff 0%, #7fd8ff 12%, #4a6bff 35%, #6a3bff 55%, #1a0c3d 80%, #05021a 100%);
  box-shadow:0 0 10px rgba(110,143,240,.3),0 0 0 1px rgba(120,150,255,.15);}
.blublu-welcome-logo::after{content:'';position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(110,143,240,.14),transparent 72%);z-index:-1;}
.blublu-welcome-text{display:flex;flex-direction:column;gap:1px;}
.blublu-welcome-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--text);}
.blublu-welcome-sub{font-size:11.5px;color:var(--text-muted);letter-spacing:.01em;}
@keyframes blublu-pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@media(prefers-reduced-motion:reduce){

/* ============================================================
   BLUBLU AI VISION — future AI-vision workspace (upload, queue,
   history, result panel, status). Interface-only: no model is

   call — nothing else on this page needs to change when it ships.

.bv-tabs{display:flex;gap:6px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border-soft);width:max-content;margin-bottom:16px;}
.bv-tab{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:background .18s,color .18s;border:none;background:transparent;font-family:'Sora',sans-serif;}
.bv-tab:hover{color:var(--text);}
.bv-tab.active{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#fff;box-shadow:var(--shadow-accent);}
.bv-tab-badge{font-size:8.5px;letter-spacing:.4px;padding:2px 6px;border-radius:20px;background:rgba(110,143,240,.16);color:#8fb8ff;font-family:var(--font-mono);font-weight:700;}
.bv-tab.active .bv-tab-badge{background:rgba(255,255,255,.25);color:#fff;}
.bv-panel{display:none;}
.bv-panel.active{display:block;animation:bvFadeIn .3s ease both;}
@keyframes bvFadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.bv-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start;}
@media(max-width:980px){.bv-grid{grid-template-columns:1fr;}}

.bv-glass{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 35%),var(--surface);background-image:var(--glass-bg);border:1px solid var(--border-soft);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 22px 50px -32px rgba(10,14,30,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:var(--radius);}

.bv-upload{position:relative;border:1.5px dashed var(--border-soft);border-radius:16px;padding:36px 24px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s,transform .15s;overflow:hidden;}
.bv-upload:hover{border-color:rgba(110,143,240,.5);background:rgba(110,143,240,.04);}
.bv-upload.bv-drag-over{border-color:rgba(110,143,240,.75);background:rgba(110,143,240,.09);transform:scale(.995);}
.bv-upload-icon{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(circle at 30% 25%, #cfe8ff 0%, #7fd8ff 12%, #4a6bff 45%, #6a3bff 75%, #1a0c3d 100%);
  box-shadow:0 0 24px rgba(110,143,240,.35),0 0 0 1px rgba(120,150,255,.18);}
.bv-upload-icon svg{position:relative;z-index:1;color:#fff;}
.bv-upload.bv-drag-over .bv-upload-icon{animation:bvIconPulse 1s ease-in-out infinite;}
@keyframes bvIconPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.bv-upload-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;}
.bv-upload-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px;}
.bv-cat-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1;}
.bv-cat-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;border:1px solid var(--border-soft);background:var(--surface-2);font-size:11px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:border-color .15s,color .15s,background .15s;}
.bv-cat-chip:hover{color:var(--text);}
.bv-cat-chip.active{border-color:rgba(110,143,240,.6);color:#8fb8ff;background:rgba(110,143,240,.12);}
.bv-upload-scan{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#8fb8ff,transparent);opacity:0;pointer-events:none;}
.bv-upload.bv-drag-over .bv-upload-scan{opacity:1;animation:bvScan 1.4s linear infinite;}
@keyframes bvScan{0%{top:0;}100%{top:100%;}}

.bv-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.bv-count-pill{font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border-soft);padding:3px 9px;border-radius:20px;}

.bv-queue-empty,.bv-hist-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 10px;text-align:center;color:var(--text-muted);font-size:12px;}
.bv-queue-list{display:flex;flex-direction:column;gap:8px;}
.bv-queue-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;border:1px solid var(--border-soft);background:var(--surface-2);transition:border-color .15s,background .15s;cursor:pointer;}
.bv-queue-item:hover{border-color:rgba(110,143,240,.4);}
.bv-queue-item.selected{border-color:rgba(110,143,240,.7);background:rgba(110,143,240,.08);}
.bv-thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border-soft);}
.bv-qi-body{flex:1;min-width:0;}
.bv-qi-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.bv-qi-meta{display:flex;align-items:center;gap:6px;margin-top:2px;}
.bv-cat-tag{font-size:9.5px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:6px;background:rgba(110,143,240,.14);color:#8fb8ff;font-family:var(--font-mono);}
.bv-qi-time{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);}
.bv-qi-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.bv-icon-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border-soft);background:var(--surface);color:var(--text-muted);cursor:pointer;transition:border-color .15s,color .15s;flex-shrink:0;}
.bv-icon-btn:hover{border-color:rgba(110,143,240,.5);color:#8fb8ff;}
.bv-icon-btn.bv-danger:hover{border-color:rgba(255,93,115,.5);color:var(--loss);}
.bv-queue-spinner{width:13px;height:13px;border-radius:50%;border:2px solid rgba(110,143,240,.25);border-top-color:#8fb8ff;animation:bvSpin .8s linear infinite;}
@keyframes bvSpin{to{transform:rotate(360deg);}}

.bv-status-pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:20px;font-family:var(--font-mono);}
.bv-status-queued{color:#E8B84B;background:rgba(232,184,75,.13);}
.bv-status-pending{color:#8fb8ff;background:rgba(110,143,240,.13);}
.bv-status-dot-sm{width:5px;height:5px;border-radius:50%;background:currentColor;}

.bv-result-panel{display:flex;flex-direction:column;gap:14px;}
.bv-result-preview{width:100%;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--border-soft);background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-faint);font-size:12px;}
.bv-result-preview img{width:100%;height:100%;object-fit:cover;}
.bv-result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bv-result-card{padding:12px 13px;border-radius:11px;border:1px solid var(--border-soft);background:var(--surface-2);}
.bv-result-label{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);font-family:var(--font-mono);margin-bottom:6px;}
.bv-result-value{font-size:13.5px;font-weight:700;color:var(--text-muted);font-family:'Sora',sans-serif;}
.bv-result-value.bv-pending{color:var(--text-faint);font-weight:500;font-style:italic;}
.bv-feedback-box{padding:13px 14px;border-radius:11px;border:1px dashed var(--border-soft);background:var(--surface-2);font-size:12px;line-height:1.65;color:var(--text-muted);}

.bv-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:760px){.bv-stat-grid{grid-template-columns:repeat(2,1fr);}}
.bv-stat-card{padding:14px 15px;border-radius:12px;border:1px solid var(--border-soft);background:var(--surface-2);}
.bv-stat-label{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);font-family:var(--font-mono);margin-bottom:7px;display:flex;align-items:center;gap:6px;}
.bv-stat-value{font-size:19px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text);letter-spacing:-.2px;}
.bv-model-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(232,184,75,.13);color:#E8B84B;font-family:var(--font-mono);}
.bv-model-badge .bv-status-dot-sm{background:#E8B84B;animation:blublu-pulse 1.8s ease-in-out infinite;}

.bv-hist-table{width:100%;border-collapse:collapse;}
.bv-hist-table th{text-align:left;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint);font-family:var(--font-mono);font-weight:600;padding:0 12px 10px;border-bottom:1px solid var(--border-soft);}
.bv-hist-table td{padding:11px 12px;font-size:12.5px;color:var(--text);border-bottom:1px solid var(--border-soft);vertical-align:middle;}
.bv-hist-table tr:last-child td{border-bottom:none;}
.bv-hist-table tr{cursor:pointer;transition:background .15s;}
.bv-hist-table tr:hover td{background:rgba(110,143,240,.05);}
.bv-hist-name{display:flex;align-items:center;gap:9px;font-weight:600;}
.bv-view-report-btn{display:inline-flex;align-items:center;gap:5px;}
@media(prefers-reduced-motion:reduce){
  .bv-upload.bv-drag-over .bv-upload-icon,.bv-upload.bv-drag-over .bv-upload-scan,.bv-queue-spinner,.bv-model-badge .bv-status-dot-sm{animation:none;}
}

.bv-summary-card{padding:12px 13px;border-radius:11px;border:1px solid var(--border-soft);background:var(--surface-2);}
.bv-summary-card .bv-result-label{margin-bottom:5px;}
.bv-summary-card .bv-summary-val{font-size:13px;font-weight:700;color:var(--text);font-family:'Sora',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.bv-seg-row{display:flex;gap:8px;}

.blublu-fg .bv-glass{

  border-color:rgba(126,180,255,.18);

    linear-gradient(155deg,rgba(255,255,255,.032),rgba(255,255,255,.006) 48%),
    rgba(7,12,24,.66);

  content:"";
  position:absolute;
  inset:0 0 auto;
  height:1px;
  pointer-events:none;

    linear-gradient(135deg,rgba(58,148,255,.11),rgba(116,77,236,.065)),

.blublu-fg .bv-queue-item,
.blublu-fg .bv-result-card,

.blublu-fg .bv-queue-item:hover,
.blublu-fg .bv-result-card:hover,
.blublu-fg .bv-stat-card:hover{

.blublu-fg .bv-stat-card{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;}
.blublu-fg .bv-result-preview{
  border-color:rgba(121,183,255,.18);

    radial-gradient(circle at 50% 45%,rgba(74,153,255,.09),transparent 42%),

    linear-gradient(90deg,rgba(113,176,255,.025) 1px,transparent 1px),

.blublu-fg .bv-hist-table tr:hover td{background:rgba(75,153,255,.06);}
.blublu-fg .bv-icon-btn{background:rgba(9,17,32,.72);border-color:rgba(125,181,255,.15);}
.blublu-fg .bv-icon-btn:hover{border-color:rgba(93,214,255,.46);color:#9deaff;box-shadow:0 0 20px -12px rgba(91,210,255,.66);}

/* Surrounding app chrome while Blublu is open */
body:has(.blublu-fg) .app-header{
  border-bottom-color:rgba(105,173,255,.13);

  box-shadow:0 12px 38px -34px rgba(70,157,255,.7);
}
body:has(.blublu-fg) .nav-item-blublu.active{
  border-color:rgba(102,210,255,.25)!important;
  background:linear-gradient(100deg,rgba(61,137,255,.15),rgba(115,77,232,.08))!important;

}

  .blublu-fg .blublu-welcome{padding:11px 13px;}

  .blublu-fg::before,
  .blublu-fg::after,
  .blublu-fg .blublu-welcome-logo,
  .blublu-fg .blublu-welcome-logo::before,
  .blublu-fg .bv-tab.active::after,
  .blublu-fg .blublu-chat-panel,
  .blublu-fg .bv-panel.active,
  .blublu-fg .bv-upload-icon{animation:none!important;}
  .blublu-fg .blublu-bubble:hover,
  .blublu-fg .bv-queue-item:hover,
  .blublu-fg .bv-result-card:hover,
  .blublu-fg .bv-stat-card:hover{transform:none!important;}
}

/* ============================================================

.summaries-page{display:grid;gap:18px;max-width:1540px;margin:0 auto;padding-bottom:28px;font-family:var(--font-body);}
.summaries-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:4px 0 2px;}
.summaries-kicker,.summary-report-head>div>span,.summary-section-heading>span,.summary-ledger-head>div>span{display:block;margin-bottom:7px;color:var(--gold);font:600 10px/1.2 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;}
.summaries-head h1{margin:0;color:var(--text);font:700 clamp(27px,3vw,40px)/1.05 var(--font-body);letter-spacing:-.035em;}
.summaries-head p{max-width:650px;margin:9px 0 0;color:var(--text-muted);font-size:13px;line-height:1.65;}
.summaries-year-nav{display:flex;align-items:center;gap:7px;padding:6px;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);box-shadow:var(--shadow-sm),var(--inner-hairline);}
.summaries-year-nav button{display:grid;place-items:center;width:36px;height:36px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text-muted);font-size:17px;transition:.18s ease;}
.summaries-year-nav button:hover{border-color:var(--border);background:var(--surface-2);color:var(--text);}
.summaries-year-nav>div{display:flex;flex-direction:column;align-items:center;gap:4px;}
.summaries-year-nav span{color:var(--text-faint);font:600 7px/1 'DM Mono',monospace;letter-spacing:.1em;}
.summaries-year-nav strong{min-width:82px;color:var(--text);font:700 14px/1 var(--font-mono);text-align:center;letter-spacing:.04em;}

.summary-hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(420px,.9fr);gap:14px;}
.summary-result-card,.summary-kpi-grid article,.summary-outcome-card,.summary-insights-card,.summary-report-panel{position:relative;overflow:hidden;border:1px solid var(--border);background:linear-gradient(145deg,color-mix(in srgb,var(--surface-2) 78%,transparent),color-mix(in srgb,var(--surface) 95%,transparent));box-shadow:var(--shadow-sm),var(--inner-hairline);}
.summary-result-card{min-height:260px;padding:27px 29px;border-radius:16px;isolation:isolate;}
.summary-result-card::before{position:absolute;z-index:-1;right:-90px;bottom:-145px;width:330px;height:330px;border-radius:50%;content:"";background:radial-gradient(circle,rgba(0,229,160,.18),rgba(0,229,160,0) 68%);pointer-events:none;}
.summary-result-card.negative::before{background:radial-gradient(circle,rgba(255,77,109,.16),rgba(255,77,109,0) 68%);}
.summary-result-card.flat::before{background:radial-gradient(circle,var(--accent-glow),transparent 68%);}
.summary-result-card::after{position:absolute;top:25px;right:27px;width:8px;height:8px;border-radius:50%;content:"";background:var(--profit);box-shadow:0 0 0 6px rgba(0,229,160,.08),0 0 22px rgba(0,229,160,.5);}
.summary-result-card.negative::after{background:var(--loss);box-shadow:0 0 0 6px rgba(255,77,109,.08),0 0 22px rgba(255,77,109,.45);}
.summary-result-card.flat::after{background:var(--gold);box-shadow:0 0 0 6px var(--accent-glow),0 0 22px var(--accent-glow);}
.summary-result-top{display:flex;justify-content:space-between;gap:28px;padding-right:30px;color:var(--text-muted);font:600 10px/1.3 'DM Mono',monospace;letter-spacing:.13em;}
.summary-result-top span{color:var(--gold);}
.summary-result-card>strong{display:block;margin:24px 0 26px;color:var(--profit);font:800 clamp(38px,5vw,64px)/.95 var(--font-mono);letter-spacing:-.045em;}
.summary-result-card.negative>strong{color:var(--loss);}
.summary-result-card.flat>strong{color:var(--text);}
.summary-result-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:570px;}
.summary-result-meta>div{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--border-soft);border-radius:10px;background:color-mix(in srgb,var(--bg) 45%,transparent);}
.summary-result-meta span{color:var(--text-muted);font-size:10px;text-transform:uppercase;letter-spacing:.09em;}
.summary-result-meta b{color:var(--text);font:700 16px/1.2 var(--font-mono);}
.summary-result-card>p{margin:17px 0 0;color:var(--text-muted);font-size:12px;line-height:1.55;}

.summary-kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.summary-kpi-grid article{min-height:123px;padding:19px 20px;border-radius:14px;transition:border-color .2s ease,background .2s ease;}
.summary-kpi-grid article:hover{border-color:color-mix(in srgb,var(--gold) 42%,var(--border));background:color-mix(in srgb,var(--surface-2) 88%,var(--surface));}
.summary-kpi-grid span{display:block;color:var(--text-muted);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;}
.summary-kpi-grid strong{display:block;margin:12px 0 7px;color:var(--text);font:750 clamp(24px,2.5vw,34px)/1 var(--font-mono);letter-spacing:-.025em;}
.summary-kpi-grid small{display:block;color:var(--text-faint);font-size:10px;line-height:1.35;}

.summary-insight-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:14px;}
.summary-outcome-card,.summary-insights-card{min-height:242px;padding:22px 23px;border-radius:15px;}
.summary-outcome-card{display:flex;flex-direction:column;box-shadow:var(--inner-hairline);}
.summary-section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.summary-section-heading h2{margin:0;color:var(--text);font:700 17px/1.25 var(--font-body);letter-spacing:-.02em;}
.summary-section-heading small{padding:6px 8px;border:1px solid var(--border-soft);border-radius:7px;color:var(--text-faint);font:600 9px/1 'DM Mono',monospace;letter-spacing:.08em;}
.summary-outcome-body{display:grid;grid-template-columns:minmax(130px,.65fr) minmax(230px,1.35fr);align-items:stretch;flex:1;gap:18px;min-height:164px;margin-top:17px;}
.summary-outcome-score{display:flex;flex-direction:column;justify-content:center;padding:18px;border:1px solid var(--border-soft);border-radius:10px;background:color-mix(in srgb,var(--bg) 28%,transparent);}
.summary-outcome-score>span{color:var(--text-muted);font:600 8px/1 'DM Mono',monospace;letter-spacing:.14em;}
.summary-outcome-score>strong{display:block;margin:12px 0 10px;color:var(--text);font:750 clamp(28px,3vw,38px)/1 var(--font-mono);letter-spacing:-.04em;}
.summary-outcome-score>small{color:var(--text-faint);font-size:9px;line-height:1.5;}
.summary-outcome-breakdown{display:flex;flex-direction:column;justify-content:center;gap:15px;padding:8px 3px;}
.summary-outcome-row>div:first-child{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;}
.summary-outcome-row span{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:10px;}
.summary-outcome-row span i{width:6px;height:6px;border-radius:50%;background:var(--be);}
.summary-outcome-row.win span i{background:color-mix(in srgb,var(--profit) 72%,var(--text-muted));}
.summary-outcome-row.loss span i{background:color-mix(in srgb,var(--loss) 72%,var(--text-muted));}
.summary-outcome-row b{color:var(--text);font:700 11px/1 var(--font-mono);}
.summary-outcome-track{height:4px;overflow:hidden;border-radius:4px;background:color-mix(in srgb,var(--border) 72%,transparent);}
.summary-outcome-track>i{display:block;width:var(--outcome-width);height:100%;border-radius:inherit;background:color-mix(in srgb,var(--be) 72%,var(--surface));}
.summary-outcome-row.win .summary-outcome-track>i{background:color-mix(in srgb,var(--profit) 68%,var(--surface));}
.summary-outcome-row.loss .summary-outcome-track>i{background:color-mix(in srgb,var(--loss) 68%,var(--surface));}
.summary-insight-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px;}
.summary-insight-list>div{min-height:76px;padding:13px 14px;border:1px solid var(--border-soft);border-radius:10px;background:color-mix(in srgb,var(--bg) 34%,transparent);}
.summary-insight-list span{display:block;margin-bottom:8px;color:var(--text-faint);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
.summary-insight-list strong{display:block;color:var(--text);font:700 14px/1.25 var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.summary-insight-list b{display:block;margin-top:5px;color:var(--text-muted);font:600 10px/1.3 var(--font-mono);}

.summary-report-panel{padding:23px;border-radius:16px;}
.summary-report-panel.weekly{margin-top:0;}
.summary-report-head,.summary-ledger-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;}
.summary-report-head h2{margin:0;color:var(--text);font:700 20px/1.2 var(--font-body);letter-spacing:-.025em;}
.summary-report-head p{margin:7px 0 0;color:var(--text-muted);font-size:11px;line-height:1.5;}
.summary-report-badge{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--profit) 28%,var(--border));border-radius:8px;background:rgba(0,229,160,.055);color:var(--profit);font:600 9px/1 'DM Mono',monospace;letter-spacing:.075em;white-space:nowrap;}
.summary-report-badge i{width:6px;height:6px;border-radius:50%;background:var(--profit);box-shadow:0 0 9px rgba(0,229,160,.45);}
.summary-report-badge.neutral{border-color:var(--border);background:var(--surface-2);color:var(--text-muted);}

.summary-month-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:21px 0 25px;}
.summary-month-card{min-width:0;padding:13px 14px;border:1px solid var(--border-soft);border-radius:11px;background:color-mix(in srgb,var(--bg) 38%,transparent);transition:border-color .2s ease,background .2s ease;}
.summary-month-card:hover{border-color:color-mix(in srgb,var(--gold) 34%,var(--border));background:color-mix(in srgb,var(--surface-2) 75%,transparent);}
.summary-month-card.empty{opacity:.62;}
.summary-month-card header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;}
.summary-month-card header>span{color:var(--text-faint);font:600 9px/1 'DM Mono',monospace;}
.summary-month-card header strong{color:var(--text);font:700 11px/1 var(--font-body);letter-spacing:.06em;}
.summary-month-card header small{color:var(--text-faint);font-size:8px;white-space:nowrap;}
.summary-month-bar{position:relative;height:22px;margin:12px 0 9px;border-bottom:1px solid var(--border-soft);}
.summary-month-bar::before{position:absolute;top:2px;bottom:3px;left:50%;width:1px;content:"";background:var(--border);}
.summary-month-bar i{position:absolute;bottom:4px;height:5px;border-radius:6px;background:var(--profit);box-shadow:0 0 9px rgba(0,229,160,.25);}
.summary-month-bar i.positive{left:50%;width:var(--summary-bar);}
.summary-month-bar i.negative{right:50%;width:var(--summary-bar);background:var(--loss);box-shadow:0 0 9px rgba(255,77,109,.2);}
.summary-month-bar i.flat{display:none;}
.summary-month-result{display:flex;align-items:flex-end;justify-content:space-between;gap:9px;}
.summary-month-result b{font:700 14px/1 var(--font-mono);}
.summary-month-result span{color:var(--text-muted);font-size:8px;white-space:nowrap;}
.summary-month-card.empty .summary-month-result b{color:var(--text-faint)!important;}

.summary-ledger-head{padding-top:19px;border-top:1px solid var(--border-soft);}
.summary-ledger-head h3{margin:0;color:var(--text);font:700 15px/1.25 var(--font-body);}
.summary-ledger-head>small{color:var(--text-faint);font:500 9px/1.4 'DM Mono',monospace;letter-spacing:.04em;}
.summary-table-wrap{margin-top:14px;border:1px solid var(--border-soft);border-radius:11px;background:color-mix(in srgb,var(--bg) 28%,transparent);}
.summary-table{width:100%;min-width:760px;border-collapse:collapse;}
.summary-table th{padding:11px 13px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface-2) 72%,transparent);color:var(--text-faint);font:600 8.5px/1.2 'DM Mono',monospace;letter-spacing:.08em;text-align:right;text-transform:uppercase;white-space:nowrap;}
.summary-table th:first-child,.summary-table.weekly th:nth-child(2){text-align:left;}
.summary-table td{padding:11px 13px;border-bottom:1px solid var(--border-soft);color:var(--text-muted);font:600 11px/1.35 var(--font-mono);text-align:right;white-space:nowrap;}
.summary-table td:first-child,.summary-table.weekly td:nth-child(2){text-align:left;}
.summary-table tbody tr:last-child td{border-bottom:0;}
.summary-table tbody tr:not(.summary-total-row):hover td{background:color-mix(in srgb,var(--accent) 5%,transparent);color:var(--text);}
.summary-table-period{color:var(--text);font-family:var(--font-body);font-weight:600;}
.summary-empty-row{opacity:.52;}
.summary-total-row td{border-top:1px solid color-mix(in srgb,var(--gold) 30%,var(--border));background:color-mix(in srgb,var(--accent) 7%,var(--surface));color:var(--text);font-weight:700;}
.summary-week-number{display:inline-flex;align-items:center;justify-content:center;min-width:38px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--gold);font:600 9px/1 'DM Mono',monospace;}
.summary-week-end{display:block;margin-top:3px;color:var(--text-faint);font-size:8px;}
.summary-empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;text-align:center;}
.summary-empty-state span{color:var(--gold);font:600 9px/1 'DM Mono',monospace;letter-spacing:.12em;}
.summary-empty-state strong{margin-top:12px;color:var(--text);font-size:14px;}
.summary-empty-state small{margin-top:6px;color:var(--text-faint);font-size:10px;}

@media(max-width:1100px){
  .summary-hero-grid{grid-template-columns:1fr;}
  .summary-kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
  .summary-kpi-grid article{min-height:112px;}
  .summary-month-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:820px){
  .summaries-head,.summary-report-head,.summary-ledger-head{align-items:flex-start;flex-direction:column;}
  .summaries-year-nav{align-self:stretch;justify-content:space-between;}
  .summary-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .summary-insight-grid{grid-template-columns:1fr;}
  .summary-month-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .summary-report-badge{white-space:normal;}
}
@media(max-width:560px){
  .summaries-page{gap:12px;}
  .summary-result-card,.summary-outcome-card,.summary-insights-card,.summary-report-panel{padding:18px;border-radius:13px;}
  .summary-result-top{flex-direction:column;gap:5px;}
  .summary-result-meta,.summary-insight-list{grid-template-columns:1fr;}
  .summary-kpi-grid,.summary-month-grid{grid-template-columns:1fr;}
  .summary-outcome-body{grid-template-columns:1fr;gap:12px;min-height:0;}
  .summary-outcome-score{padding:15px;}
}

/* ============================================================
   RISK CALCULATOR — position sizing workspace
   ============================================================ */
.risk-calc-page{display:grid;gap:18px;max-width:1500px;margin:0 auto;padding-bottom:28px;font-family:var(--font-body);}
.risk-calc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:4px 0 3px;}
.risk-calc-kicker{display:block;margin-bottom:8px;color:var(--gold);font:600 10px/1.2 'DM Mono',monospace;letter-spacing:.16em;}
.risk-calc-head h1{margin:0;color:var(--text);font:700 clamp(28px,3vw,40px)/1.05 var(--font-body);letter-spacing:-.035em;}
.risk-calc-head p{max-width:690px;margin:9px 0 0;color:var(--text-muted);font-size:13px;line-height:1.65;}
.risk-account-chip{display:flex;flex-direction:column;align-items:flex-end;min-width:215px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:color-mix(in srgb,var(--surface) 90%,transparent);box-shadow:var(--inner-hairline);}
.risk-account-chip span{color:var(--text-faint);font:600 8px/1 'DM Mono',monospace;letter-spacing:.12em;}
.risk-account-chip strong{max-width:240px;margin-top:7px;overflow:hidden;color:var(--text);font:700 13px/1.2 var(--font-body);text-overflow:ellipsis;white-space:nowrap;}
.risk-account-chip small{margin-top:5px;color:var(--text-muted);font:500 9px/1.2 var(--font-mono);}

.risk-calc-layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(390px,.88fr);align-items:start;gap:14px;}
.risk-input-panel,.risk-output-panel,.risk-process-strip{border:1px solid var(--border);background:linear-gradient(145deg,color-mix(in srgb,var(--surface-2) 76%,transparent),color-mix(in srgb,var(--surface) 95%,transparent));box-shadow:var(--shadow-sm),var(--inner-hairline);}
.risk-input-panel,.risk-output-panel{border-radius:16px;}
.risk-input-panel{padding:23px;}
.risk-output-panel{position:sticky;top:18px;padding:23px;}
.risk-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--border-soft);}
.risk-panel-head>div:first-child>span{display:block;margin-bottom:7px;color:var(--gold);font:600 9px/1.2 'DM Mono',monospace;letter-spacing:.13em;}
.risk-panel-head h2{margin:0;color:var(--text);font:700 19px/1.2 var(--font-body);letter-spacing:-.025em;}
.risk-panel-head p{margin:7px 0 0;color:var(--text-muted);font-size:10px;line-height:1.5;}
.risk-panel-tag{padding:6px 8px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);color:var(--text-faint);font:600 8px/1 'DM Mono',monospace;letter-spacing:.1em;}
.risk-live-state{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid color-mix(in srgb,var(--profit) 22%,var(--border));border-radius:7px;background:color-mix(in srgb,var(--profit) 4%,var(--surface));color:color-mix(in srgb,var(--profit) 72%,var(--text));font:600 8px/1 'DM Mono',monospace;letter-spacing:.1em;}
.risk-live-state i{width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--profit) 70%,var(--text-muted));}

.risk-input-section{padding:20px 0;border-bottom:1px solid var(--border-soft);}
.risk-input-section:last-child{padding-bottom:0;border-bottom:0;}
.risk-section-title{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:13px;}
.risk-section-title>span{color:var(--text-muted);font:650 9px/1.2 'DM Mono',monospace;letter-spacing:.12em;}
.risk-section-title>small{color:var(--text-faint);font-size:8px;line-height:1.3;text-align:right;}
.risk-form-grid{display:grid;gap:11px;}
.risk-form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr));}
.risk-form-grid.price{grid-template-columns:repeat(3,minmax(0,1fr));}
.risk-form-grid.contract{grid-template-columns:minmax(0,1fr);}
.risk-field{display:flex;min-width:0;flex-direction:column;gap:7px;}
.risk-field>span{color:var(--text-muted);font-size:9px;font-weight:650;letter-spacing:.065em;text-transform:uppercase;}
.risk-field>span i{margin-left:5px;color:var(--text-faint);font:600 7px/1 'DM Mono',monospace;font-style:normal;letter-spacing:.08em;}
.risk-field>small{margin-top:-1px;color:var(--text-faint);font-size:7.5px;line-height:1.35;}
.risk-calc-page .lg-input{height:45px;min-width:0;padding:0 13px;border-color:var(--border);border-radius:9px;background:color-mix(in srgb,var(--bg) 44%,var(--surface));color:var(--text);font:600 12px/1 var(--font-body);box-shadow:inset 0 1px 0 rgba(255,255,255,.02);}
.risk-calc-page .lg-input::placeholder{color:var(--text-faint);opacity:.82;}
.risk-calc-page .lg-input:focus{transform:none;border-color:color-mix(in srgb,var(--gold) 55%,var(--border));background:var(--surface-2);box-shadow:0 0 0 3px var(--accent-glow);}
.risk-calc-page .journal-select-button{height:45px!important;border-color:var(--border)!important;border-radius:9px!important;background:color-mix(in srgb,var(--bg) 44%,var(--surface))!important;color:var(--text)!important;font-size:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)!important;}
.risk-field.custom{grid-column:1/-1;}

.risk-lot-hero{margin-top:18px;padding:22px;border:1px solid color-mix(in srgb,var(--gold) 24%,var(--border));border-radius:12px;background:color-mix(in srgb,var(--accent) 6%,var(--surface));}
.risk-lot-hero>span{display:block;color:var(--gold);font:600 9px/1 'DM Mono',monospace;letter-spacing:.14em;}
.risk-lot-hero>div{display:flex;align-items:baseline;gap:10px;margin:16px 0 9px;}
.risk-lot-hero strong{color:var(--text);font:800 clamp(44px,5vw,66px)/.88 var(--font-mono);letter-spacing:-.055em;}
.risk-lot-hero b{color:var(--text-muted);font:650 11px/1 var(--font-mono);letter-spacing:.12em;}
.risk-lot-hero small{color:var(--text-faint);font-size:9px;line-height:1.45;}
.risk-result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px;}
.risk-result-card{min-width:0;padding:14px 13px;border:1px solid var(--border-soft);border-radius:10px;background:color-mix(in srgb,var(--bg) 35%,transparent);}
.risk-result-card>span{display:block;color:var(--text-faint);font:600 7.5px/1.2 'DM Mono',monospace;letter-spacing:.095em;}
.risk-result-card>strong{display:block;margin:11px 0 7px;overflow:hidden;color:var(--text);font:750 clamp(16px,1.8vw,22px)/1 var(--font-mono);letter-spacing:-.025em;text-overflow:ellipsis;white-space:nowrap;}
.risk-result-card>small{display:block;color:var(--text-faint);font-size:7.5px;line-height:1.35;}
.risk-profit-card{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:10px;padding:15px 16px;border:1px solid color-mix(in srgb,var(--profit) 18%,var(--border));border-radius:10px;background:color-mix(in srgb,var(--profit) 3%,var(--surface));}
.risk-profit-card span{display:block;color:var(--text-muted);font:600 8px/1.2 'DM Mono',monospace;letter-spacing:.1em;}
.risk-profit-card small{display:block;margin-top:5px;color:var(--text-faint);font-size:8px;}
.risk-profit-card strong{color:var(--profit);font:750 clamp(19px,2vw,25px)/1 var(--font-mono);white-space:nowrap;}
.risk-safety-note{margin-top:14px;padding:13px 14px;border-left:2px solid color-mix(in srgb,var(--gold) 55%,var(--border));background:color-mix(in srgb,var(--bg) 28%,transparent);}
.risk-safety-note span{display:block;margin-bottom:6px;color:var(--text-muted);font:600 8px/1 'DM Mono',monospace;letter-spacing:.12em;}
.risk-safety-note p{margin:0;color:var(--text-faint);font-size:8.5px;line-height:1.55;}

.risk-process-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:13px;overflow:hidden;}
.risk-process-strip>div{display:flex;align-items:center;gap:13px;padding:16px 18px;border-right:1px solid var(--border-soft);}
.risk-process-strip>div:last-child{border-right:0;}
