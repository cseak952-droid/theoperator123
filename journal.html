/* ============================================================
   MANA STREAM THEME
   ============================================================ */
[data-theme="mana-stream"]{
  --bg:#050509; --sidebar:#07070E; --surface:#0D0A18; --surface-2:#130F22;
  --border:rgba(123,47,255,.18); --border-soft:rgba(123,47,255,.10);
  --field-border:rgba(123,47,255,.22); --text-main:#E8E0FF;
  --accent:#7B2FFF; --accent-dim:rgba(123,47,255,.18); --accent-glow:rgba(123,47,255,.25);
  --gold:#00D4FF; --gold-light:#00D4FF; --gold-dim:#0099CC;
  --text:#E8E0FF; --text-muted:#A090CC; --text-faint:#5A4A80;
  --profit:#00E5A0; --profit-dim:rgba(0,229,160,.12);
  --loss:#FF4D6D; --loss-dim:rgba(255,77,109,.12);
  --be:#5A4A80;
  --topbar-a:#2D005E; --topbar-b:#00264D;
  --nav-active-bg:rgba(123,47,255,.12); --nav-active-border:rgba(123,47,255,.35);
  --font-display:'Cormorant Garamond',serif; --font-body:'Sora',sans-serif; --font-mono:'Outfit',sans-serif; --radius:10px;
}

/* Mana Stream — animated mesh blobs behind everything */
#mana-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  display:none;overflow:hidden;
  background:#050509;
}
[data-theme="mana-stream"] #mana-bg{ display:block; }
[data-theme="mana-stream"] #screen-app{ background:transparent !important; }
[data-theme="mana-stream"] .app-header{ background:rgba(5,5,9,.75) !important; backdrop-filter:blur(12px); }
[data-theme="mana-stream"] .sidebar{ background:rgba(7,7,14,.82) !important; backdrop-filter:blur(10px); }
[data-theme="mana-stream"] .page{ background:transparent !important; }

.mana-blob{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:0;
  will-change:transform,opacity;
}
.mana-blob-1{
  width:700px;height:700px;
  background:radial-gradient(circle,#2D005E,transparent 70%);
  top:-20%;left:-15%;
  animation:mana-drift-1 28s ease-in-out infinite;
}
.mana-blob-2{
  width:600px;height:600px;
  background:radial-gradient(circle,#00264D,transparent 70%);
  bottom:-15%;right:-10%;
  animation:mana-drift-2 34s ease-in-out infinite;
}
.mana-blob-3{
  width:500px;height:500px;
  background:radial-gradient(circle,#1A0040,transparent 70%);
  top:35%;left:35%;
  animation:mana-drift-3 22s ease-in-out infinite;
}
.mana-blob-4{
  width:350px;height:350px;
  background:radial-gradient(circle,#002840,transparent 70%);
  top:10%;right:20%;
  animation:mana-drift-4 40s ease-in-out infinite;
}
@keyframes mana-drift-1{
  0%,100%{transform:translate(0,0) scale(1);opacity:.55;}
  33%{transform:translate(120px,80px) scale(1.12);opacity:.7;}
  66%{transform:translate(-60px,140px) scale(.92);opacity:.45;}
}
@keyframes mana-drift-2{
  0%,100%{transform:translate(0,0) scale(1);opacity:.5;}
  40%{transform:translate(-100px,-80px) scale(1.1);opacity:.65;}
  70%{transform:translate(80px,-40px) scale(.95);opacity:.4;}
}
@keyframes mana-drift-3{
  0%,100%{transform:translate(0,0) scale(1);opacity:.35;}
  50%{transform:translate(-80px,60px) scale(1.15);opacity:.55;}
}
@keyframes mana-drift-4{
  0%,100%{transform:translate(0,0) scale(1);opacity:.4;}
  30%{transform:translate(60px,100px) scale(.9);opacity:.55;}
  70%{transform:translate(-40px,-60px) scale(1.08);opacity:.3;}
}

/* Mana particle canvas */
#mana-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;transition:opacity 1.2s ease;pointer-events:none;
}
[data-theme="mana-stream"] #mana-canvas{ opacity:1; }

/* ============================================================
   REFINED PAGE & COMPONENT STATES
   (Bloomberg/TradingView/Stripe direction — glass surfaces, soft
   shadows, quiet ambient light. No shimmer, pulse, or neon glow.)
   ============================================================ */

/* Page entrance — a single quiet fade/rise, no bounce */
@keyframes page-enter{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.page{animation:page-enter .45s cubic-bezier(.16,1,.3,1) both;}

/* Stat cards — glass surface, soft directional shadow on hover */
.stat{
  background-image:var(--glass-bg) !important;
  box-shadow:var(--shadow-xs),var(--inner-hairline) !important;
  transition:border-color .2s,transform .2s cubic-bezier(.4,0,.2,1),box-shadow .3s ease,background .25s !important;
  cursor:default;
}
.stat:hover{
  border-color:rgba(255,255,255,.14) !important;
  transform:translateY(-2px) !important;
  box-shadow:var(--shadow-md),var(--inner-hairline) !important;
}
.stat::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.03) 0%,transparent 60%);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.stat:hover::after{opacity:1;}
.stat::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0;transition:opacity .25s;
}
.stat:hover::before{opacity:1;}

/* Ambient background orbs — very low intensity, static-feeling */
#home-bg-orbs{
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
}
.home-orb{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.4;
  animation:orb-breathe ease-in-out infinite;
}
.home-orb-1{width:600px;height:600px;background:radial-gradient(circle,rgba(30,111,217,.04),transparent 70%);top:-200px;right:-100px;animation-duration:24s;animation-delay:0s;}
.home-orb-2{width:500px;height:500px;background:radial-gradient(circle,rgba(0,229,160,.03),transparent 70%);bottom:-150px;left:-100px;animation-duration:28s;animation-delay:-7s;}
.home-orb-3{width:350px;height:350px;background:radial-gradient(circle,rgba(77,166,255,.03),transparent 70%);top:40%;left:40%;animation-duration:32s;animation-delay:-12s;}
@keyframes orb-breathe{0%,100%{opacity:.3;transform:scale(.96);}50%{opacity:.55;transform:scale(1.02);}}

/* Sidebar nav items — quiet active indicator, no pulse */
.nav-item{
  transition:background .2s,color .2s,transform .15s,box-shadow .2s !important;
}
.nav-item:hover{
  transform:translateX(2px) !important;
}
.nav-item.active{
  box-shadow:inset 3px 0 0 var(--gold-light) !important;
}

/* Panel — glass surface, quiet entrance, soft lift on hover */
.panel{
  background-image:var(--glass-bg) !important;
  box-shadow:var(--shadow-sm),var(--inner-hairline) !important;
  transition:background .3s,border-color .25s,transform .2s cubic-bezier(.4,0,.2,1),box-shadow .3s ease !important;
  animation:panel-enter .4s cubic-bezier(.16,1,.3,1) both;
}
@keyframes panel-enter{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.panel:hover{
  border-color:rgba(255,255,255,.14) !important;
  box-shadow:var(--shadow-md),var(--inner-hairline) !important;
  transform:translateY(-1px) !important;
}

/* Table rows — plain background hover, no shift */
tbody tr{transition:background .15s;}
tbody tr:hover{
  background:var(--surface-2) !important;
}

/* Header bar — quiet single-tone hairline */
.app-header::after{
  background:linear-gradient(90deg,transparent,rgba(122,155,196,.45),transparent) !important;
  height:1px !important;
}

/* Page title — clean, no shimmer */
.page-title{
  font-family:var(--font-display);font-size:35px;font-weight:600;letter-spacing:.2px;
  color:var(--text);
}

/* Buttons — soft shadow lift, no shine sweep */
.btn,.dash-btn{
  position:relative;overflow:hidden;
  transition:border-color .2s,background .2s,transform .15s cubic-bezier(.4,0,.2,1),box-shadow .2s !important;
}
.btn:hover,.dash-btn:hover{
  box-shadow:var(--shadow-sm) !important;
  transform:translateY(-1px) !important;
}
.dash-btn-group{display:flex;align-items:center;gap:8px;}
.dash-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#c8d8f0;font-size:12.5px;font-weight:600;transition:border-color .15s,background .15s,transform .1s;}
.dash-btn svg{width:14px;height:14px;flex-shrink:0;}
.dash-btn:hover{border-color:rgba(41,121,255,.4);background:rgba(41,121,255,.1);}
.dash-btn:active{transform:scale(.97);}
.dash-theme-btn{padding:8px 10px;min-width:36px;justify-content:center;}
.market-toggle{display:flex;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:50px;padding:3px;gap:2px;}
.mt-opt{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:44px;border:none;background:transparent;color:rgba(200,216,240,.6);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .2s,color .2s;}
.mt-opt svg{width:13px;height:13px;flex-shrink:0;}
.mt-opt.active{background:#2979FF;color:#fff;box-shadow:var(--shadow-accent);}

/* Toast — quiet entrance */
.toast.show{
  animation:toast-pop .25s cubic-bezier(.16,1,.3,1) both !important;
}
@keyframes toast-pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* Scrollbar — flat, no glow */
::-webkit-scrollbar-thumb{
  background:var(--border) !important;
  transition:background .2s;
}
::-webkit-scrollbar-thumb:hover{
  background:var(--accent-dim) !important;
}

/* Calendar cells — soft shadow lift, no scale-pop */
.cal-cell{transition:transform .15s,border-color .15s,box-shadow .2s !important;}
.cal-cell:not(.empty):hover{
  border-color:rgba(255,255,255,.14) !important;
  box-shadow:var(--shadow-sm) !important;
  z-index:2;position:relative;
}

/* Eyebrow — animated left line kept, quieter timing */
.eyebrow::before{
  animation:eyebrow-grow .6s cubic-bezier(.16,1,.3,1) both;
}
@keyframes eyebrow-grow{from{width:0;opacity:0;}to{width:14px;opacity:1;}}

/* Nav item entrance stagger via JS — kept, quieter distance */
.nav-item{animation:nav-enter .35s cubic-bezier(.16,1,.3,1) both;}
@keyframes nav-enter{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}

/* Soft ambient particle field — subtle, slow-drifting points of light.
   Premium fintech ambience, not a gaming-UI sparkle effect: low opacity,
   small size, long duration (set per-particle by JS), gentle fade. */
#home-sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.h-sparkle{
  position:absolute;border-radius:50%;
  animation:particle-drift linear infinite;
}

/* Profit / loss text — plain color, no text-shadow glow */
#screen-app{transition:opacity .5s ease,visibility .5s ease;}
#screen-app.hidden{opacity:0;visibility:hidden;pointer-events:none;}
#screen-app{min-height:100vh;}

/* ============================================================
   TICKER-TAPE FLUID GRID THEME
   A high-speed Bloomberg-terminal vibe: amber/green quote type
   on near-black glass, a live scrolling quote tape, cards that
   pulsate softly in sync with simulated price ticks, and a
   springy "layout shuffle" on hover — the dashboard grid grows
   the card under your cursor and eases the rest out of the way,
   emulating a Framer-Motion layout-id shuffle without pulling in
   React/Framer Motion/React-Spring in this single-file app.
   ============================================================ */
[data-theme="ticker-tape"]{
  --bg:#0A0B08; --sidebar:#0D0E09; --surface:rgba(20,20,14,.62); --surface-2:rgba(28,27,18,.72);
  --border:rgba(255,176,0,.20); --border-soft:rgba(255,176,0,.10);
  --field-border:rgba(255,176,0,.30); --text-main:#F5EFD8;
  --accent:#FFB000; --accent-dim:rgba(255,176,0,.14); --accent-glow:rgba(0,229,160,.30);
  --gold:#FFB000; --gold-light:#FFD166; --gold-dim:#B37D00;
  --text:#F5EFD8; --text-muted:#9C9784; --text-faint:#59563F;
  --profit:#00E5A0; --profit-dim:rgba(0,229,160,.12);
  --loss:#FF4D6D; --loss-dim:rgba(255,77,109,.12);
  --be:#59563F;
  --topbar-a:#0A0B08; --topbar-b:#FFB000;
  --nav-active-bg:rgba(255,176,0,.10); --nav-active-border:rgba(255,176,0,.35);
  --font-display:'Cormorant Garamond',serif; --font-body:'Sora',sans-serif; --font-mono:'IBM Plex Mono',monospace; --radius:10px;
}

/* --- Terminal backdrop: matte black with a faint amber scan grid --- */
#tt-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  display:none;overflow:hidden;background:#0A0B08;
}
[data-theme="ticker-tape"] #tt-bg{ display:block; }
[data-theme="ticker-tape"] #screen-app{ background:transparent !important; }
[data-theme="ticker-tape"] .page{ background:transparent !important; }
.tt-scanlines{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,176,0,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,176,0,.035) 1px,transparent 1px);
  background-size:34px 34px;
  opacity:0;transition:opacity 1.4s ease;
}
[data-theme="ticker-tape"] .tt-scanlines{ opacity:1; }

/* --- Live quote tape, fixed just under the app header --- */
#tt-tape{
  position:fixed;left:0;right:0;top:0;z-index:40;height:0;overflow:hidden;
  border-bottom:1px solid transparent;background:rgba(10,11,8,.9);
  transition:height .4s cubic-bezier(.34,1.56,.64,1),border-color .4s ease;
  pointer-events:none;
}
[data-theme="ticker-tape"] #tt-tape{
  height:30px;border-bottom-color:rgba(255,176,0,.22);
  top:var(--header-h,60px);
}
.tt-tape-inner{display:flex;align-items:center;gap:26px;width:max-content;height:100%;
  padding:0 18px;animation:tt-scroll 26s linear infinite;white-space:nowrap;}
@keyframes tt-scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.tt-quote{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.02em;color:#F5EFD8;display:inline-flex;align-items:center;gap:6px;}
.tt-quote .sym{color:#FFB000;font-weight:700;}
.tt-quote .px{transition:color .25s ease,text-shadow .25s ease;}
.tt-quote .px.tt-up{color:#00E5A0;text-shadow:0 0 8px rgba(0,229,160,.5);}
.tt-quote .px.tt-down{color:#FF4D6D;text-shadow:0 0 8px rgba(255,77,109,.5);}
.tt-quote .chg{opacity:.55;font-size:10px;}
.tt-quote .sep{opacity:.25;color:#59563F;}

/* --- Header / Sidebar glass, terminal-style --- */
[data-theme="ticker-tape"] .app-header{
  background:rgba(10,11,8,.86) !important;
  border-bottom:1px solid rgba(255,176,0,.18) !important;
  backdrop-filter:blur(14px) saturate(140%) !important;
  -webkit-backdrop-filter:blur(14px) saturate(140%) !important;
}
[data-theme="ticker-tape"] .sidebar{
  background:rgba(13,14,9,.92) !important;
  border-right:1px solid rgba(255,176,0,.14) !important;
}
[data-theme="ticker-tape"] .nav-item{
  color:#9C9784; font-family:'IBM Plex Mono',monospace;
  transition:background .3s ease,color .25s ease,transform .2s cubic-bezier(.34,1.56,.64,1);
}
[data-theme="ticker-tape"] .nav-item:hover{ transform:translateX(3px); }
[data-theme="ticker-tape"] .nav-item.active{
  background:rgba(255,176,0,.10) !important;
  border-color:rgba(255,176,0,.35) !important;
  color:#FFB000 !important;
  text-shadow:0 0 10px rgba(255,176,0,.45);
}
[data-theme="ticker-tape"] .sidebar-footer{ color:#59563F; font-family:'IBM Plex Mono',monospace; }
[data-theme="ticker-tape"] .stat-label{ color:#9C9784; font-weight:600; }
[data-theme="ticker-tape"] .stat-value{ color:#F5EFD8; font-family:'IBM Plex Mono',monospace; }
[data-theme="ticker-tape"] tbody td{ color:#F5EFD8; font-family:'IBM Plex Mono',monospace; }
[data-theme="ticker-tape"] thead th{ color:#FFB000; font-weight:700; }
[data-theme="ticker-tape"] .eyebrow{ color:#00E5A0; }
[data-theme="ticker-tape"] .page-desc{ color:#9C9784; }
[data-theme="ticker-tape"] .page-title{ color:#F5EFD8; text-shadow:0 0 16px rgba(255,176,0,.25); }
[data-theme="ticker-tape"] .field input,
[data-theme="ticker-tape"] .field select,
[data-theme="ticker-tape"] .lg-input{
  background:rgba(255,176,0,.04) !important;
  color:#F5EFD8 !important;
  border-color:rgba(255,176,0,.26) !important;
  font-family:'IBM Plex Mono',monospace !important;
}
[data-theme="ticker-tape"] .field input:focus,
[data-theme="ticker-tape"] .field select:focus{
  border-color:#FFB000 !important;
  box-shadow:0 0 0 3px rgba(255,176,0,.14), 0 0 16px rgba(0,229,160,.18) !important;
}
[data-theme="ticker-tape"] .btn,
[data-theme="ticker-tape"] button.btn{
  background:rgba(255,176,0,.10) !important;
  border:1px solid rgba(255,176,0,.30) !important;
  color:#FFB000 !important;
  transition:background .25s,box-shadow .25s,transform .2s cubic-bezier(.34,1.56,.64,1) !important;
}
[data-theme="ticker-tape"] .btn:hover{
  background:rgba(255,176,0,.20) !important;
  box-shadow:0 0 16px rgba(255,176,0,.28) !important;
  transform:translateY(-1px) !important;
}
[data-theme="ticker-tape"] .profit,[data-theme="ticker-tape"] .pos,[data-theme="ticker-tape"] [class*="profit"]{
  color:#00E5A0 !important; text-shadow:0 0 8px rgba(0,229,160,.35);
}
[data-theme="ticker-tape"] .loss,[data-theme="ticker-tape"] .neg,[data-theme="ticker-tape"] [class*="loss"]{
  color:#FF4D6D !important; text-shadow:0 0 8px rgba(255,77,109,.35);
}
[data-theme="ticker-tape"] ::-webkit-scrollbar-track{ background:rgba(255,176,0,.03); }
[data-theme="ticker-tape"] ::-webkit-scrollbar-thumb{ background:rgba(255,176,0,.20); border-radius:4px; }
[data-theme="ticker-tape"] ::-webkit-scrollbar-thumb:hover{ background:rgba(0,229,160,.30); }

/* --- Cards "breathe" gently, and flash brighter in sync with each
   simulated price tick (JS toggles .tt-tick on <body> every ~2.4s) --- */
@keyframes tt-pulse{
  0%,100%{ box-shadow:inset 0 0 14px rgba(255,176,0,.08), 0 4px 20px rgba(0,0,0,.5); border-color:rgba(255,176,0,.18); }
  50%{ box-shadow:inset 0 0 26px rgba(0,229,160,.10), 0 4px 26px rgba(0,0,0,.55); border-color:rgba(0,229,160,.26); }
}
[data-theme="ticker-tape"] .db-card,
[data-theme="ticker-tape"] .widget-card,
[data-theme="ticker-tape"] .panel,
[data-theme="ticker-tape"] .stat-card,
[data-theme="ticker-tape"] .shot-modal,
[data-theme="ticker-tape"] .widget,
[data-theme="ticker-tape"] .trade-row,
[data-theme="ticker-tape"] .cal-day,
[data-theme="ticker-tape"] .summary-card,
[data-theme="ticker-tape"] .week-row,
[data-theme="ticker-tape"] .note-card,
[data-theme="ticker-tape"] .flex-card{
  background:rgba(17,17,11,.62) !important;
  border:1px solid rgba(255,176,0,.18) !important;
  border-radius:10px !important;
  backdrop-filter:blur(10px) saturate(130%) !important;
  -webkit-backdrop-filter:blur(10px) saturate(130%) !important;
  animation:tt-pulse 4.2s ease-in-out infinite;
  transition:box-shadow .5s ease,border-color .5s ease,transform .45s cubic-bezier(.22,1.4,.36,1),
             flex-grow .45s cubic-bezier(.22,1.4,.36,1),flex-basis .45s cubic-bezier(.22,1.4,.36,1) !important;
}
/* price-tick flash: a brief brighter pulse layered on top of the idle breathing */
body.tt-tick [data-theme="ticker-tape"] .db-card,
[data-theme="ticker-tape"].tt-tick .db-card,
[data-theme="ticker-tape"] .db-card.tt-flash,
[data-theme="ticker-tape"] .widget-card.tt-flash,
[data-theme="ticker-tape"] .trade-row.tt-flash,
[data-theme="ticker-tape"] .panel.tt-flash{
  border-color:rgba(0,229,160,.5) !important;
  box-shadow:0 0 0 1px rgba(0,229,160,.25), 0 6px 28px rgba(0,229,160,.18) !important;
}

/* --- "Layout Shuffle": the db-card under the cursor swells and the
   rest of the row eases aside/down, elastic Framer-Motion-style spring --- */
[data-theme="ticker-tape"] .db-row{
  transition:gap .4s cubic-bezier(.22,1.4,.36,1);
}
[data-theme="ticker-tape"] .db-row:hover .db-card{
  flex-grow:.7 !important;
}
[data-theme="ticker-tape"] .db-row .db-card:hover{
  flex-grow:2.6 !important;
  transform:translateY(-6px) scale(1.012) !important;
  z-index:5;
  box-shadow:0 16px 46px rgba(0,0,0,.55), 0 0 0 1px rgba(255,176,0,.35), inset 0 0 30px rgba(0,229,160,.10) !important;
  animation-play-state:paused;
}
[data-theme="ticker-tape"] .trade-row{
  transition:background .25s ease,transform .3s cubic-bezier(.22,1.4,.36,1) !important;
}
[data-theme="ticker-tape"] .trade-row:hover{
  transform:scale(1.006) !important;
  background:rgba(255,176,0,.05) !important;
}

/* ============================================================
   HOLOGRAPHIC DEPTH THEME — layered parallax + 3D tilt cards
   Every surface sits on its own z-plane: a receding grid floor,
   drifting glass "shards", and light glints, all nudged by the
   cursor via CSS custom properties (--holo-mx/--holo-my) set in
   JS. Cards tilt in 3D toward the pointer (perspective + rotateX/
   rotateY), and opening a detail modal pushes the whole app back
   in depth with a scale + backdrop-blur "zoom" transition.
   ============================================================ */
[data-theme="holographic-depth"]{
  --bg:#03040A; --sidebar:#05060F; --surface:#0A0B18; --surface-2:#0F1226;
  --border:rgba(180,190,255,.16); --border-soft:rgba(180,190,255,.08);
  --field-border:rgba(180,190,255,.22); --text-main:#E8ECFF;
  --accent:#7B5CFF; --accent-dim:rgba(123,92,255,.16); --accent-glow:rgba(123,92,255,.25);
  --gold:#00E5FF; --gold-light:#7CF6FF; --gold-dim:#00A8CC;
  --text:#E8ECFF; --text-muted:#8B92C4; --text-faint:#4A5080;
  --profit:#00F5A0; --profit-dim:rgba(0,245,160,.12);
  --loss:#FF3D7A; --loss-dim:rgba(255,61,122,.12);
  --be:#6B72A8;
  --topbar-a:#1A0B3D; --topbar-b:#001F3D;
  --nav-active-bg:rgba(123,92,255,.14); --nav-active-border:rgba(0,229,255,.35);
  --font-display:'Cormorant Garamond',serif; --font-body:'Sora',sans-serif; --font-mono:'Outfit',sans-serif; --radius:12px;
}

#holo-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  display:none;overflow:hidden;perspective:1000px;
  background:radial-gradient(ellipse at 50% 0%,#0C0E2A 0%,#03040A 62%);
}
[data-theme="holographic-depth"] #holo-bg{ display:block; }
[data-theme="holographic-depth"] #screen-app{
  background:transparent !important;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.22,.9,.32,1), filter .5s ease;
}
[data-theme="holographic-depth"] .app-header{ background:rgba(5,6,15,.7) !important; backdrop-filter:blur(14px); }
[data-theme="holographic-depth"] .sidebar{ background:rgba(8,9,20,.78) !important; backdrop-filter:blur(12px); }
[data-theme="holographic-depth"] .page{ background:transparent !important; }

/* -- depth planes -- */
.holo-layer{ position:absolute; inset:-10%; will-change:transform; }
.holo-grid{
  background-image:
    linear-gradient(rgba(0,229,255,.14) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.14) 1px,transparent 1px);
  background-size:60px 60px;
  transform:translate3d(calc(var(--holo-mx,0) * 8px),calc(var(--holo-my,0) * 8px),0) rotateX(62deg);
  transform-origin:50% 25%;
  opacity:.32;
  mask-image:radial-gradient(ellipse at 50% 25%,#000 0%,transparent 68%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 0%,transparent 68%);
  transition:transform .12s linear;
}
.holo-shard{
  border-radius:18px;
  background:linear-gradient(135deg,rgba(123,92,255,.16),rgba(0,229,255,.05) 55%,rgba(255,46,154,.12));
  border:1px solid rgba(180,200,255,.18);
  box-shadow:0 0 46px rgba(123,92,255,.16);
  inset:auto;
  transition:transform .12s linear;
}
.holo-shard-1{ width:320px;height:220px;top:10%;left:6%;
  transform:translate3d(calc(var(--holo-mx,0) * 24px),calc(var(--holo-my,0) * 24px),0) rotate(-8deg);
  animation:holo-float-1 15s ease-in-out infinite; }
.holo-shard-2{ width:260px;height:180px;top:56%;right:8%;
  transform:translate3d(calc(var(--holo-mx,0) * 42px),calc(var(--holo-my,0) * 42px),0) rotate(11deg);
  animation:holo-float-2 19s ease-in-out infinite; }
.holo-shard-3{ width:180px;height:180px;bottom:6%;left:32%;border-radius:50%;
  transform:translate3d(calc(var(--holo-mx,0) * 58px),calc(var(--holo-my,0) * 58px),0);
  animation:holo-float-3 21s ease-in-out infinite; }
@keyframes holo-float-1{0%,100%{margin-top:0;}50%{margin-top:-18px;}}
@keyframes holo-float-2{0%,100%{margin-top:0;}50%{margin-top:22px;}}
@keyframes holo-float-3{0%,100%{margin-top:0;}50%{margin-top:-16px;}}

.holo-glint{ width:3px;height:3px;border-radius:50%;background:#fff;
  box-shadow:0 0 10px 3px rgba(0,229,255,.85);
  transition:transform .12s linear; }
.holo-glint-1{ top:20%;left:22%;
  transform:translate3d(calc(var(--holo-mx,0) * 78px),calc(var(--holo-my,0) * 78px),0); }
.holo-glint-2{ top:68%;left:64%;box-shadow:0 0 10px 3px rgba(255,46,154,.8);
  transform:translate3d(calc(var(--holo-mx,0) * 92px),calc(var(--holo-my,0) * 92px),0); }
.holo-glint-3{ top:40%;left:80%;box-shadow:0 0 10px 3px rgba(123,92,255,.85);
  transform:translate3d(calc(var(--holo-mx,0) * 66px),calc(var(--holo-my,0) * 66px),0); }

/* -- 3D tilt surfaces -- */
[data-theme="holographic-depth"] .db-card,
[data-theme="holographic-depth"] .widget-card,
[data-theme="holographic-depth"] .panel,
[data-theme="holographic-depth"] .stat-card,
[data-theme="holographic-depth"] .summary-card,
[data-theme="holographic-depth"] .week-row,
[data-theme="holographic-depth"] .note-card,
[data-theme="holographic-depth"] .flex-card,
[data-theme="holographic-depth"] .cal-day{
  background:linear-gradient(155deg,rgba(20,22,45,.75),rgba(10,11,26,.88)) !important;
  border:1px solid rgba(150,170,255,.14) !important;

  --text:#E4EAF2; --text-muted:#8B96AC; --text-faint:#4E5870;
  --profit:#00E5A0; --profit-dim:rgba(0,229,160,.12);

  --font-display:'Cormorant Garamond',serif; --font-body:'Sora',sans-serif; --font-mono:'Outfit',sans-serif; --radius:12px;

  position:fixed;inset:0;z-index:0;pointer-events:none;

/* -- the "camera dolly" page transition: incoming page rushes in

  55%{ opacity:1; }
  100%{ transform:scale(1); opacity:1; filter:blur(0); }
}
[data-theme="infinite-zoom"] #screen-app.iz-modal-open .page{
  filter:blur(3px) brightness(.6);
  transform:scale(.96);
  transition:filter .3s ease,transform .3s ease;
}

/* ===== LEGEND WALL ===== */
:root{
  --lg-bronze:#C48250; --lg-silver:#C9D4E0; --lg-gold:#FFD76A;
  --lg-plat:#7FE3D6; --lg-diamond:#8AB4FF; --lg-legend:#E3B4FF;
}
.lw-section-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.lw-section-nav a{font-family:var(--font-mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);background:var(--surface);border:1px solid var(--border-soft);border-radius:20px;padding:8px 15px;text-decoration:none;transition:.2s;cursor:pointer;}
.lw-section-nav a:hover{color:var(--gold-light);border-color:var(--accent);background:var(--accent-glow);}

.lw-section-title{font-family:var(--font-display);font-size:21px;font-weight:600;color:var(--text);margin:0 0 4px;}
.lw-section-sub{font-size:12.5px;color:var(--text-faint);margin:0 0 18px;}
.lw-title-row{display:flex;align-items:center;gap:7px;margin:0 0 18px;}
.lw-title-row .lw-section-title{margin:0;}
.lw-info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;color:var(--text-faint);font-size:13px;line-height:1;cursor:pointer;flex:none;}
.lw-info:hover{color:var(--gold-light);}
.lw-info .lw-tip{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%) translateY(-4px);width:max-content;max-width:240px;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--text);font-size:11.5px;line-height:1.4;font-weight:400;padding:8px 10px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .18s ease,transform .18s ease;z-index:20;pointer-events:none;}
.lw-info .lw-tip::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:var(--border-soft);}
@media(hover:hover){.lw-info:hover .lw-tip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}}
.lw-info.lw-info-open .lw-tip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
.lw-conf-badge{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid var(--border-soft);color:var(--text-faint);white-space:nowrap;}
.lw-conf-badge.tier-building{color:var(--text-faint);border-color:var(--border-soft);}
.lw-conf-badge.tier-developing{color:#7FA8D9;border-color:rgba(127,168,217,.3);}
.lw-conf-badge.tier-verified{color:var(--profit);border-color:rgba(0,229,160,.3);}
.lw-conf-badge.tier-trusted{color:#B79BE0;border-color:rgba(183,155,224,.3);}
.lw-conf-badge.tier-elite{color:#C9A64B;border-color:rgba(201,166,75,.35);}
.lw-rank-unranked{font-family:var(--font-mono);font-size:9px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-faint);}

/* --- Your Standing hero --- */
.lw-standing{display:grid;grid-template-columns:270px 1fr;gap:0;padding:0;overflow:hidden;}
.lw-standing-left{padding:26px 24px;border-right:1px solid var(--border-soft);display:flex;flex-direction:column;align-items:center;text-align:center;background:radial-gradient(circle at 50% 0%, var(--accent-glow), transparent 65%);}
.lw-league-badge{width:100px;height:100px;margin-bottom:12px;}
.lw-league-name{font-family:var(--font-display);font-style:italic;font-size:23px;font-weight:600;margin-bottom:2px;}
.lw-league-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);margin-bottom:16px;}
.lw-promo-track{width:100%;}
.lw-promo-label{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin-bottom:6px;letter-spacing:.6px;text-transform:uppercase;}
.lw-promo-bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
.lw-promo-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--gold-light));}
.lw-pw-nudge{font-size:11px;color:var(--text-faint);margin-top:6px;letter-spacing:.02em;}
.lw-promo-hint{font-size:11.5px;color:var(--text-muted);margin-top:10px;line-height:1.5;}

.lw-standing-right{padding:24px 26px;}
.lw-score-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.lw-score-item{text-align:center;}
.lw-score-ring{width:60px;height:60px;margin:0 auto 8px;position:relative;}
.lw-score-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.lw-score-ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--text);}
.lw-score-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-faint);}

/* --- Premium Scorecard enhancements --- */
.lw-sc-headrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.lw-sc-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.lw-status-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:6px;border:1px solid var(--border-soft);background:var(--surface-2);}
.lw-status-badge.tier-building{color:var(--text-faint);}
.lw-status-badge.tier-developing{color:#7FA8D9;border-color:rgba(127,168,217,.3);}
.lw-status-badge.tier-verified{color:var(--profit);border-color:rgba(0,229,160,.3);}
.lw-status-badge.tier-trusted{color:#B79BE0;border-color:rgba(183,155,224,.3);}
.lw-status-badge.tier-elite{color:#C9A64B;border-color:rgba(201,166,75,.35);}
.lw-status-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.lw-trend-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;padding:4px 8px;border-radius:8px;border:1px solid var(--border-soft);font-variant-numeric:tabular-nums;}
.lw-trend-badge.up{color:var(--profit);border-color:rgba(0,229,160,.35);}
.lw-trend-badge.down{color:#FF6B6B;border-color:rgba(255,107,107,.35);}
.lw-trend-badge.flat{color:var(--text-faint);}
.lw-conf-meter-wrap{margin-bottom:18px;}
.lw-conf-meter-top{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint);margin-bottom:5px;font-variant-numeric:tabular-nums;}
.lw-conf-meter{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
.lw-conf-meter-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#7FC4FF,#00E5A0);transition:width 1s cubic-bezier(.16,.84,.44,1);}
.lw-score-row.lw-premium-row{gap:10px;}
.lw-score-card{text-align:center;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:13px 10px 12px;position:relative;transition:border-color .2s ease,background .2s ease;}
.lw-score-card:hover{border-color:var(--border);background:linear-gradient(180deg,rgba(255,255,255,.03),var(--surface-2));}
.lw-score-card .lw-score-label{display:block;margin-bottom:7px;}
.lw-score-ring.lw-premium-ring{width:58px;height:58px;}
.lw-ring-fill{transition:stroke-dashoffset 1.3s cubic-bezier(.16,.84,.44,1);}
.lw-score-ring-val.lw-premium-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.lw-score-bar-track{height:3px;border-radius:3px;background:var(--surface);margin:9px 2px 0;overflow:hidden;}
.lw-score-bar-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.16,.84,.44,1);}
.lw-score-delta{margin-top:7px;font-family:var(--font-mono);font-size:9px;display:inline-flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:4px;background:var(--surface);}
.lw-score-delta.up{color:var(--profit);}
.lw-score-delta.down{color:#FF6B6B;}
.lw-score-delta.flat{color:var(--text-faint);}

.lw-checklist{display:flex;flex-direction:column;gap:9px;}
.lw-checklist-title{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);margin:0 0 10px;}
.lw-check-item{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-muted);}
.lw-check-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;}
.lw-check-dot.pass{background:rgba(0,229,160,.14);color:var(--profit);border:1px solid rgba(0,229,160,.3);}
.lw-check-dot.fail{background:rgba(255,77,109,.1);color:var(--loss);border:1px solid rgba(255,77,109,.25);}

/* --- League ladder (quiet, professional fintech treatment) --- */
.lw-ladder{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:32px 10px 0;}
.lw-ladder::before{content:'';position:absolute;top:35px;left:34px;right:34px;height:2px;background:var(--border-soft);border-radius:2px;}
.lw-ladder-fill{position:absolute;top:35px;left:34px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--gold-light));opacity:.8;width:0;transition:width 1s cubic-bezier(.4,0,.2,1);}
@keyframes lwLadderFadeIn{from{opacity:0;}to{opacity:1;}}
.lw-ladder-node{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;border-radius:12px;padding:6px 4px 10px;animation:lwLadderFadeIn .5s ease backwards;transition:background .2s ease;}
.lw-ladder-node:hover{background:rgba(255,255,255,.02);}
.lw-ladder-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text-faint);position:relative;z-index:1;transition:transform .2s ease,border-color .2s ease,background .2s ease,color .2s ease;}
.lw-ladder-node.locked .lw-ladder-dot{opacity:.5;border-style:dashed;}
.lw-ladder-node.locked .lw-ladder-dot::before{content:'';position:absolute;top:-2px;right:-2px;width:5px;height:5px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-soft);}
.lw-ladder-node.done .lw-ladder-dot{border-color:var(--border-soft);color:var(--text-muted);}
/* Current tier: an outlined rank ring in the tier's own color over a dark
   glass fill — a verification marker, not a glowing game medal. */
.lw-ladder-node.current .lw-ladder-dot{width:38px;height:38px;font-size:15px;color:var(--ladder-color,var(--gold-light));border-width:2px;border-color:var(--ladder-color,var(--gold-light));background:color-mix(in srgb, var(--ladder-color,var(--gold-light)) 12%, var(--surface));box-shadow:0 0 0 3px color-mix(in srgb, var(--ladder-color,var(--gold-light)) 14%, transparent);}
.lw-ladder-node:hover .lw-ladder-dot{transform:translateY(-1px);}
.lw-ladder-check{position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;background:var(--surface);color:var(--profit);font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2;border:1px solid var(--border-soft);}
.lw-ladder-name{font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint);transition:color .2s ease;}
.lw-ladder-node.done .lw-ladder-name{color:var(--text-muted);font-weight:500;}
.lw-ladder-node.current .lw-ladder-name{color:var(--text);font-weight:600;}
.lw-ladder-node:hover .lw-ladder-name{color:var(--text);}
.lw-ladder-req{font-size:10px;color:var(--text-faint);text-align:center;max-width:110px;margin-top:1px;line-height:1.45;opacity:.85;}
.lw-ladder-node.locked .lw-ladder-req{opacity:.6;}
.lw-ladder-node.current .lw-ladder-req{color:var(--text-muted);opacity:1;}
.lw-ladder-tag{font-family:var(--font-mono);font-size:8px;letter-spacing:.6px;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-top:1px;border:1px solid var(--border-soft);color:var(--text-faint);}
.lw-ladder-node.done .lw-ladder-tag{color:var(--text-muted);}
.lw-ladder-node.current .lw-ladder-tag{font-weight:600;color:var(--ladder-color,var(--gold-light));border-color:color-mix(in srgb, var(--ladder-color,var(--gold-light)) 45%, var(--border-soft));}
@media(max-width:640px){
  .lw-ladder-dot{width:26px;height:26px;font-size:11px;}
  .lw-ladder-node.current .lw-ladder-dot{width:32px;height:32px;font-size:13px;}
}



/* --- Spotlight --- */
.lw-spot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.lw-spot-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;transition:.25s;}
.lw-spot-card:hover{border-color:rgba(30,111,217,.35);transform:translateY(-3px);box-shadow:0 10px 30px rgba(30,111,217,.14);}
.lw-spot-head{padding:14px 16px 11px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-soft);}
.lw-spot-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.lw-spot-cat{font-family:var(--font-mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);}
.lw-spot-body{padding:15px 16px 16px;display:flex;gap:12px;align-items:flex-start;}
.lw-spot-avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-dim);color:var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-weight:700;font-size:16px;flex-shrink:0;}
.lw-spot-name{font-weight:600;font-size:13.5px;color:var(--text);}
.lw-spot-league{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;margin-top:2px;}
.lw-spot-metric{font-family:var(--font-mono);font-size:19px;font-weight:700;margin-top:8px;}
.lw-spot-metric-label{font-size:10.5px;color:var(--text-faint);margin-top:1px;}
.lw-spot-quote{font-size:11px;color:var(--text-muted);margin-top:9px;line-height:1.5;font-style:italic;border-left:2px solid var(--border);padding-left:9px;}

/* --- Badges --- */
.lw-badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.lw-badge-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:15px 13px;text-align:center;transition:.2s;}
.lw-badge-card.unlocked{border-color:rgba(255,215,106,.25);background:linear-gradient(180deg,rgba(255,215,106,.06),transparent);}
.lw-badge-card.locked{opacity:.45;}
.lw-badge-card.coming-soon{position:relative;opacity:.7;border-style:dashed;border-color:var(--border);background:var(--surface);}
.lw-badge-card.coming-soon .lw-badge-icon{color:var(--text-muted)!important;}
.lw-badge-soon-tag{position:absolute;top:8px;right:8px;font-family:var(--font-mono);font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint);background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;padding:2px 7px;}
.lw-badge-icon{width:42px;height:42px;border-radius:12px;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--surface);border:1px solid var(--border);}
.lw-badge-card.unlocked .lw-badge-icon{background:linear-gradient(135deg,rgba(255,215,106,.22),rgba(255,215,106,.04));border-color:rgba(255,215,106,.4);box-shadow:0 0 14px rgba(255,215,106,.18);}
.lw-badge-title{font-size:11.5px;font-weight:600;color:var(--text);margin-bottom:3px;}
.lw-badge-desc{font-size:10px;color:var(--text-faint);line-height:1.4;}

/* --- Unified Achievement Gallery: compact grid + click-to-expand modal --- */
.lw-gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
.lw-gallery-tile{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:16px 12px 13px;text-align:center;cursor:pointer;position:relative;
  transition:transform .16s cubic-bezier(.25,.8,.35,1),border-color .16s cubic-bezier(.25,.8,.35,1),box-shadow .22s ease-out .04s;}
.lw-gallery-tile:hover{transform:translateY(-3px) scale(1.015);border-color:var(--gold-dim);
  box-shadow:inset 0 1px 0 rgba(255,255,106,.09),0 10px 22px -12px rgba(0,0,0,.5);}
.lw-gallery-tile.unlocked:hover{border-color:rgba(255,215,106,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,106,.18),0 14px 32px -14px rgba(255,215,106,.35),0 4px 12px -6px rgba(0,0,0,.4);}
.lw-gallery-tile:not(:hover){transition:transform .14s ease-in,border-color .14s ease-in,box-shadow .14s ease-in;}
.lw-gallery-tile:active{transform:scale(.97);transition:transform .1s ease-out;}
/* Locked state, redesigned: a flat opacity dip alone reads as "disabled".
   Instead the artwork itself goes behind frosted glass — blurred and
   desaturated just enough that color and silhouette still bleed through,
   so the tile says "something real is behind this" rather than "empty
   slot". A single breathing lock glyph (added in the render template)
   sits centered over every locked badge type, replacing the old
   per-SVG lock emoji so the treatment is identical whether the art is
   a glyph, a shield SVG, or a custom silhouette. Hovering doesn't
   reveal the badge — it just eases the blur and warms the lock, a
   stand-in for leaning in for a closer look. */
.lw-gallery-tile.locked{opacity:.64;}
.lw-gallery-tile.locked .lw-gallery-art,
.lw-gallery-tile.locked .lw-gallery-glyph{
  filter:blur(2.2px) grayscale(.35) brightness(.92);
  transition:filter .4s cubic-bezier(.25,.8,.35,1);}
.lw-gallery-tile.locked:hover{opacity:.86;}
.lw-gallery-tile.locked:hover .lw-gallery-art,
.lw-gallery-tile.locked:hover .lw-gallery-glyph{
  filter:blur(.5px) grayscale(.08) brightness(1);}
.lw-lock-icon{position:absolute;top:16px;left:50%;width:54px;height:54px;margin-left:-27px;
  display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;pointer-events:none;
  color:var(--text-faint);filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));
  animation:lw-lock-breathe 3.4s ease-in-out infinite;}
@keyframes lw-lock-breathe{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.1);}}
.lw-gallery-tile.locked:hover .lw-lock-icon{
  animation-play-state:paused;opacity:1;color:#FFD76A;
  transform:scale(1.18) rotate(-6deg);
  filter:drop-shadow(0 0 8px rgba(255,215,106,.55));
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),color .25s,filter .25s;}
.lw-gallery-tile.coming-soon{opacity:.6;border-style:dashed;cursor:default;}
.lw-gallery-tile.coming-soon .lw-gallery-art,
.lw-gallery-tile.coming-soon .lw-gallery-glyph{filter:blur(2.2px) grayscale(.6);}
.lw-gallery-tile.coming-soon .lw-lock-icon{animation:none;opacity:.4;}
.lw-gallery-tile.coming-soon:hover{transform:none;box-shadow:none;border-color:var(--border);}
.lw-gallery-tile.coming-soon:hover .lw-gallery-art,
.lw-gallery-tile.coming-soon:hover .lw-gallery-glyph{filter:blur(2.2px) grayscale(.6);}
.lw-gallery-soon-tag{position:absolute;top:8px;right:8px;font-family:var(--font-mono);font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint);background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;padding:2px 7px;}
.lw-gallery-art{width:54px;height:54px;margin:0 auto 10px;}
.lw-gallery-glyph{width:54px;height:54px;margin:0 auto 10px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--surface);border:1px solid var(--border);color:var(--text-faint);}
.lw-gallery-tile.unlocked .lw-gallery-glyph{background:linear-gradient(135deg,rgba(255,215,106,.22),rgba(255,215,106,.04));border-color:rgba(255,215,106,.4);box-shadow:0 0 14px rgba(255,215,106,.18);color:#FFD76A;transition:box-shadow .22s ease-out .04s;}
.lw-gallery-tile.unlocked:hover .lw-gallery-glyph{box-shadow:0 0 20px rgba(255,215,106,.32);}

/* --- Rarity-tinted premium treatment: unlocked tiles pick up a subtle
   border/glow keyed to their own rarity tier (Common/Rare/Epic/Legendary)
   instead of every unlocked badge reading identically gold. Legendary gets
   a slow shimmer sweep so the platform's rarest marks read as "premium"
   even before a person clicks in. --- */
.lw-gallery-rarity-tag{position:absolute;top:8px;left:8px;font-family:var(--font-mono);font-size:7.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:8px;border:1px solid;line-height:1.5;z-index:2;}
.lw-gallery-tile.unlocked[data-rarity="Common"]{border-color:rgba(205,127,50,.4);}
.lw-gallery-tile.unlocked[data-rarity="Common"]:hover{border-color:rgba(205,127,50,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 32px -14px rgba(205,127,50,.4);}
.lw-gallery-tile.unlocked[data-rarity="Rare"]{border-color:rgba(255,215,106,.42);box-shadow:0 0 12px rgba(255,215,106,.1);}
.lw-gallery-tile.unlocked[data-rarity="Epic"]{border-color:rgba(138,180,255,.42);box-shadow:0 0 14px rgba(138,180,255,.13);}
.lw-gallery-tile.unlocked[data-rarity="Epic"]:hover{border-color:rgba(138,180,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 32px -14px rgba(138,180,255,.45);}
.lw-gallery-tile.unlocked[data-rarity="Legendary"]{border-color:rgba(227,180,255,.5);box-shadow:0 0 18px rgba(227,180,255,.18);background:linear-gradient(160deg,rgba(227,180,255,.06),var(--surface-2) 55%);}
.lw-gallery-tile.unlocked[data-rarity="Legendary"]:hover{border-color:rgba(227,180,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 16px 34px -14px rgba(227,180,255,.5);}
.lw-gallery-tile.unlocked[data-rarity="Legendary"]::after{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.10) 48%,rgba(227,180,255,.22) 52%,transparent 65%);
  background-size:260% 100%;animation:lw-legend-tile-shimmer 4.6s ease-in-out infinite;}
@keyframes lw-legend-tile-shimmer{0%{background-position:160% 0;}55%,100%{background-position:-60% 0;}}
@media (prefers-reduced-motion:reduce){
  .lw-gallery-tile.unlocked[data-rarity="Legendary"]::after{animation:none;display:none;}
}
.lw-gallery-status.unlocked{background:linear-gradient(90deg,rgba(255,215,106,.2),rgba(255,215,106,.08));box-shadow:inset 0 0 0 1px rgba(255,215,106,.22);}

/* Tile that currently owns the open inline detail panel below it. A small
   diamond "tab" bridges tile and panel so the expansion reads as one
   connected piece rather than two unrelated blocks stacking. */
.lw-gallery-tile.expanded{border-color:rgba(255,215,106,.65);transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,106,.22),0 14px 32px -14px rgba(255,215,106,.4);z-index:1;}
.lw-gallery-tile.expanded::before{content:'';position:absolute;left:50%;bottom:-7px;width:13px;height:13px;margin-left:-7px;
  background:var(--surface-2);border-left:1px solid rgba(255,215,106,.65);border-top:1px solid rgba(255,215,106,.65);
  transform:rotate(225deg);z-index:2;}

/* --- Unlock celebration: fires once, on the transition from locked -> unlocked --- */
.lw-unlock-anchor{position:relative;display:inline-block;}
.lw-gallery-ring{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:64px;height:64px;pointer-events:none;}
.lw-gallery-ring svg{width:100%;height:100%;display:block;}
.lw-gallery-tile.lw-unlock-celebrate{animation:lw-unlock-bounce .6s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes lw-unlock-bounce{0%{transform:scale(1);}35%{transform:scale(1.07);}60%{transform:scale(.98);}100%{transform:scale(1);}}
.lw-gallery-tile.lw-unlock-celebrate::after{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 45%,rgba(255,215,106,.35) 50%,rgba(255,255,255,.16) 55%,transparent 70%);
  background-size:220% 100%;background-position:120% 0;animation:lw-unlock-shimmer .7s ease-out .05s both;}
@keyframes lw-unlock-shimmer{to{background-position:-20% 0;}}
.lw-unlock-ring{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:14px;pointer-events:none;
  animation:lw-unlock-ring .8s ease-out both;}
@keyframes lw-unlock-ring{0%{box-shadow:0 0 0 0 rgba(255,215,106,.55);opacity:1;}100%{box-shadow:0 0 0 22px rgba(255,215,106,0);opacity:0;}}
.lw-unlock-particle{position:absolute;top:50%;left:50%;width:5px;height:5px;border-radius:50%;background:var(--pcolor,#FFD76A);pointer-events:none;
  animation:lw-unlock-particle .75s cubic-bezier(.2,.7,.3,1) both;}
@keyframes lw-unlock-particle{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0;}}
@media (prefers-reduced-motion:reduce){
  .lw-gallery-tile.lw-unlock-celebrate{animation:lw-unlock-fade .5s ease-out both;}
  .lw-gallery-tile.lw-unlock-celebrate::after,.lw-unlock-ring,.lw-unlock-particle{display:none;}
  @keyframes lw-unlock-fade{from{opacity:.5;}to{opacity:1;}}
}
.lw-gallery-name{font-size:11px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:7px;min-height:28px;display:flex;align-items:center;justify-content:center;}
.lw-gallery-status{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;margin-bottom:8px;}
.lw-gallery-status.unlocked{background:rgba(255,215,106,.15);color:var(--gold-light);}
.lw-gallery-status.locked{background:var(--surface);color:var(--text-faint);border:1px solid var(--border-soft);}
.lw-gallery-progress{height:3px;border-radius:3px;background:var(--surface);overflow:hidden;}
.lw-gallery-progress-fill{height:100%;border-radius:3px;transition:width .3s;}

.lw-badge-filter-pills{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px;}
.lw-badge-filter-pills .lw-period-pill{padding:6px 12px;}
.lw-gallery-empty{grid-column:1/-1;text-align:center;color:var(--text-faint);font-size:12.5px;padding:24px 0;}

/* ==================================================================
   INLINE EXPAND PANEL — replaces the old full-screen modal. The panel
   is inserted as its own grid item directly after the tapped tile and
   forced to grid-column:1/-1, so it opens beneath that tile as a full
   width row while every other tile in the gallery stays exactly where
   it is and stays visible. Height is animated by JS (measuring
   scrollHeight) so max-height can transition smoothly to a real pixel
   value instead of the un-animatable "auto".
   ================================================================== */
.lw-gallery-detail{grid-column:1/-1;overflow:hidden;max-height:0;opacity:0;margin-top:0;
  transition:max-height .42s cubic-bezier(.16,1,.3,1),opacity .3s ease,margin-top .42s cubic-bezier(.16,1,.3,1);}
.lw-gallery-detail.open{opacity:1;margin-top:2px;}
.lw-gallery-detail-inner{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid rgba(255,215,106,.35);
  border-radius:14px;padding:24px 28px 26px;position:relative;box-shadow:0 18px 40px -20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.03);}
.lw-gallery-detail-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text-faint);font-size:19px;line-height:1;cursor:pointer;padding:4px 9px;border-radius:6px;}
.lw-gallery-detail-close:hover{color:var(--loss);background:var(--loss-dim);}
.lw-gallery-detail-grid{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;}
.lw-gallery-detail-art{width:108px;height:108px;flex:none;}
.lw-gallery-detail-glyph{width:88px;height:88px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;background:var(--surface);border:1px solid var(--border);flex:none;}
.lw-gallery-detail-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
.lw-gallery-detail-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:23px;margin-bottom:4px;}
.lw-gallery-detail-tagline{font-style:italic;font-size:11.5px;opacity:.85;margin-bottom:10px;}
.lw-gallery-detail-story{font-size:12.5px;color:var(--text-muted);line-height:1.6;margin-bottom:14px;text-align:left;}
.lw-gallery-detail-rules{display:flex;flex-wrap:wrap;gap:6px;font-size:10.5px;color:var(--text-faint);margin-bottom:14px;}
.lw-gallery-detail-progress-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-faint);margin-bottom:14px;}
.lw-gallery-detail-rarity{font-size:10.5px;color:var(--text-faint);display:flex;align-items:center;gap:8px;}
.lw-gallery-detail-rarity-pill{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid;}
.lw-visibility-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--text-muted);}
@media (max-width:640px){
  .lw-gallery-grid{grid-template-columns:repeat(3,1fr);gap:10px;}
  .lw-gallery-detail-grid{grid-template-columns:1fr;text-align:center;}
  .lw-gallery-detail-art,.lw-gallery-detail-glyph{margin:0 auto;}
  .lw-gallery-detail-story,.lw-gallery-detail-rules{text-align:center;justify-content:center;}
  .lw-gallery-detail-inner{padding:22px 16px 22px;}
}
@media (max-width:420px){
  .lw-gallery-grid{grid-template-columns:repeat(2,1fr);}
}
@media (prefers-reduced-motion:reduce){
  .lw-gallery-detail{transition:opacity .2s ease;}
}

/* --- Achievement stats bar (above the badge gallery) --- */
.lw-badge-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 4px;}
.lw-badge-stat-card{position:relative;background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--border-soft);border-radius:12px;padding:14px 14px 12px;text-align:center;overflow:hidden;}
.lw-badge-stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold-light));opacity:.6;}
.lw-badge-stat-val{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--text);letter-spacing:.2px;line-height:1;}
.lw-badge-stat-val.lw-stat-gold{color:var(--gold-light);}
.lw-badge-stat-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-faint);margin-top:7px;}
/* --- Journal Streak Tracker (consecutive days journaled, with milestone badge progress) --- */
.lw-streak-card{position:relative;background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid rgba(255,215,106,.25);border-radius:12px;padding:18px 18px 16px;margin:16px 0 4px;overflow:hidden;}
.lw-streak-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#FF7A45,var(--gold-light));opacity:.7;}
.lw-streak-main{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.lw-streak-flame{font-size:34px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,122,69,.45));flex:none;}
.lw-streak-flame.dim{filter:none;opacity:.35;}
.lw-streak-num{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--text);line-height:1;}
.lw-streak-num-unit{font-size:13px;font-weight:600;color:var(--text-faint);margin-left:6px;}
.lw-streak-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-top:4px;}
.lw-streak-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.lw-streak-stat{background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;padding:9px 8px;text-align:center;}
.lw-streak-stat-val{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--text);}
.lw-streak-stat-label{font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint);margin-top:4px;}
.lw-streak-progress-row{display:flex;align-items:center;gap:10px;margin-bottom:5px;}
.lw-streak-progress-row .lw-promo-bar{flex:1;}
.lw-streak-progress-pct{font-family:var(--font-mono);font-size:11.5px;color:var(--gold-light);flex:none;min-width:34px;text-align:right;}
.lw-streak-progress-text{font-size:11px;color:var(--text-faint);margin-bottom:14px;}
.lw-streak-warning{display:flex;align-items:center;gap:7px;font-size:11px;color:#FF7A45;background:rgba(255,122,69,.1);border:1px solid rgba(255,122,69,.3);border-radius:8px;padding:7px 10px;margin-bottom:14px;}
.lw-streak-milestones{display:flex;gap:10px;flex-wrap:wrap;}
.lw-streak-milestone{flex:1 1 70px;min-width:64px;text-align:center;opacity:.4;transition:opacity .2s ease;}
.lw-streak-milestone.unlocked{opacity:1;}
.lw-streak-milestone.active{opacity:1;}
.lw-streak-milestone-icon{width:34px;height:34px;margin:0 auto 5px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--surface);border:1px solid var(--border);}
.lw-streak-milestone.active .lw-streak-milestone-icon{box-shadow:0 0 0 2px rgba(255,215,106,.25);}
.lw-streak-milestone-days{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);}
.lw-streak-milestone-name{font-size:9px;color:var(--text-faint);margin-top:1px;line-height:1.2;}
@media (max-width:640px){
  .lw-streak-stats{grid-template-columns:repeat(3,1fr);gap:6px;}
  .lw-streak-milestone{flex:1 1 50px;min-width:50px;}
}
/* --- Rarity counters (Common / Rare / Epic / Legendary, above the badge gallery) --- */
.lw-rarity-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 4px;}
.lw-rarity-stat-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:12px 10px 10px;text-align:center;}
.lw-rarity-stat-val{font-family:var(--font-mono);font-size:20px;font-weight:700;letter-spacing:.2px;line-height:1;}
.lw-rarity-stat-label{display:inline-block;font-family:var(--font-mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-top:7px;padding:2px 8px;border-radius:8px;border:1px solid var(--border-soft);}
@media (max-width:640px){
  .lw-rarity-stats-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
}
/* --- Legendary Badge Showcase (unlocked Legendary-rarity badges only) --- */
.lw-legendary-showcase{margin:16px 0 4px;}
.lw-legendary-showcase-title{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#FFD76A;display:flex;align-items:center;gap:7px;margin-bottom:10px;}
.lw-legendary-showcase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;}
.lw-legendary-showcase-card{position:relative;cursor:pointer;background:linear-gradient(135deg,rgba(255,215,106,.10),rgba(227,180,255,.08),transparent);border:1px solid rgba(255,215,106,.35);border-radius:14px;padding:18px 16px 16px;text-align:center;overflow:hidden;box-shadow:0 0 22px rgba(227,180,255,.12);transition:transform .15s ease,box-shadow .15s ease;}
.lw-legendary-showcase-card:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(227,180,255,.22);}
.lw-legendary-showcase-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#FFD76A,#E3B4FF);}
.lw-legendary-showcase-glyph{width:52px;height:52px;margin:0 auto 10px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,rgba(255,215,106,.25),rgba(227,180,255,.15));border:1px solid rgba(255,215,106,.45);color:#FFD76A;}
.lw-legendary-showcase-art{width:52px;height:52px;margin:0 auto 10px;}
.lw-legendary-showcase-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px;}
.lw-legendary-showcase-tag{display:inline-block;font-family:var(--font-mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:#FFD76A;background:rgba(255,215,106,.12);border:1px solid rgba(255,215,106,.35);border-radius:8px;padding:2px 8px;margin-bottom:8px;}
.lw-legendary-showcase-desc{font-size:10.5px;color:var(--text-faint);line-height:1.4;}
@media (max-width:640px){
  .lw-legendary-showcase-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
}

/* --- Signature Achievement Spotlight: hero treatment for the platform's
   flagship, multi-tier ladders (Perfect Week, Risk Sentinel). Shown
   regardless of unlock state — it's "what the gallery builds toward",
   not just what's already been earned — with a bigger ring, live tier
   color, and a rarity pill so the two anchor badges read as premium at
   a glance rather than blending into the compact grid below. --- */
.lw-signature-spotlight{margin:16px 0 4px;}
.lw-signature-spotlight-title{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold-light);display:flex;align-items:center;gap:7px;margin-bottom:10px;}
.lw-signature-spotlight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
.lw-sig-card{position:relative;display:flex;gap:16px;align-items:center;cursor:pointer;overflow:hidden;
  background:linear-gradient(150deg,var(--surface-2) 0%,var(--surface) 100%);
  border:1px solid var(--border-soft);border-radius:16px;padding:18px 20px;
  transition:transform .18s cubic-bezier(.25,.8,.35,1),border-color .18s ease,box-shadow .22s ease;}
.lw-sig-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--sig-color,#FFD76A),transparent);opacity:.8;}
.lw-sig-card:hover{transform:translateY(-3px);}
.lw-sig-card.unlocked{border-color:color-mix(in srgb, var(--sig-color,#FFD76A) 45%, var(--border-soft));
  box-shadow:0 0 20px color-mix(in srgb, var(--sig-color,#FFD76A) 14%, transparent);}
.lw-sig-card.unlocked:hover{border-color:color-mix(in srgb, var(--sig-color,#FFD76A) 70%, var(--border-soft));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 34px -16px color-mix(in srgb, var(--sig-color,#FFD76A) 45%, transparent);}
.lw-sig-card.locked{opacity:.78;}
.lw-sig-ring{position:relative;flex:0 0 76px;width:76px;height:76px;}
.lw-sig-ring svg{width:100%;height:100%;display:block;}
.lw-sig-ring-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.lw-sig-art{width:46px;height:46px;}
.lw-sig-glyph{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--surface);border:1px solid var(--border);}
.lw-sig-body{flex:1;min-width:0;text-align:left;}
.lw-sig-eyebrow{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--sig-color,#FFD76A);margin-bottom:3px;}
.lw-sig-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;line-height:1.2;margin-bottom:6px;}
.lw-sig-rarity-pill{display:inline-flex;font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid;margin-bottom:8px;}
.lw-sig-progress-row{display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--text-faint);}
.lw-sig-progress-row .lw-promo-bar{flex:1;}
@media (max-width:640px){
  .lw-signature-spotlight-grid{grid-template-columns:1fr;}
  .lw-sig-card{padding:15px 16px;}
}
@media (max-width:640px){
  .lw-badge-stats-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
}

/* --- Closest to Unlock card --- */
.lw-closest-badge-card{position:relative;display:flex;align-items:center;gap:16px;background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid rgba(255,215,106,.3);border-radius:12px;padding:16px 18px;margin:14px 0 4px;overflow:hidden;}
.lw-closest-badge-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold-light));opacity:.7;}
.lw-closest-badge-glyph{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;background:linear-gradient(135deg,rgba(255,215,106,.22),rgba(255,215,106,.04));border:1px solid rgba(255,215,106,.4);color:#FFD76A;}
.lw-closest-badge-art{width:44px;height:44px;flex:none;}
.lw-closest-badge-body{flex:1;min-width:0;}
.lw-closest-badge-eyebrow{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--gold-light);margin-bottom:4px;}
.lw-closest-badge-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;}
.lw-closest-badge-progress-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.lw-closest-badge-progress-row .lw-promo-bar{flex:1;}
.lw-closest-badge-pct{font-family:var(--font-mono);font-size:11.5px;color:var(--gold-light);flex:none;min-width:34px;text-align:right;}
.lw-closest-badge-remaining{font-size:11px;color:var(--text-faint);}
@media (max-width:640px){
  .lw-closest-badge-card{flex-direction:column;align-items:flex-start;text-align:left;}
}

/* --- Recent Achievements (last 5 unlocked badges, most recent first) --- */
.lw-recent-achievements{margin:16px 0 4px;}
.lw-recent-achievements-title{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.lw-recent-badges-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;}
.lw-recent-badge-chip{flex:0 0 auto;width:104px;background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--border-soft);border-radius:10px;padding:12px 8px 10px;text-align:center;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;}
.lw-recent-badge-chip:hover{transform:translateY(-2px);border-color:rgba(255,215,106,.45);box-shadow:0 6px 18px rgba(0,0,0,.25);}
.lw-recent-badge-glyph{width:38px;height:38px;margin:0 auto 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,rgba(255,215,106,.22),rgba(255,215,106,.04));border:1px solid rgba(255,215,106,.4);}
.lw-recent-badge-art{width:38px;height:38px;margin:0 auto 8px;}
.lw-recent-badge-name{font-size:10.5px;font-weight:600;color:var(--text);line-height:1.3;}
.lw-recent-empty{font-size:12px;color:var(--text-faint);padding:10px 2px;}
@media (max-width:640px){
  .lw-recent-badge-chip{width:92px;}
}

/* --- Community Activity Feed --- */
.lw-activity-feed-list{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow-y:auto;}
.lw-activity-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border-soft);}
.lw-activity-item:last-child{border-bottom:none;}
.lw-activity-dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor;}
.lw-activity-text{flex:1;font-size:12.5px;color:var(--text-muted);}
.lw-activity-text b{color:var(--text);}
.lw-activity-time{font-size:10.5px;color:var(--text-faint);flex:none;font-family:var(--font-mono);}

/* ==================================================================
   ACHIEVEMENT UNLOCK NOTIFICATIONS — fixed-position toast stack,
   independent of whatever page is open. Desktop: top-right, stacked
   downward, newest on top. Mobile: bottom-center, full-width,
   stacked upward so newest sits closest to the thumb. Each toast is
   self-contained (slide-in -> badge reveal -> particle burst ->
   auto-dismiss with a shrinking progress bar) and queues behind a
   cap of LW_TOAST_MAX_VISIBLE so unlocking many badges at once
   doesn't flood the screen.
   ================================================================== */
#lw-toast-container{
  position:fixed; top:66px; right:18px; z-index:9500;
  width:368px; max-width:calc(100vw - 28px);
  display:flex; flex-direction:column; gap:10px;
  pointer-events:none;
}
.lw-toast{
  pointer-events:auto; position:relative;
  background:linear-gradient(155deg,rgba(15,26,46,.97),rgba(10,18,32,.97));
  border:1px solid var(--tcolor,#FFD76A); border-color:color-mix(in srgb, var(--tcolor,#FFD76A) 45%, var(--border-soft));
  border-radius:14px; padding:13px 14px 0; overflow:hidden;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02) inset;
  opacity:0; transform:translateX(120%) scale(.97);
  transition:transform .48s cubic-bezier(.16,1,.3,1), opacity .38s ease;
  cursor:pointer;
}
.lw-toast.show{opacity:1; transform:translateX(0) scale(1);}
.lw-toast.closing{opacity:0; transform:translateX(40px) scale(.96); transition:transform .34s ease, opacity .34s ease;}
.lw-toast::before{ /* top hairline sheen matching badge color */
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--tcolor,#FFD76A),transparent);
  opacity:.9;
}
.lw-toast-close{
  position:absolute; top:8px; right:9px; width:20px; height:20px; border-radius:50%;
  border:none; background:rgba(255,255,255,.05); color:var(--text-faint);
  font-size:10px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .15s,color .15s;
}
.lw-toast-close:hover{background:rgba(255,255,255,.12); color:var(--text);}
.lw-toast-main{display:flex; gap:12px; align-items:center; padding-bottom:13px;}
.lw-toast-art{
  position:relative; flex:0 0 52px; width:52px; height:52px;
  display:flex; align-items:center; justify-content:center;
  transform:scale(.35); opacity:0;
  transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .4s ease;
}
.lw-toast.reveal .lw-toast-art{transform:scale(1); opacity:1;}
.lw-toast-art-inner{width:44px; height:44px; position:relative; z-index:2; filter:drop-shadow(0 0 8px color-mix(in srgb, var(--tcolor,#FFD76A) 55%, transparent));}
.lw-toast-art-inner svg{width:100%; height:100%;}
.lw-toast-glyph{font-size:22px; position:relative; z-index:2;}
.lw-toast-glow{
  position:absolute; inset:-10px; border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--tcolor,#FFD76A) 55%, transparent) 0%, transparent 70%);
  opacity:0; animation:lw-toast-glow-pulse 2.2s ease-in-out infinite; animation-play-state:paused;
}
.lw-toast.reveal .lw-toast-glow{animation-play-state:running;}
@keyframes lw-toast-glow-pulse{0%,100%{opacity:.35; transform:scale(.9);}50%{opacity:.75; transform:scale(1.15);}}
.lw-toast-ring{
  position:absolute; inset:0; border-radius:50%; pointer-events:none; opacity:0;
}
.lw-toast.reveal .lw-toast-ring{
  animation:lw-toast-ring-burst .8s ease-out .05s both;
}
@keyframes lw-toast-ring-burst{
  0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--tcolor,#FFD76A) 60%, transparent); opacity:1;}
  100%{box-shadow:0 0 0 26px color-mix(in srgb, var(--tcolor,#FFD76A) 0%, transparent); opacity:0;}
}
.lw-toast-particle{
  position:absolute; top:50%; left:50%; width:4px; height:4px; border-radius:50%;
  background:var(--pcolor,#FFD76A); pointer-events:none;
  animation:lw-toast-particle .8s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes lw-toast-particle{
  0%{transform:translate(-50%,-50%) scale(1); opacity:1;}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0); opacity:0;}
}
.lw-toast-copy{min-width:0; flex:1;}
.lw-toast-eyebrow{font-family:var(--font-mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--tcolor,#FFD76A); margin-bottom:2px; opacity:0; transform:translateY(4px); transition:opacity .35s ease .08s, transform .35s ease .08s;}
.lw-toast.show .lw-toast-eyebrow{opacity:1; transform:translateY(0);}
.lw-toast-name{font-size:14px; font-weight:700; color:var(--text); line-height:1.25; margin-bottom:4px; opacity:0; transform:translateY(4px); transition:opacity .35s ease .13s, transform .35s ease .13s;}
.lw-toast.show .lw-toast-name{opacity:1; transform:translateY(0);}
.lw-toast-rarity{
  display:inline-block; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  padding:2px 8px; border-radius:20px; border:1px solid; margin-bottom:5px;
  opacity:0; transition:opacity .35s ease .17s;
}
.lw-toast.show .lw-toast-rarity{opacity:1;}
.lw-toast-desc{font-size:11px; color:var(--text-muted); line-height:1.45; opacity:0; transition:opacity .35s ease .2s;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.lw-toast.show .lw-toast-desc{opacity:1;}
.lw-toast-share-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;opacity:0;transition:opacity .35s ease .24s;}
.lw-toast.show .lw-toast-share-row{opacity:1;}
.lw-toast-share-status{font-size:9.5px;color:var(--text-faint);white-space:nowrap;}
.lw-toast-share-btn{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:none;border:1px solid var(--tcolor,#FFD76A);color:var(--tcolor,#FFD76A);border-radius:20px;padding:3px 9px;cursor:pointer;flex:none;transition:background .15s ease;}
.lw-toast-share-btn:hover{background:color-mix(in srgb, var(--tcolor,#FFD76A) 16%, transparent);}
.lw-toast-progress{position:relative; height:2.5px; background:rgba(255,255,255,.06); margin:0 -14px; overflow:hidden;}
.lw-toast-progress-fill{position:absolute; inset:0; background:var(--tcolor,#FFD76A); transform-origin:left; transform:scaleX(1);}
.lw-toast-progress-fill.run{animation:lw-toast-shrink linear forwards;}
.lw-toast-progress-fill.paused{animation-play-state:paused;}
@keyframes lw-toast-shrink{from{transform:scaleX(1);}to{transform:scaleX(0);}}

@media (max-width:640px){
  #lw-toast-container{
    top:auto; right:10px; left:10px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    width:auto; max-width:none; flex-direction:column-reverse;
  }
  .lw-toast{transform:translateY(120%) scale(.97);}
  .lw-toast.show{transform:translateY(0) scale(1);}
  .lw-toast.closing{transform:translateY(30px) scale(.96);}
  .lw-toast-desc{-webkit-line-clamp:2;}
}
@media (prefers-reduced-motion:reduce){
  .lw-toast{transition:opacity .25s ease;}
  .lw-toast.show,.lw-toast.closing{transform:none;}
  .lw-toast-art{transition:opacity .25s ease; transform:none;}
  .lw-toast.reveal .lw-toast-art{transform:none;}
  .lw-toast-glow,.lw-toast-ring,.lw-toast-particle{display:none;}
}

/* --- Perfect Week progression card --- */
.lw-pw-card{display:flex;gap:22px;align-items:flex-start;background:linear-gradient(135deg,var(--surface-2),transparent);border:1px solid var(--border-soft);border-radius:14px;padding:20px;margin-bottom:18px;}
.lw-pw-art{width:96px;height:96px;flex:0 0 96px;filter:drop-shadow(0 0 16px var(--pw-glow,transparent));animation:pw-float 4.5s ease-in-out infinite;}
/* Silver-tier-only shimmer: a light pulsing glow so Silver visibly outranks Bronze's flat, minimal glow. Bronze deliberately gets no extra animation. */
@keyframes rs-silver-pulse{0%,100%{filter:drop-shadow(0 0 16px var(--pw-glow,transparent)) brightness(1);}50%{filter:drop-shadow(0 0 28px var(--pw-glow,transparent)) brightness(1.15);}}
.lw-pw-art.rs-tier-silver{animation:pw-float 4.5s ease-in-out infinite, rs-silver-pulse 2.3s ease-in-out infinite;}
.lw-pw-card.rs-tier-silver-card{border-color:rgba(215,220,227,.4);box-shadow:inset 0 0 0 1px rgba(215,220,227,.12);}
/* Legend-tier only: the deepest aura pulse and the only card treatment with a shifting gradient border, reserved for the platform's rarest badge. */
@keyframes rs-legend-pulse{0%,100%{filter:drop-shadow(0 0 20px var(--pw-glow,transparent)) brightness(1);}50%{filter:drop-shadow(0 0 38px var(--pw-glow,transparent)) brightness(1.22);}}
@keyframes rs-legend-border{0%,100%{border-color:rgba(255,215,106,.5);}50%{border-color:rgba(227,180,255,.6);}}
.lw-pw-art.rs-tier-legend{animation:pw-float 4.5s ease-in-out infinite, rs-legend-pulse 2.8s ease-in-out infinite;}
.lw-pw-card.rs-tier-legend-card{animation:rs-legend-border 3.6s ease-in-out infinite;box-shadow:inset 0 0 0 1px rgba(255,215,106,.18), 0 0 24px rgba(227,180,255,.1);background:linear-gradient(135deg,rgba(255,215,106,.05),rgba(227,180,255,.05),transparent);}
.lw-badge-card.rs-legend-showcase{grid-column:1/-1;background:linear-gradient(135deg,rgba(255,215,106,.08),rgba(227,180,255,.06),transparent);border-color:rgba(255,215,106,.35);}
/* Comeback Kid: a single, non-tiered special achievement — ember palette distinct from every ladder badge, its own glow pulse, no roadmap. */
@keyframes ck-ember-pulse{0%,100%{filter:drop-shadow(0 0 14px rgba(255,138,61,.35)) brightness(1);}50%{filter:drop-shadow(0 0 26px rgba(228,71,43,.5)) brightness(1.12);}}
.lw-ck-art{animation:pw-float 4.5s ease-in-out infinite, ck-ember-pulse 2.6s ease-in-out infinite;}
.lw-ck-card{background:linear-gradient(135deg,rgba(228,71,43,.07),rgba(255,215,106,.04),transparent);border:1px solid rgba(255,138,61,.28);box-shadow:inset 0 0 0 1px rgba(255,138,61,.1);}
.lw-ck-card.locked{background:linear-gradient(135deg,var(--surface-2),transparent);border-color:var(--border-soft);box-shadow:none;}
.lw-ck-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#FF8A3D;margin-bottom:4px;}
.lw-ck-progress-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-faint);margin-top:8px;}
/* No Revenge Trading: a second single, non-tiered special achievement — frost-blue palette distinct from the ember Comeback Kid, its own calm glow pulse (no flicker), no roadmap. */
@keyframes nrt-frost-pulse{0%,100%{filter:drop-shadow(0 0 12px rgba(46,134,222,.3)) brightness(1);}50%{filter:drop-shadow(0 0 22px rgba(143,211,255,.45)) brightness(1.08);}}
