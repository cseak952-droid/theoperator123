/* ===== RESET ===== */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== SCREEN SWITCHER ===== */
#screen-app{min-height:100vh;}
#screen-app.hidden{display:none;}

/* ============================================================
   SHARED — reused outside the old login page: by the public flex
   share page (#screen-public-flex) and by form fields in
   Profile Settings / Flex forms (.lg-input, .lg-label, .lg-error)
   ============================================================ */
:root{
  --bg-left:#04080F;
  --gold-lg:#4DA6FF;
  --gold-soft:#7FC4FF;
  --text-main:#D6E8FF;
  --text-dim:#7A9BC4;
  --text-faint:#3D5A80;
  --field-border:#1A2A44;
}
.lg-mark{width:34px;height:34px;border:1px solid var(--gold-lg);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:600;font-style:italic;font-size:18px;color:var(--gold-lg);background:rgba(30,111,217,.12);animation:mark-glow 3.2s ease-in-out infinite;}
@keyframes mark-glow{0%,100%{box-shadow:0 0 0px rgba(77,166,255,0);}50%{box-shadow:0 0 10px rgba(77,166,255,.28);}}
.lg-label{display:block;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;}
.lg-input{width:100%;background:var(--surface-2);border:1px solid var(--field-border);border-radius:7px;color:var(--text-main);font-size:14px;font-family:'Sora',sans-serif;padding:13px 14px;outline:none;transition:border-color .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease,transform .25s cubic-bezier(.4,0,.2,1);}
.lg-input::placeholder{color:var(--text-faint);}
/* MICRO-INTERACTION: focused field lifts slightly as the glow fades in */
.lg-input:focus{border-color:var(--gold-lg);box-shadow:0 0 0 3px rgba(30,111,217,.18),0 0 18px rgba(77,166,255,.22);transform:translateY(-1px);}
.lg-error{font-size:12px;color:#e8607a;margin-top:8px;font-family:'IBM Plex Mono',monospace;display:none;}
.lg-error.show{display:block;}

/* ============================================================
   MAIN APP — THEME SYSTEM
   ============================================================ */

/* DARK THEME: deep blue + black (default) */
:root, [data-theme="dark"]{
  --bg:#04080F;
  --sidebar:#04080F;
  --surface:#0A1220;
  --surface-2:#0F1A2E;
  --border:#1A2A44;
  --border-soft:#112035;
  --accent:#1E6FD9;
  --accent-dim:#0D3A73;
  --accent-glow:rgba(30,111,217,.18);
  --gold:#4DA6FF;
  --gold-light:#7FC4FF;
  --gold-dim:#1E5A99;
  --text:#D6E8FF;
  --text-muted:#7A9BC4;
  --text-faint:#3D5A80;
  --profit:#00E5A0;
  --profit-dim:#003D2A;
  --loss:#FF4D6D;
  --loss-dim:#3A0D1A;
  --be:#6B8BAA;
  --topbar-a:#0D3A73;
  --topbar-b:#4DA6FF;
  --nav-active-bg:rgba(30,111,217,.18);
  --nav-active-border:rgba(77,166,255,.35);
  --font-display:'Cormorant Garamond',serif;
  --font-body:'Sora',sans-serif;
  --font-mono:'Outfit',sans-serif;
  --radius:10px;
  /* ── PREMIUM SURFACE TOKENS (Bloomberg/TradingView/Stripe-grade) ── */
  --glass-bg:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
  --glass-border:rgba(255,255,255,.08);
  --shadow-xs:0 1px 2px rgba(0,0,0,.18);
  --shadow-sm:0 2px 8px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.16);
  --shadow-md:0 8px 24px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.18);
  --shadow-lg:0 16px 48px rgba(0,0,0,.34),0 4px 12px rgba(0,0,0,.22);
  --shadow-accent:0 6px 20px -4px rgba(30,111,217,.28);
  --inner-hairline:inset 0 1px 0 rgba(255,255,255,.04);
}

/* ============================================================
   NEW LIGHT THEMES
   ============================================================ */

/* THEME TOGGLE BUTTON — inside topbar */

#screen-app{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  transition:background .3s,color .3s;
  overflow-x:hidden; /* NO horizontal scroll */
}

/* ── AMBIENT GLOW ORBS (fixed, behind everything) ── */
#app-orbs{
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
}
.app-orb{
  position:absolute;border-radius:50%;filter:blur(90px);
  animation:orb-pulse ease-in-out infinite;
}
.app-orb-1{width:700px;height:700px;background:radial-gradient(circle,rgba(30,111,217,.045),transparent 70%);top:-200px;right:-100px;animation-duration:22s;}

@property --flex-border-angle{syntax:'<angle>';inherits:false;initial-value:0deg;}
@keyframes flex-border-rotate{to{--flex-border-angle:360deg;}}
@media(prefers-reduced-motion:reduce){.flex-card:has(.flex-badge.approved){animation:none;}}
.flex-card-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.flex-avatar{
  position:relative;width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent-dim),var(--surface-2));
  border:1px solid var(--border-soft);
  color:var(--gold-light);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:16px;flex-shrink:0;
  box-shadow:var(--shadow-xs);
}
/* Live status dot on the avatar for verified cards */
.flex-card:has(.flex-badge.approved) .flex-avatar::after{
  content:'';position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;
  border-radius:50%;background:var(--profit);border:2px solid var(--bg);
}
.flex-card-name{
  font-family:var(--font-display);font-weight:600;font-size:17px;
  letter-spacing:-.1px;color:var(--text);flex:1;
}
.flex-metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.flex-metric{
  background-color:var(--surface-2);background-image:var(--glass-bg);
  border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;
  transition:border-color .2s,transform .2s;
}
.flex-card:hover .flex-metric{border-color:rgba(255,255,255,.1);}
.flex-metric:hover{background-color:var(--surface);transform:translateY(-1px);}
.flex-card:hover .flex-avatar{box-shadow:var(--shadow-sm),0 0 0 3px var(--accent-glow);}
.flex-metric-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:5px;}
.flex-metric-value{font-size:17px;font-weight:700;color:var(--text);font-family:var(--font-mono);letter-spacing:-.2px;font-variant-numeric:tabular-nums;}
.flex-empty-msg{font-size:13px;color:var(--text-faint);padding:14px 4px;}
.flex-feed-head{margin-bottom:16px;}
.flex-feed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;}
.flex-feed-loading{font-size:13px;color:var(--text-faint);padding:14px 4px;letter-spacing:.02em;}
.flex-queue-list{display:flex;flex-direction:column;gap:14px;}
.flex-queue-item{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;background-image:var(--glass-bg);border:1px solid var(--border-soft);border-radius:10px;padding:16px;box-shadow:var(--shadow-xs);transition:border-color .2s ease,box-shadow .25s ease,transform .2s cubic-bezier(.4,0,.2,1);}
/* ── Activity Feed: LinkedIn-style reputation timeline ── */
.flex-timeline{display:flex;flex-direction:column;}
.flex-timeline-item{display:flex;gap:12px;position:relative;padding-bottom:18px;}
.flex-timeline-item:last-child{padding-bottom:0;}
.flex-timeline-item::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:1px;background:var(--border-soft);}
.flex-timeline-item:last-child::before{display:none;}
.flex-timeline-icon{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;z-index:1;}
.flex-timeline-body{flex:1;min-width:0;padding-top:3px;}
/* ── Flex Profile Analytics: LinkedIn Creator Analytics × Stripe Dashboard ── */
.flex-analytics-panel{position:relative;overflow:hidden;}
.flex-analytics-panel::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 420px 200px at 100% 0%,var(--accent-glow),transparent 70%);pointer-events:none;}
.flex-analytics-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:relative;z-index:1;}
.flex-analytics-tabs{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;padding:3px;}
.flex-analytics-tab{border:none;background:transparent;color:var(--text-faint);font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:7px;cursor:pointer;transition:background .15s ease,color .15s ease;white-space:nowrap;font-family:var(--font-body);}
.flex-analytics-tab:hover{color:var(--text);}
.flex-analytics-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-xs),0 0 0 1px var(--border-soft) inset;}
.flex-analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px;margin-top:18px;position:relative;z-index:1;}
.flex-analytics-card{position:relative;background-image:var(--glass-bg);border:1px solid var(--border-soft);border-radius:12px;padding:18px 18px 16px;overflow:hidden;transition:border-color .2s ease,transform .2s cubic-bezier(.4,0,.2,1),box-shadow .25s ease;animation:flex-card-in .4s cubic-bezier(.16,1,.3,1) both;}
.flex-analytics-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.14);box-shadow:var(--shadow-md);}
.flex-analytics-card::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--card-tint,var(--accent)),transparent);opacity:.55;}
.flex-analytics-card-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:14px;background:color-mix(in srgb, var(--card-tint,var(--accent)) 16%, transparent);color:var(--card-tint,var(--accent));box-shadow:0 0 0 1px color-mix(in srgb, var(--card-tint,var(--accent)) 26%, transparent) inset;}
.flex-analytics-value{font-family:var(--font-mono);font-size:25px;font-weight:700;letter-spacing:-.4px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1;margin-bottom:5px;transition:color .2s ease;}
.flex-analytics-card.loading .flex-analytics-value{color:var(--text-faint);}
.flex-analytics-label{font-size:12px;font-weight:600;color:var(--text-muted);}
.flex-analytics-sub{font-size:10.5px;color:var(--text-faint);margin-top:6px;letter-spacing:.02em;}
@media(prefers-reduced-motion:reduce){.flex-analytics-card{animation:none;}}
@media(max-width:560px){.flex-analytics-head{flex-direction:column;align-items:flex-start;}.flex-analytics-tabs{width:100%;}.flex-analytics-tab{flex:1;text-align:center;}}
.flex-timeline-text{font-size:13px;color:var(--text);line-height:1.45;}
.flex-timeline-text b{font-weight:700;}
.flex-timeline-time{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
/* ── Achievement Showcase: premium reputation cards ── */
.flex-rarity-pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;white-space:nowrap;background:color-mix(in srgb, currentColor 14%, transparent);border:1px solid color-mix(in srgb, currentColor 32%, transparent);}
.flex-rarity-pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.flex-signature-card{position:relative;border-radius:12px;padding:18px;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--border-soft);overflow:hidden;}
.flex-signature-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 260px 140px at 100% 0%,var(--accent-glow),transparent 70%);pointer-events:none;}
.flex-signature-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;position:relative;z-index:1;}
.flex-signature-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border-soft);}
.flex-signature-name{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--text);margin-bottom:4px;}
.flex-signature-story{font-size:12.5px;line-height:1.55;color:var(--text-muted);position:relative;z-index:1;}
.flex-showcase-card{border-radius:10px;padding:14px;background:var(--surface-2);border:1px solid var(--border-soft);transition:transform .15s ease,border-color .15s ease;}
.flex-showcase-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.14);}
.flex-showcase-card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.flex-showcase-icon{font-size:16px;}
.flex-showcase-name{font-size:13px;font-weight:700;color:var(--text);flex:1;min-width:0;}
.flex-showcase-story{font-size:11.5px;line-height:1.5;color:var(--text-faint);}
.flex-showcase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;}
.pf-badges-panel{grid-column:1/-1;}
.pf-badges-panel .flex-showcase-card{position:relative;min-height:108px;padding:16px;background:linear-gradient(145deg,rgba(18,27,52,.94),rgba(8,14,30,.9));border-color:rgba(89,159,255,.2);overflow:hidden;box-shadow:inset 0 1px rgba(255,255,255,.035);}
.pf-badges-panel .flex-showcase-card::before{content:'';position:absolute;width:110px;height:110px;right:-45px;top:-55px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--badge-color,#4da6ff) 30%,transparent),transparent 70%);opacity:.65;pointer-events:none;}
.pf-badges-panel .flex-showcase-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--badge-color,#4da6ff) 58%,transparent);box-shadow:0 14px 30px rgba(0,0,0,.26),0 0 24px color-mix(in srgb,var(--badge-color,#4da6ff) 10%,transparent);}
.pf-badges-panel .flex-showcase-card-head{position:relative;z-index:1;align-items:center;gap:11px;margin-bottom:11px;}
.pf-badges-panel .flex-showcase-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:color-mix(in srgb,var(--badge-color,#4da6ff) 12%,transparent);border:1px solid color-mix(in srgb,var(--badge-color,#4da6ff) 34%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--badge-color,#4da6ff) 15%,transparent);}
.pf-badges-panel .flex-showcase-name{font-size:13.5px;line-height:1.3;}
.pf-badge-meta{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pf-unlocked-label{display:inline-flex;align-items:center;gap:5px;color:#42e6b2;font:700 8.5px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;}
.pf-unlocked-label::before{content:'✓';display:grid;place-items:center;width:14px;height:14px;border-radius:50%;background:rgba(0,229,160,.12);border:1px solid rgba(0,229,160,.3);}
@media(max-width:520px){.flex-showcase-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pf-badges-panel .flex-showcase-card{min-height:104px;padding:13px}.pf-badges-panel .flex-showcase-icon{width:34px;height:34px;font-size:17px}.pf-badges-panel .flex-showcase-name{font-size:12px}.pf-badge-meta{align-items:flex-start;flex-direction:column}.pf-unlocked-label{font-size:8px}}
.pf-real-badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.pf-real-badge{min-height:202px;padding:18px 12px 14px;background:linear-gradient(155deg,rgba(29,19,64,.94),rgba(12,12,39,.94));border-color:rgba(119,89,211,.26);cursor:default;}
.pf-real-badge .lw-gallery-art{width:74px;height:74px;margin:0 auto 13px;}
.pf-real-badge .lw-gallery-ring{top:8px;width:86px;height:86px;}
.pf-real-badge .lw-gallery-name{font-size:12px;min-height:32px;margin-bottom:10px;}
.pf-real-badge .lw-gallery-status{margin-bottom:11px;}
.pf-real-badge .lw-gallery-progress{margin-top:auto;}
.pf-real-badge.unlocked{display:flex;flex-direction:column;justify-content:flex-start;}
.pf-real-badge.unlocked:hover{transform:translateY(-4px) scale(1.012);}
@media(max-width:520px){.pf-real-badge-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pf-real-badge{min-height:184px;padding:16px 9px 12px}.pf-real-badge .lw-gallery-art{width:64px;height:64px}.pf-real-badge .lw-gallery-ring{width:76px;height:76px}.pf-real-badge .lw-gallery-rarity-tag{font-size:6.8px;padding:2px 5px}.pf-real-badge .lw-gallery-name{font-size:10.5px}}
.flex-queue-item:hover{border-color:rgba(255,255,255,.14);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.flex-queue-info{min-width:180px;flex:1;}
.flex-queue-name{font-weight:700;font-size:14px;color:var(--text);}
.flex-queue-email{font-weight:400;font-size:12px;color:var(--text-faint);}
.flex-queue-meta{font-size:12px;color:var(--text-faint);margin-top:4px;}
.flex-queue-card-wrap{flex:1;min-width:260px;}
.flex-queue-actions{display:flex;flex-direction:column;gap:8px;}
.flex-share-box{margin-top:18px;background-color:var(--surface-2);background-image:var(--glass-bg);border:1px solid var(--border-soft);border-radius:10px;padding:18px;box-shadow:var(--shadow-xs),var(--inner-hairline);transition:border-color .2s ease,box-shadow .2s ease;}
.flex-share-box:hover{border-color:rgba(255,255,255,.14);box-shadow:var(--shadow-sm),var(--inner-hairline);}
.flex-share-label{font-size:12.5px;color:var(--text-faint);margin-bottom:12px;line-height:1.5;}
.flex-share-row{display:flex;gap:10px;}
.flex-share-row input{flex:1;min-width:0;font-family:var(--font-mono);letter-spacing:.2px;}

/* ===== FLEX PROOF UPLOAD ===== */
.flex-proof-section{margin-top:22px;border-top:1px solid var(--border-soft);padding-top:20px;}
.flex-proof-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.flex-proof-title svg{color:var(--gold-light);}
.flex-proof-desc{font-size:12px;color:var(--text-faint);margin-bottom:16px;line-height:1.5;}
.flex-proof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:10px;}
.flex-proof-slot{background:var(--bg);border:1px solid var(--border-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-xs);transition:border-color .2s ease,box-shadow .25s ease,transform .25s cubic-bezier(.4,0,.2,1);}
.flex-proof-slot:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);transform:translateY(-2px);}
.flex-proof-slot-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-light);display:flex;align-items:center;gap:6px;}
.flex-proof-slot-desc{font-size:11.5px;color:var(--text-faint);}
.flex-proof-pick-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px dashed var(--border);color:var(--text-muted);border-radius:7px;padding:8px 12px;font-size:11.5px;font-family:var(--font-mono);cursor:pointer;transition:border-color .15s,color .15s,background .15s;width:100%;justify-content:center;}
.flex-proof-pick-btn:hover{border-color:var(--accent);color:var(--gold-light);background:var(--accent-dim);}
.flex-proof-pick-btn:active{transform:scale(.97);}
.flex-proof-pick-btn input{display:none;}
.flex-proof-thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border-soft);background:var(--surface-2);box-shadow:var(--shadow-xs);transition:box-shadow .2s ease;}
.flex-proof-thumb:hover{box-shadow:var(--shadow-sm);}
.flex-proof-thumb img{width:100%;height:90px;object-fit:cover;display:block;transition:transform .35s cubic-bezier(.4,0,.2,1);}
.flex-proof-thumb:hover img{transform:scale(1.06);}
.flex-proof-thumb-info{padding:6px 10px;font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.flex-proof-thumb-del{position:absolute;top:5px;right:5px;background:rgba(10,14,22,.75);color:#fff;border:none;width:22px;height:22px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.flex-proof-thumb-del:hover{background:var(--loss);}
.flex-proof-verified-note{display:flex;align-items:center;gap:8px;font-size:12px;color:#00E5A0;background:rgba(0,229,160,.07);border:1px solid rgba(0,229,160,.18);border-radius:8px;padding:10px 14px;margin-top:6px;}
.flex-proof-pending-note{display:flex;align-items:center;gap:8px;font-size:12px;color:#F0A93B;background:rgba(240,169,59,.07);border:1px solid rgba(240,169,59,.18);border-radius:8px;padding:10px 14px;margin-top:6px;}
.flex-proof-count{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);margin-top:3px;letter-spacing:.5px;}
/* Verified badge on flex card */
.flex-verified-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(0,229,160,.12);border:1px solid rgba(0,229,160,.3);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;color:#00E5A0;letter-spacing:.04em;box-shadow:0 0 0 1px rgba(0,229,160,.1) inset;}
.flex-verified-badge svg{width:12px;height:12px;}

/* ===== PUBLIC FLEX SHARE PAGE ===== */
#screen-public-flex{position:fixed;inset:0;z-index:90;background:#030711;color:var(--text-main);font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow-y:auto;overflow-x:hidden;}
#screen-public-flex.hidden{display:none;}
.pf-nav-shell{position:sticky;top:0;z-index:120;width:100%;padding:10px 22px;background:linear-gradient(180deg,rgba(2,6,18,.97),rgba(4,8,22,.88));border-bottom:1px solid rgba(96,150,233,.18);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);box-shadow:0 18px 55px rgba(0,0,0,.3);}
.pf-nav-shell::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px 90px at 12% 0%,rgba(47,196,255,.12),transparent 68%),radial-gradient(500px 100px at 86% 0%,rgba(123,92,255,.12),transparent 70%);}
.pf-nav-shell::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#2fc4ff 22%,#765cff 55%,#00e5a0 78%,transparent);opacity:.6;}
.pf-navbar{position:relative;width:min(1260px,100%);height:66px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px;padding:0 18px;border:1px solid rgba(114,164,239,.18);border-radius:18px;background:linear-gradient(135deg,rgba(12,23,44,.82),rgba(8,12,31,.76));box-shadow:inset 0 1px rgba(255,255,255,.045),0 12px 34px rgba(0,0,0,.24);overflow:hidden;}
.pf-navbar::after{content:'';position:absolute;width:180px;height:90px;right:-55px;top:-52px;border-radius:50%;background:radial-gradient(circle,rgba(70,139,255,.2),transparent 70%);pointer-events:none;}
.pf-nav-brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;}
.pf-nav-logo{position:relative;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;color:#eaf5ff;font:800 18px/1 var(--font-display);background:linear-gradient(145deg,#07152c 5%,#0c4c91 42%,#2f9dff 72%,#27dfbd 110%);border:1px solid rgba(132,201,255,.52);box-shadow:0 0 0 3px rgba(47,157,255,.07),0 0 28px rgba(47,157,255,.28),inset 0 1px rgba(255,255,255,.25);}
.pf-nav-logo::before{content:'';position:absolute;inset:-5px;border:1px solid rgba(63,182,255,.18);border-radius:17px;animation:pf-logo-breathe 2.8s ease-in-out infinite;}
.pf-nav-logo::after{content:'';position:absolute;width:7px;height:7px;right:-3px;bottom:3px;border-radius:50%;background:#00e5a0;border:2px solid #071020;box-shadow:0 0 13px #00e5a0;}
.pf-nav-title{font-size:15px;font-weight:800;letter-spacing:.12em;color:#eef6ff;white-space:nowrap;}
.pf-nav-title span{color:#57c7ff;text-shadow:0 0 24px rgba(62,184,255,.42);}
.pf-nav-subtitle{font:600 8px/1.2 var(--font-mono);letter-spacing:.15em;text-transform:uppercase;color:#66809f;margin-top:5px;white-space:nowrap;}
.pf-nav-center{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid rgba(114,157,222,.15);border-radius:999px;background:rgba(2,7,20,.42);}
.pf-nav-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;color:#7e94b3;font:700 9px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}
.pf-nav-chip.active{color:#bdeaff;background:linear-gradient(135deg,rgba(47,196,255,.13),rgba(83,91,255,.11));box-shadow:inset 0 0 0 1px rgba(73,181,255,.2);}
.pf-nav-live-dot{width:6px;height:6px;border-radius:50%;background:#00e5a0;box-shadow:0 0 12px #00e5a0;animation:pf-live-pulse 1.8s ease-in-out infinite;}
.pf-nav-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;position:relative;z-index:1;}
.pf-nav-button{height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border-radius:11px;border:1px solid rgba(110,156,226,.22);background:rgba(255,255,255,.035);color:#a9bdd9;font:700 10px/1 var(--font-mono);letter-spacing:.05em;cursor:pointer;transition:transform .2s ease,border-color .2s ease,color .2s ease,background .2s ease,box-shadow .2s ease;white-space:nowrap;}
.pf-nav-button:hover{transform:translateY(-1px);color:#f0f7ff;border-color:rgba(80,187,255,.48);background:rgba(61,153,255,.09);box-shadow:0 8px 22px rgba(0,0,0,.22);}

.pf-nav-button.primary{border-color:rgba(72,178,255,.44);color:#06101f;background:linear-gradient(135deg,#49d4f5,#348cff 58%,#655cff);box-shadow:0 8px 25px rgba(38,130,255,.25),inset 0 1px rgba(255,255,255,.3);}
.pf-nav-button.primary:hover{color:#030b18;border-color:rgba(130,218,255,.72);box-shadow:0 10px 30px rgba(38,130,255,.38),0 0 25px rgba(66,181,255,.16);}
.pf-nav-button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;}
.pf-wrap{position:relative;min-height:calc(100vh - 87px);display:flex;flex-direction:column;align-items:center;padding:32px 28px 52px;text-align:left;background:radial-gradient(900px 520px at 8% -8%,rgba(29,129,255,.2),transparent 62%),radial-gradient(780px 500px at 95% 18%,rgba(104,65,255,.15),transparent 66%),radial-gradient(720px 500px at 50% 110%,rgba(0,229,160,.07),transparent 70%),linear-gradient(180deg,#040815 0%,#030711 48%,#060817 100%);}
.pf-wrap::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(114,151,211,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(114,151,211,.08) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,black,transparent 72%);}
.pf-brand{position:relative;z-index:1;width:min(1180px,100%);display:flex;flex-direction:row;align-items:center;gap:11px;margin:0 auto 28px;padding:0 2px;animation:pf-rise .6s cubic-bezier(.16,1,.3,1) both;}
.pf-brand .lg-mark{width:34px;height:34px;margin:0!important;border-radius:10px;box-shadow:0 0 28px rgba(57,155,255,.25);}
.pf-brand-name{font-size:11px;font-weight:700;letter-spacing:.2em;color:#b9c9e5;text-transform:uppercase;}
.pf-brand-name::after{content:'PUBLIC TRADER PORTFOLIO';margin-left:14px;padding-left:14px;border-left:1px solid rgba(157,185,230,.2);color:#58708f;font-size:9px;letter-spacing:.15em;}
.pf-content{position:relative;z-index:1;width:min(1180px,100%);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:18px;align-items:start;animation:pf-rise .7s .08s cubic-bezier(.16,1,.3,1) both;}
.pf-headline{grid-column:1/-1;font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:var(--text-main);margin:2px 0 4px;letter-spacing:.1px;}
.pf-content .flex-card{width:100%;max-width:none;background:linear-gradient(145deg,rgba(11,20,38,.92),rgba(7,13,27,.82));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 22px 65px rgba(0,0,0,.35);transition:border-color .25s ease,box-shadow .35s ease,transform .35s cubic-bezier(.4,0,.2,1);}
.pf-content .flex-card:hover{box-shadow:0 26px 72px rgba(0,0,0,.45);transform:translateY(-2px);}
.pf-content .flex-card:not(:has(.flex-badge.approved)){border:1px solid rgba(26,42,68,.8);}
.pf-content .flex-metric{background-color:rgba(255,255,255,.04);}
.pf-content .flex-card-name{color:var(--text-main);}
.pf-loading,.pf-notfound{grid-column:1/-1;font-size:14px;color:var(--text-dim);padding:70px 20px;text-align:center;}
.pf-cta{position:relative;z-index:1;margin-top:28px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:#b9ddff;background:rgba(49,142,255,.09);border:1px solid rgba(82,167,255,.28);border-radius:24px;padding:11px 20px;cursor:pointer;transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s cubic-bezier(.4,0,.2,1),box-shadow .2s ease;animation:pf-rise .7s .16s cubic-bezier(.16,1,.3,1) both;}
.pf-cta-arrow{display:inline-block;transition:transform .2s cubic-bezier(.4,0,.2,1);}
.pf-cta:hover{color:var(--text-main);background:rgba(127,196,255,.1);border-color:rgba(127,196,255,.4);transform:translateY(-1px);box-shadow:0 6px 18px rgba(30,111,217,.18);}
.pf-cta:hover .pf-cta-arrow{transform:translateX(3px);}
.pf-cta:active{transform:translateY(0);}
@keyframes pf-rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes pf-logo-breathe{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:.9;transform:scale(1.04)}}
@keyframes pf-live-pulse{0%,100%{opacity:.55;box-shadow:0 0 7px #00e5a0}50%{opacity:1;box-shadow:0 0 16px #00e5a0}}
@media(prefers-reduced-motion:reduce){.pf-brand,.pf-content,.pf-cta,.pf-nav-logo::before,.pf-nav-live-dot{animation:none;}}
@media(max-width:900px){.pf-navbar{grid-template-columns:1fr auto}.pf-nav-center{display:none}}
@media(max-width:780px){.pf-nav-shell{padding:8px 10px}.pf-navbar{height:60px;padding:0 12px;border-radius:15px;gap:10px}.pf-nav-logo{width:37px;height:37px;border-radius:11px;font-size:16px}.pf-nav-title{font-size:12px}.pf-nav-subtitle{display:none}.pf-nav-button{height:35px;padding:0 11px}.pf-nav-button.primary{display:none}.pf-wrap{padding:22px 14px 40px}.pf-content{grid-template-columns:1fr;gap:14px}.pf-content>*{grid-column:1!important}.pf-headline{font-size:27px}.pf-content .flex-card:hover{transform:none}}
@media(max-width:480px){.pf-headline{font-size:24px}.pf-cta{margin-top:22px}.pf-nav-button .pf-nav-button-text{display:none}.pf-nav-button{width:36px;padding:0}.pf-nav-brand{gap:9px}}
/* ── Premium Public Flex Profile: header banner, highlights, share box, preview ── */
.pf-profile-header{grid-column:1/-1;position:relative;border-radius:24px;padding:34px;background:linear-gradient(135deg,rgba(13,33,65,.96),rgba(9,16,35,.94) 58%,rgba(20,13,49,.9));border:1px solid rgba(116,164,237,.2);overflow:hidden;text-align:left;box-shadow:0 30px 90px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.04);}
.pf-profile-header::before{content:'';position:absolute;width:520px;height:520px;right:-170px;top:-300px;border-radius:50%;background:radial-gradient(circle,rgba(64,156,255,.3),rgba(103,63,255,.1) 42%,transparent 68%);pointer-events:none;}
.pf-profile-header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#2fc4ff,#6b63ff 55%,#00e5a0);opacity:.75;}
.pf-profile-header-row{display:flex;align-items:center;gap:16px;position:relative;z-index:1;}
.pf-avatar-lg{width:82px;height:82px;border-radius:22px;background:linear-gradient(145deg,#061224,#0D3A73 30%,#1E6FD9 55%,#4DA6FF 75%,#00E5A0 100%);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;font-family:var(--font-display);font-style:italic;flex-shrink:0;box-shadow:0 16px 40px rgba(0,0,0,.32),0 0 0 1px rgba(135,196,255,.35),0 0 28px rgba(44,144,255,.2);}
.pf-avatar-lg img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.pf-name-xl{font-family:var(--font-display);font-weight:700;font-size:30px;color:#f5f8ff;letter-spacing:-.5px;}
.pf-tagline{font-size:13px;color:#91a7c8;margin-top:5px;}
.pf-public-badge{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:6px 10px;border:1px solid rgba(0,229,160,.3);border-radius:999px;background:rgba(0,229,160,.08);color:#54edbd;font:700 9px/1 var(--font-mono);letter-spacing:.11em;text-transform:uppercase;}
.pf-public-badge-dot{width:6px;height:6px;border-radius:50%;background:#00e5a0;box-shadow:0 0 12px #00e5a0;}
.pf-highlight-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:18px;position:relative;z-index:1;}
.pf-highlight-item{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.045);border:1px solid rgba(132,167,220,.16);border-radius:12px;padding:11px 13px;}
.pf-highlight-icon{font-size:14px;color:var(--gold-light);flex-shrink:0;}
.pf-highlight-value{font-size:13.5px;font-weight:700;color:var(--text-main);font-family:var(--font-mono);line-height:1.2;}
.pf-highlight-label{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-top:1px;}
.pf-panel{width:100%;border-radius:18px;padding:20px;background:linear-gradient(145deg,rgba(11,20,38,.86),rgba(7,13,27,.78));border:1px solid rgba(113,151,211,.16);text-align:left;box-shadow:0 18px 55px rgba(0,0,0,.24);}
.pf-stats-panel,.pf-certificate-panel{grid-column:1/-1;}
.pf-certificate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;}
.pf-certificate-card{display:flex;min-height:132px;border-radius:15px;overflow:hidden;background:rgba(4,9,21,.72);border:1px solid rgba(0,229,160,.18);text-decoration:none;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;}
.pf-certificate-card:hover{transform:translateY(-2px);border-color:rgba(0,229,160,.42);box-shadow:0 15px 35px rgba(0,0,0,.28);}
.pf-certificate-preview{width:128px;min-height:132px;object-fit:cover;background:#07101f;border-right:1px solid rgba(113,151,211,.14);}
.pf-certificate-file{width:128px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#71cfff;border-right:1px solid rgba(113,151,211,.14);}
.pf-certificate-info{padding:16px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
.pf-certificate-title{font-size:13px;font-weight:700;color:#f2f6ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pf-certificate-type{margin-top:6px;color:#758bab;font-size:10px;text-transform:uppercase;letter-spacing:.09em;}
.pf-certificate-verified{margin-top:13px;color:#42e6b2;font:700 9px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;}
.pf-share-box{border-radius:12px;padding:16px;background:linear-gradient(135deg,rgba(255,215,106,.06),rgba(30,111,217,.05));border:1px solid rgba(255,215,106,.22);margin-top:10px;}
.pf-share-box .flex-share-label{margin-bottom:8px;}
.pf-preview-frame{border-radius:14px;padding:2px;background:linear-gradient(135deg,rgba(255,215,106,.35),rgba(30,111,217,.25));margin-top:10px;}
.pf-preview-frame-inner{border-radius:12px;background:var(--bg-left,var(--surface));padding:16px;}
/* ── Reputation Summary: professional fintech-style snapshot strip, near top of public profile ── */
.pf-reputation-summary{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(8,16,31,.78);border:1px solid rgba(113,151,211,.16);border-radius:16px;overflow:hidden;box-shadow:0 16px 45px rgba(0,0,0,.2);}
.pf-rep-item{padding:14px 16px;border-right:1px solid var(--border-soft);position:relative;min-width:0;}
.pf-rep-item:last-child{border-right:none;}
.pf-rep-label{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;white-space:nowrap;}
.pf-rep-value{font-size:15px;font-weight:700;color:var(--text);font-family:var(--font-mono);letter-spacing:-.2px;line-height:1.25;display:flex;align-items:center;gap:5px;}
.pf-rep-value.pf-rep-truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pf-rep-value.loading{color:var(--text-faint);font-weight:600;}
@media(max-width:760px){.pf-reputation-summary{grid-template-columns:repeat(3,1fr);}.pf-rep-item:nth-child(3n){border-right:none;}.pf-rep-item{border-bottom:1px solid var(--border-soft);}.pf-rep-item:nth-last-child(-n+3){border-bottom:none;}}
@media(max-width:460px){.pf-reputation-summary{grid-template-columns:repeat(2,1fr);}.pf-rep-item:nth-child(3n){border-right:1px solid var(--border-soft);}.pf-rep-item:nth-child(2n){border-right:none;}.pf-rep-item:nth-last-child(-n+2){border-bottom:none;}}
.sidebar-workspace{display:flex;align-items:center;gap:10px;padding:10px 10px 14px;margin-bottom:6px;border-bottom:1px solid var(--border-soft);}
.workspace-icon{width:32px;height:32px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold-light);}
.workspace-icon svg{width:15px;height:15px;}
.workspace-label{font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;color:var(--text-faint);text-transform:uppercase;margin-bottom:2px;}
.workspace-name{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ===== MAIN CONTENT ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:248px;transition:margin-left .32s cubic-bezier(.22,.72,.22,1);overflow-x:hidden;will-change:margin-left;}
.main.expanded{margin-left:60px;}
.topbar{display:none;}/* old topbar hidden — replaced by app-header */
.page{padding:36px 38px 60px;max-width:100%;width:100%;box-sizing:border-box;overflow-x:hidden;position:relative;z-index:1;}
.page.dashboard-page{padding:0!important;}

.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.eyebrow::before{content:'';width:14px;height:1px;background:var(--gold-dim);}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:26px;flex-wrap:wrap;}
.page-desc{color:var(--text-muted);font-size:13.5px;margin-top:6px;max-width:560px;}
.head-actions{display:flex;gap:9px;flex-wrap:wrap;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid var(--border);background-color:var(--surface);background-image:var(--glass-bg);color:var(--text);font-size:12.5px;font-weight:500;box-shadow:var(--shadow-xs);transition:border-color .15s,background-color .15s,transform .15s cubic-bezier(.4,0,.2,1),box-shadow .2s;position:relative;overflow:hidden;}
.btn svg{width:14px;height:14px;}
.btn:hover{border-color:rgba(255,255,255,.16);background-color:var(--surface-2);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(.97);box-shadow:var(--shadow-xs);}
/* MICRO-INTERACTION: ripple feedback on click */
.btn-ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:btn-ripple-anim .5s ease-out;pointer-events:none;}
@keyframes btn-ripple-anim{to{transform:scale(2.6);opacity:0;}}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#fff;border:none;font-weight:600;box-shadow:var(--shadow-accent);}
.btn-gold:hover{filter:brightness(1.08);box-shadow:var(--shadow-md);}
.btn-danger{color:var(--loss);border-color:rgba(255,77,109,.25);}
.btn-danger:hover{background:var(--loss-dim);border-color:var(--loss);}

.grid{display:grid;gap:16px;}
.grid-5{grid-template-columns:repeat(5,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1200px){.grid-5{grid-template-columns:repeat(3,1fr);}.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:760px){.grid-5,.grid-4,.grid-3,.grid-2{grid-template-columns:repeat(2,1fr);}}

.stat{background-color:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px 19px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s,background .3s;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .25s;}
.stat:hover{border-color:var(--border);transform:translateY(-1px);}
.stat:hover::before{opacity:1;}
.stat-label{font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;color:var(--text-faint);text-transform:uppercase;margin-bottom:11px;}
.stat-value{font-family:var(--font-mono);font-size:23px;font-weight:600;letter-spacing:-.3px;line-height:1.15;}
.stat-value.profit{color:var(--profit);}
.stat-value.loss{color:var(--loss);}
.stat-value.gold{color:var(--gold-light);}
.stat-sub{font-size:11px;color:var(--text-faint);margin-top:7px;}

.section-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);margin:34px 2px 14px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);}
.panel{background-color:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;transition:background .3s,border-color .3s;}
.panel-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin-bottom:3px;letter-spacing:-.1px;}
.panel-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px;font-family:var(--font-mono);}

.tbl-wrap{overflow-x:auto;border-radius:calc(var(--radius) - 2px);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:1.1px;color:var(--text-faint);text-transform:uppercase;font-weight:600;padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:11px 12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;font-family:var(--font-mono);color:var(--text);transition:background .12s;}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:600;letter-spacing:.4px;}
.tag-buy{background:rgba(0,229,160,.13);color:var(--profit);}
.tag-sell{background:rgba(255,77,109,.13);color:var(--loss);}
.tag-win{background:rgba(0,229,160,.13);color:var(--profit);}
.tag-loss{background:rgba(255,77,109,.13);color:var(--loss);}
.tag-be{background:rgba(107,139,170,.15);color:var(--be);}
.q-Aplus{color:var(--gold-light);}
.q-A{color:var(--profit);}
.q-B{color:#4DA6FF;}
.q-C{color:var(--text-faint);}
.txt-profit{color:var(--profit);}
.txt-loss{color:var(--loss);}
.del-btn{background:none;border:none;color:var(--text-faint);padding:4px;border-radius:5px;cursor:pointer;}
.del-btn:hover{color:var(--loss);background:var(--loss-dim);}

.form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:6px;}
.field{display:flex;flex-direction:column;gap:5px;min-width:90px;}
.field label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:1px;color:var(--text-faint);text-transform:uppercase;}
.field input,.field select{background-color:var(--surface-2);background-image:var(--glass-bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 10px;font-size:12.5px;outline:none;font-family:var(--font-mono);transition:border-color .18s,box-shadow .18s,transform .18s;}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.field.grow{flex:1;min-width:140px;}

/* ===== TRADE SCREENSHOTS ===== */
.shot-field{min-width:220px;flex:1.4;}
.shot-field input[type="file"]{display:none;}
.shot-pick-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 11px;font-size:11.5px;font-family:var(--font-mono);cursor:pointer;transition:border-color .15s,background .15s;width:fit-content;}
.shot-pick-btn:hover{border-color:var(--accent);}
.shot-count-label{font-size:9.5px;color:var(--text-faint);font-family:var(--font-mono);letter-spacing:.5px;}
.shot-thumbs{display:flex;flex-wrap:wrap;gap:5px;}
.shot-thumb{position:relative;width:28px;height:28px;border-radius:5px;overflow:hidden;border:1px solid var(--border-soft);flex-shrink:0;}
.shot-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.shot-thumb-del{position:absolute;top:0;right:0;background:rgba(10,14,22,.75);color:#fff;border:none;width:16px;height:16px;font-size:10px;line-height:16px;padding:0;cursor:pointer;border-radius:0 0 0 5px;}

.shot-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.shot-modal-title{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--text);}
.shot-modal-close{background:none;border:none;color:var(--text-faint);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:6px;}
.shot-modal-close:hover{color:var(--loss);background:var(--loss-dim);}
.shot-gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.day-modal{max-width:760px;}
#day-details-overlay,#day-details-overlay *{-webkit-user-select:none;user-select:none;-webkit-user-drag:none;}
.day-summary-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;padding:14px 4px;border:1px solid var(--border-soft);border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),var(--surface-2);}
.day-stat{display:flex;flex-direction:column;align-items:center;gap:4px;}
.day-stat-label{font-family:var(--font-mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);}
.day-stat-val{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--text);}
.day-trade-list{display:flex;flex-direction:column;gap:8px;}
.day-trade-card{border:1px solid var(--border-soft);border-radius:10px;overflow:hidden;background:var(--surface);transition:border-color .15s;}
.day-trade-card.dtc-win{border-left:3px solid var(--profit);}
.day-trade-card.dtc-loss{border-left:3px solid var(--loss);}
.day-trade-card:hover{border-color:rgba(255,255,255,.14);}
.dtc-row{display:flex;align-items:center;gap:14px;padding:11px 14px;cursor:pointer;flex-wrap:wrap;}
.dtc-pair{font-weight:700;color:var(--gold-light);font-size:12.5px;min-width:64px;}
.dtc-mini{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
.dtc-mini b{color:var(--text-faint);font-weight:600;margin-right:3px;}
.dtc-pnl{font-family:var(--font-mono);font-weight:700;font-size:12.5px;margin-left:auto;}
.dtc-chev{color:var(--text-faint);font-size:11px;}
.dtc-expand{padding:0 14px 14px;border-top:1px solid var(--border-soft);}
.dtc-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0;}
.dtc-detail-grid>div{display:flex;flex-direction:column;gap:2px;}
.dtc-detail-label{font-family:var(--font-mono);font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint);}
.dtc-open-btn{width:100%;justify-content:center;font-size:11.5px;padding:8px;}
.trade-row-flash{animation:trade-row-flash-anim 1.6s ease;}
@keyframes trade-row-flash-anim{0%,100%{background:transparent;}20%{background:rgba(255,199,84,.16);}}
.shot-gallery-item{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border-soft);aspect-ratio:1/1;cursor:pointer;background:var(--surface-2);}
.shot-gallery-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s;}
.shot-gallery-item:hover img{transform:scale(1.06);}
.shot-gallery-del{position:absolute;top:5px;right:5px;background:rgba(10,14,22,.7);color:#fff;border:none;width:22px;height:22px;border-radius:6px;font-size:12px;cursor:pointer;z-index:2;}
.shot-gallery-del:hover{background:var(--loss);}
.shot-empty{color:var(--text-faint);font-size:13px;text-align:center;padding:30px 0;}

.shot-viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:950;display:flex;align-items:center;justify-content:center;padding:30px;}
.shot-viewer-img{max-width:100%;max-height:85vh;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,.6);}
.shot-viewer-close{position:absolute;top:24px;right:28px;background:rgba(255,255,255,.08);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;}
.shot-viewer-close:hover{background:rgba(255,255,255,.18);}
.shot-viewer-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;}
.shot-viewer-nav:hover{background:rgba(255,255,255,.18);}
.shot-viewer-prev{left:24px;}
.shot-viewer-next{right:24px;}
.shot-viewer-count{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-family:var(--font-mono);font-size:12px;}

/* ===== TRADE REVIEW DRAWER ===== */
.trd-clickable-row{cursor:pointer;transition:background .15s ease;}
.trd-clickable-row:hover{background:rgba(77,166,255,.05);}
.trd-overlay{position:fixed;inset:0;background:rgba(2,5,10,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:940;opacity:0;animation:trd-fade .22s ease forwards;}
.trd-overlay,.trd-overlay *{-webkit-user-select:none;user-select:none;-webkit-user-drag:none;}
@keyframes trd-fade{from{opacity:0;}to{opacity:1;}}
.trd-drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(480px,92vw);
  background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 30%),var(--surface);
  border-left:1px solid var(--border-soft);
  box-shadow:-24px 0 60px rgba(0,0,0,.55);
  backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .38s cubic-bezier(.16,1,.3,1);
  z-index:941;
}
.trd-drawer.trd-open{transform:translateX(0);}
.trd-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--border-soft);flex-shrink:0;
  background:linear-gradient(180deg,rgba(167,139,250,.05),transparent);}
.trd-eyebrow{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#A78BFA;margin-bottom:6px;}
.trd-title{font-family:'Sora',sans-serif;font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:9px;}
.trd-close{background:none;border:1px solid var(--border-soft);color:var(--text-faint);font-size:15px;width:32px;height:32px;border-radius:9px;cursor:pointer;flex-shrink:0;transition:border-color .2s,color .2s,background .2s;}
.trd-close:hover{color:#FF6B6B;border-color:rgba(255,77,109,.35);background:rgba(255,77,109,.08);}
.trd-body{flex:1;overflow-y:auto;padding:4px 22px 32px;}
.trd-section{margin-top:22px;}
.trd-section:first-child{margin-top:20px;}
.trd-section-title{font-family:'Sora',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:11px;display:flex;align-items:center;gap:8px;}
.trd-auto-tag{font-family:'DM Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:.05em;text-transform:none;color:var(--text-faint);padding:2px 7px;border-radius:20px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.18);}
.trd-overview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.trd-stat{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:10px 13px;}
.trd-stat-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:5px;}
.trd-stat-val{font-family:'Outfit',sans-serif;font-size:14.5px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
.trd-shots-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:420px){.trd-shots-grid{grid-template-columns:1fr;}}
.trd-shot-box{display:flex;flex-direction:column;gap:6px;}
.trd-shot-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);}
.trd-shot-frame{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--border-soft);cursor:zoom-in;background:var(--surface-2);aspect-ratio:16/10;}
.trd-shot-frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s cubic-bezier(.16,1,.3,1);}
.trd-shot-frame:hover img{transform:scale(1.06);}
.trd-shot-zoom{position:absolute;bottom:7px;right:7px;font-family:'DM Mono',monospace;font-size:9.5px;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;}
.trd-shot-frame:hover .trd-shot-zoom{opacity:1;}
.trd-shot-loading,.trd-shot-empty{grid-column:1/-1;padding:26px;text-align:center;font-family:'DM Mono',monospace;font-size:11.5px;color:var(--text-faint);border:1px dashed var(--border-soft);border-radius:11px;}
.trd-notes-label{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:7px;display:flex;align-items:center;gap:7px;}
.trd-notes-box{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:12px 14px;font-family:'DM Mono',monospace;font-size:12px;line-height:1.6;color:var(--text-muted);white-space:pre-wrap;}
.trd-lesson-box{color:var(--text);border-color:rgba(167,139,250,.2);background:linear-gradient(160deg,rgba(167,139,250,.06),transparent);}
.trd-exec-grid{display:flex;flex-direction:column;gap:8px;}
.trd-exec-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;}
.trd-exec-item>span:first-child{font-family:'Sora',sans-serif;font-size:12.5px;font-weight:500;color:var(--text-muted);}
.trd-badge{font-family:'DM Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:3px 10px;border-radius:20px;border:1px solid var(--border-soft);color:var(--text);white-space:nowrap;}
.trd-good{color:#00E5A0;border-color:rgba(0,229,160,.35);background:rgba(0,229,160,.08);}
.trd-bad{color:#FF4D6D;border-color:rgba(255,77,109,.35);background:rgba(255,77,109,.08);}
.trd-warn{color:#FFC24D;border-color:rgba(255,194,77,.35);background:rgba(255,194,77,.08);}
.trd-neutral{color:#4DA6FF;border-color:rgba(77,166,255,.35);background:rgba(77,166,255,.08);}
.trd-mistake-list{display:flex;flex-direction:column;gap:7px;}
.trd-mistake-item{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;border:1px solid var(--border-soft);background:var(--surface-2);font-family:'Sora',sans-serif;font-size:12.5px;font-weight:500;}
.trd-mistake-hit{color:#FF8FA3;border-color:rgba(255,77,109,.3);background:rgba(255,77,109,.06);}
.trd-mistake-hit svg{color:#FF4D6D;flex-shrink:0;}
.trd-mistake-clear{color:var(--text-faint);}
.trd-mistake-clear svg{color:#00E5A0;flex-shrink:0;opacity:.7;}
.trd-mistake-none{padding:12px 13px;text-align:center;font-family:'DM Mono',monospace;font-size:11.5px;color:#00E5A0;border:1px dashed rgba(0,229,160,.3);border-radius:10px;background:rgba(0,229,160,.05);}
.trd-ai-box{display:flex;align-items:flex-start;gap:11px;padding:14px 16px;border-radius:12px;border:1px solid rgba(167,139,250,.22);
  background:linear-gradient(160deg,rgba(167,139,250,.08),rgba(255,255,255,.012) 60%),var(--surface-2);position:relative;overflow:hidden;}
.trd-ai-box::before{content:'';position:absolute;top:-30%;right:-15%;width:55%;height:120%;pointer-events:none;background:radial-gradient(ellipse closest-side,rgba(167,139,250,.16),transparent 70%);}
.trd-ai-spark{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.25);animation:trd-badge-pulse 3.2s ease-in-out infinite;}
@keyframes trd-badge-pulse{0%,100%{box-shadow:0 0 0 rgba(167,139,250,0);}50%{box-shadow:0 0 12px rgba(167,139,250,.35);}}
.trd-ai-text{font-family:'DM Mono',monospace;font-size:12px;line-height:1.65;color:var(--text);position:relative;}
@media (max-width:520px){.trd-drawer{width:100vw;}.trd-overview-grid{grid-template-columns:1fr;}}

/* ===== TRADING ID / ACCOUNT SWITCHER ===== */
.acct-btn svg{width:15px;height:15px;}
.acct-modal{max-width:560px;}
.acct-modal-sub{font-size:12px;color:var(--text-faint);margin:-6px 0 16px;line-height:1.5;}
#acct-list>.acct-row:last-child{border-bottom:none;}
.acct-row{display:flex;flex-direction:column;gap:3px;padding:6px 6px;border-bottom:1px solid var(--border-soft);}
.acct-row-active{border:1px solid var(--accent);border-radius:8px;box-shadow:0 0 8px var(--accent-glow);}
.acct-row-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.acct-mini{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text-faint);font-family:var(--font-mono);flex-shrink:0;}
.acct-mini input{width:36px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 5px;font-size:11px;font-family:var(--font-mono);outline:none;}
.acct-mini input:focus{border-color:var(--accent);}
.acct-toggle{background:transparent;border:none;color:var(--text-faint);font-size:10px;cursor:pointer;padding:2px 0;text-align:left;font-family:var(--font-body);}
.acct-toggle:hover{color:var(--accent);}
.acct-extra{display:none;}
.acct-extra.open{display:flex;}
.acct-row-dot{width:14px;text-align:center;color:var(--accent);font-size:10px;flex-shrink:0;}
.acct-name-input{flex:1 1 70px;min-width:60px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12px;font-family:var(--font-mono);outline:none;}
.acct-name-input:focus{border-color:var(--accent);}
.acct-bal-wrap{display:flex;align-items:center;gap:3px;color:var(--text-faint);font-family:var(--font-mono);font-size:12px;flex-shrink:0;}
.acct-bal-input{width:64px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 6px;font-size:12px;font-family:var(--font-mono);outline:none;}
.acct-bal-input:focus{border-color:var(--accent);}
.acct-trade-count{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);width:auto;flex-shrink:0;}
.acct-active-tag{background:var(--profit-dim);color:var(--profit);font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:4px 7px;border-radius:5px;flex-shrink:0;}
.acct-row-cap{display:flex;align-items:center;gap:8px;padding-left:24px;}
.acct-cap-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;transition:border-color .15s ease,transform .15s ease,background .15s ease;}
.acct-cap-btn:hover{transform:translateY(-1px);}
.acct-cap-btn.dep{color:var(--profit);border-color:var(--profit-dim);}
.acct-cap-btn.dep:hover{background:var(--profit-dim);}
.acct-cap-btn.wd{color:var(--loss);border-color:var(--loss-dim);}
.acct-cap-btn.wd:hover{background:var(--loss-dim);}
.acct-cap-net{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
.acct-cap-net.pos{color:var(--profit);}
.acct-cap-net.neg{color:var(--loss);}
.acct-log-btn{background:transparent;border:none;color:var(--text-faint);font-size:10.5px;text-decoration:underline;cursor:pointer;flex-shrink:0;padding:0;margin-left:auto;font-family:var(--font-body);}
.acct-log-btn:hover{color:var(--accent);}
@media(max-width:560px){
  .acct-row-top{flex-wrap:wrap;}
  .acct-trade-count{width:auto;text-align:left;}
}

/* ===== CAPITAL (DEPOSIT / WITHDRAW) MODAL ===== */
.cap-modal{max-width:360px;}
.cap-current{font-size:12px;color:var(--text-faint);margin:-6px 0 16px;}
.cap-current b{color:var(--text);}
.cap-field{margin-bottom:14px;}
.cap-field label{display:block;font-size:11.5px;color:var(--text-faint);margin-bottom:6px;font-weight:600;}
.cap-input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--font-mono);outline:none;box-sizing:border-box;}
.cap-input:focus{border-color:var(--accent);}
.cap-error{font-size:11.5px;color:var(--loss);margin:-8px 0 12px;min-height:14px;}
.cap-actions{display:flex;gap:10px;justify-content:flex-end;}
.cap-log-row{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border-soft);font-size:12px;font-family:var(--font-mono);}
.cap-log-row:last-child{border-bottom:none;}
.cap-log-type{font-weight:700;}
.cap-log-type.dep{color:var(--profit);}
.cap-log-type.wd{color:var(--loss);}
.cap-log-date{color:var(--text-faint);font-size:10.5px;}
.cap-log-empty{padding:24px 4px;text-align:center;color:var(--text-faint);font-size:12.5px;}

/* ===== PROFILE SETTINGS MODAL (premium glass cards) ===== */
.ps-modal{max-width:540px;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;}
.ps-modal input,.ps-modal textarea{-webkit-user-select:text;user-select:text;}
.ps-modal .shot-modal-head{margin-bottom:4px;}
.ps-tabs{display:flex;gap:8px;margin:14px 0 4px;border-bottom:1px solid var(--border-soft);}
.ps-tab{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-faint);padding:10px 4px 12px;font-size:12.5px;font-weight:700;cursor:pointer;transition:color .15s ease,border-color .15s ease;}
.ps-tab-ic{font-size:14px;margin-right:5px;}
.ps-tab-sub{font-size:10px;font-weight:500;color:var(--text-faint);margin-top:2px;}
.ps-tab:hover{color:var(--text);}
.ps-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.ps-body{display:flex;flex-direction:column;gap:14px;margin-top:16px;}
.ps-section{position:relative;padding:18px 20px;border:1px solid var(--border-soft);border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 45%),var(--surface-2);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 28px -22px rgba(10,14,30,.55);
  transition:border-color .18s ease,box-shadow .18s ease;}
.ps-section:hover{border-color:rgba(110,143,240,.28);}
.ps-card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.ps-card-icon{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(110,143,240,.12);border:1px solid rgba(110,143,240,.25);}
.ps-card-head-text{display:flex;flex-direction:column;}
.ps-section-t{font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--text);}
.ps-card-d{font-size:11px;color:var(--text-faint);margin-top:1px;line-height:1.4;}
.ps-divider{height:1px;background:var(--border-soft);margin:16px 0;}
.ps-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ps-col{display:flex;flex-direction:column;gap:10px;}
.ps-input{margin:0;padding:11px 13px;border-radius:9px;font-size:13px;}
.ps-save-btn{flex-shrink:0;white-space:nowrap;}
.ps-avatar-row{display:flex;align-items:center;gap:16px;}
.ps-avatar-preview{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#061224,#0D3A73 30%,#1E6FD9 55%,#4DA6FF 75%,#00E5A0 100%);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#fff;font-family:'Cormorant Garamond',serif;font-style:italic;flex-shrink:0;overflow:hidden;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--border-soft);}
.ps-avatar-preview img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.ps-avatar-actions{display:flex;flex-direction:column;gap:8px;}
.ps-upload-btn{display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;padding:8px 13px;}
.ps-link-btn{background:transparent;border:1px solid var(--border);color:var(--text-faint);font-size:11.5px;padding:8px 13px;}
.ps-link-btn:hover{color:#FF4D6D;border-color:rgba(255,77,109,.4);}
.ps-subhead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;}
.ps-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.ps-toggle-t{font-size:13px;font-weight:600;color:var(--text);}
.ps-toggle-d{font-size:11px;color:var(--text-faint);margin-top:2px;line-height:1.4;}
.ps-switch{position:relative;width:40px;height:23px;flex-shrink:0;display:inline-block;}
.ps-switch input{opacity:0;width:0;height:0;}
.ps-switch-slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:24px;transition:background .2s ease,box-shadow .2s ease;}
.ps-switch-slider::before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.3);}
.ps-switch input:checked+.ps-switch-slider{background:var(--accent);box-shadow:0 0 0 3px rgba(110,143,240,.16);}
.ps-switch input:checked+.ps-switch-slider::before{transform:translateX(17px);}
.ps-switch-slider:hover{filter:brightness(1.08);}
.ps-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ps-field-label{font-size:10.5px;font-weight:600;color:var(--text-faint);margin-bottom:6px;display:block;}
.ps-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.ps-chip{padding:6px 13px;border-radius:20px;border:1px solid var(--border-soft);background:var(--surface);font-size:11.5px;font-weight:500;color:var(--text-faint);cursor:pointer;transition:border-color .15s,background .15s,color .15s;}
.ps-chip:hover{border-color:rgba(110,143,240,.45);color:var(--text);}
.ps-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.ps-vis-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft);}
.ps-vis-row:last-child{border-bottom:none;padding-bottom:2px;}
.ps-vis-label{font-size:12.5px;font-weight:600;color:var(--text);}
.ps-vis-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:10px;margin-top:4px;}
.ps-vis-badge.public{background:rgba(0,229,160,.12);color:#00E5A0;border:1px solid rgba(0,229,160,.3);}
.ps-vis-badge.private{background:rgba(255,255,255,.06);color:var(--text-faint);border:1px solid var(--border-soft);}
.ps-vis-badge.friends{background:rgba(110,143,240,.14);color:#8fb8ff;border:1px solid rgba(110,143,240,.35);}
.ps-seg{display:inline-flex;border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;flex-shrink:0;}
.ps-seg-btn{padding:6px 11px;font-size:10px;font-weight:600;background:var(--surface);color:var(--text-faint);border:none;border-right:1px solid var(--border-soft);cursor:pointer;transition:background .15s,color .15s;}

.ps-seg-btn.active{background:var(--accent);color:#fff;}
.ps-seg-btn:hover:not(.active){color:var(--text);}
@media(max-width:480px){.ps-vis-row{flex-direction:column;align-items:flex-start;gap:8px;}}

/* ===== TRADER PROFILE MODAL (Community Leaderboard Profile) ===== */
.tp-modal{max-width:480px;}
.tp-head-row{display:flex;align-items:center;gap:14px;padding:6px 0 16px;border-bottom:1px solid var(--border-soft);margin-bottom:4px;}
.tp-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(145deg,#061224,#0D3A73 30%,#1E6FD9 55%,#4DA6FF 75%,#00E5A0 100%);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;font-family:'Cormorant Garamond',serif;font-style:italic;flex-shrink:0;}

.theme-swatch-btn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease;text-align:left;font-family:inherit;}

  .ps-danger .ps-row{flex-direction:column;align-items:flex-start;}
}

.day-group{margin-bottom:16px;border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;}

.day-pnl{font-family:var(--font-mono);font-weight:600;font-size:14.5px;}

.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-nav{display:flex;align-items:center;gap:12px;}

.cal-nav button:hover{border-color:var(--gold-dim);}
.cal-month{font-family:var(--font-mono);font-weight:600;min-width:140px;text-align:center;font-size:14px;}

.cal-account-filter{position:relative;z-index:80;display:flex;flex-direction:column;gap:0;width:32px;max-width:100%;}
.cal-account-filter>label{display:none;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--text-faint);}
.cal-account-trigger{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:1fr;align-items:center;justify-items:center;gap:0;width:32px;height:32px;min-height:32px;padding:3px;border:1px solid rgba(135,119,198,.28);border-radius:7px;background:linear-gradient(135deg,rgba(12,17,34,.96),rgba(20,17,43,.94));color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 14px 34px -29px rgba(93,72,206,.8);transition:border-color .24s ease,background .24s ease,box-shadow .24s ease,transform .24s cubic-bezier(.2,.8,.2,1);}
.cal-account-trigger .cal-account-selected-copy,.cal-account-trigger .cal-account-badge,.cal-account-trigger .cal-account-arrow{display:none;}

.cal-account-trigger::before{content:"";position:absolute;z-index:1;inset:-50% auto -50% -35%;width:42%;background:linear-gradient(100deg,transparent,rgba(102,235,223,.09),transparent);transform:translateX(-160%) skewX(-16deg);transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.cal-account-trigger::after{content:"";position:absolute;z-index:1;left:12px;right:12px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(108,232,222,.48),rgba(135,102,244,.36),transparent);opacity:.55;transition:opacity .25s ease}
.cal-account-trigger:hover{border-color:rgba(91,210,208,.42);background:linear-gradient(135deg,rgba(15,23,43,.98),rgba(26,20,52,.96));box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 16px 35px -29px rgba(68,210,203,.75);transform:translateY(-1px);}
.cal-account-trigger:hover::before,.cal-account-filter.open .cal-account-trigger::before{transform:translateX(390%) skewX(-16deg)}
.cal-account-trigger:hover::after,.cal-account-filter.open .cal-account-trigger::after{opacity:1}
.cal-account-trigger:focus-visible{outline:none;border-color:rgba(83,214,211,.7);box-shadow:0 0 0 3px rgba(67,205,208,.1);}
.cal-account-filter.open .cal-account-trigger{border-color:rgba(111,91,219,.62);background:linear-gradient(135deg,rgba(18,24,45,.99),rgba(31,22,61,.98));box-shadow:0 0 0 3px rgba(113,88,225,.08),0 20px 44px -31px rgba(90,220,208,.65);}
.cal-account-logo,.cal-all-accounts-icon{width:42px;height:42px;border-radius:10px;overflow:hidden;display:grid;place-items:center;flex:0 0 auto;}
.cal-account-logo .target-broker-logo{width:42px;height:42px;border-radius:10px;box-shadow:none;}
.cal-account-logo .target-broker-mark{font-size:8px;}
.cal-all-accounts-icon{border:1px solid rgba(93,210,211,.3);background:radial-gradient(circle at 30% 20%,rgba(100,238,225,.22),transparent 46%),linear-gradient(145deg,rgba(59,205,202,.15),rgba(112,80,220,.2));color:#83e9e3;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 9px 24px -16px rgba(79,220,211,.9);transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s ease}
.cal-account-trigger:hover .cal-all-accounts-icon,.cal-account-filter.open .cal-account-trigger .cal-all-accounts-icon{transform:scale(1.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 26px -14px rgba(79,220,211,.95)}
.cal-all-accounts-icon svg{width:22px;height:22px;}
.cal-account-selected-copy,.cal-account-option-copy{min-width:0;}
.cal-account-selected-name,.cal-account-option-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#edf2ff;font-family:'Sora',sans-serif;font-size:12px;font-weight:650;letter-spacing:-.01em;}
.cal-account-selected-meta,.cal-account-option-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px;color:#8190aa;font-family:var(--font-mono);font-size:9px;line-height:1.35;}
.cal-account-badge{display:inline-flex;align-items:center;justify-content:center;min-height:20px;padding:3px 7px;border:1px solid rgba(66,218,166,.22);border-radius:999px;background:rgba(51,201,151,.09);color:#55dfb1;font-family:var(--font-mono);font-size:8px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;}
.cal-account-badge.funded{border-color:rgba(147,115,255,.25);background:rgba(123,91,230,.11);color:#beaaff;}
.cal-account-badge.all{border-color:rgba(86,204,210,.22);background:rgba(55,178,187,.09);color:#86dfe3;}
.cal-account-arrow{display:grid;place-items:center;color:#8190aa;transition:transform .25s cubic-bezier(.2,.8,.2,1),color .2s ease;}
.cal-account-arrow svg{width:15px;height:15px;}
.cal-account-filter.open .cal-account-arrow{transform:rotate(180deg);color:#86e7df;}
.cal-account-menu{position:absolute;top:calc(100% + 8px);right:0;width:max(100%,420px);max-height:min(470px,calc(100vh - 130px));overflow:auto;padding:7px;border:1px solid rgba(132,109,222,.3);border-radius:14px;background:radial-gradient(circle at 92% 0,rgba(91,67,193,.15),transparent 34%),linear-gradient(155deg,rgba(14,20,38,.985),rgba(9,12,27,.99));backdrop-filter:blur(18px);box-shadow:0 28px 70px -28px rgba(0,0,0,.95),0 18px 55px -39px rgba(100,82,224,.85),inset 0 1px 0 rgba(255,255,255,.04);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-10px) scale(.965);transform-origin:top right;transition:opacity .22s ease,transform .3s cubic-bezier(.16,1,.3,1),visibility .22s;}
.cal-account-filter.open .cal-account-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1);}
.cal-account-menu-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 10px 10px;margin-bottom:4px;border-bottom:1px solid rgba(132,109,222,.14)}

.cal-account-group{padding:4px 0 2px;}
.cal-account-group+.cal-account-group{margin-top:4px;border-top:1px solid rgba(130,109,194,.13);}
.cal-account-group-label{display:flex;align-items:center;gap:8px;padding:8px 9px 5px;color:#837b9f;font-family:var(--font-mono);font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;}

.cal-account-group.compounding .cal-account-group-label::before{background:#45cfc2;}
.cal-account-option{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:58px;margin:2px 0;padding:8px 9px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;opacity:0;transform:translateY(-4px);transition:border-color .18s ease,background .18s ease,transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s ease;}

.cal-account-option.selected{border-color:rgba(65,209,189,.27);background:linear-gradient(100deg,rgba(47,179,167,.12),rgba(103,74,204,.13));}

.cal-account-option-check{display:grid;place-items:center;width:20px;height:20px;border:1px solid rgba(78,220,190,.24);border-radius:50%;background:rgba(52,199,164,.08);color:#63decb;font-size:12px;opacity:0;transform:scale(.65);transition:opacity .18s ease,transform .24s cubic-bezier(.2,1.4,.3,1)}
.cal-account-option.selected .cal-account-option-check{opacity:1;transform:scale(1)}
.cal-account-option .cal-account-badge{grid-column:3;grid-row:1;}
.cal-account-option-check{grid-column:3;grid-row:1;margin-left:3px;}
.cal-account-option.selected .cal-account-badge{margin-right:23px;}
.cal-account-menu::-webkit-scrollbar{width:7px}.cal-account-menu::-webkit-scrollbar-thumb{border:2px solid transparent;border-radius:9px;background-clip:padding-box;}
.legend{display:flex;gap:16px;font-size:11px;color:var(--text-muted);margin-bottom:16px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
.cal-dow{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--text-faint);text-align:center;padding-bottom:4px;}
.cal-cell{--cal-accent:var(--border);min-height:78px;border-radius:8px;border:1px solid var(--border-soft);padding:8px 9px 8px 12px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:inset 4px 0 0 var(--cal-accent);}

@media(max-width:700px){.cal-toolbar{width:100%;justify-content:space-between;flex-wrap:wrap}.cal-account-filter{width:100%;min-width:0;gap:5px}.cal-account-filter>label{display:block}.cal-account-trigger{grid-template-columns:42px minmax(0,1fr) auto 17px;justify-items:stretch;gap:10px;width:100%;height:auto;min-height:58px;padding:8px 11px 8px 9px;border-radius:12px}.cal-account-trigger .cal-account-selected-copy{display:block}.cal-account-trigger .cal-account-badge{display:inline-flex}.cal-account-trigger .cal-account-arrow{display:grid}.cal-account-trigger .cal-account-logo,.cal-account-trigger .cal-all-accounts-icon,.cal-account-trigger .cal-account-logo .target-broker-logo{width:42px;height:42px;border-radius:10px}.cal-account-menu{left:0;right:auto;width:100%;transform-origin:top center}.cal-nav{margin-left:auto;}}

@media(prefers-reduced-motion:reduce){.cal-account-trigger,.cal-account-trigger::before,.cal-account-arrow,.cal-account-menu,.cal-account-option,.cal-account-option-check,.cal-all-accounts-icon{transition:none}.cal-account-trigger:hover,.cal-account-option:hover{transform:none}}
.cal-sum-card{min-width:0;padding:12px 14px;border:1px solid rgba(132,105,203,.19);border-radius:11px;background:linear-gradient(145deg,rgba(18,19,40,.8),rgba(19,13,45,.76));box-shadow:inset 0 1px 0 rgba(255,255,255,.025);transition:border-color .2s ease,background .2s ease;}

.cal-comp-status.hit{border-color:rgba(64,219,166,.24);color:#52dcae}.cal-comp-status.stopped{border-color:rgba(255,79,111,.25);color:#ff718a}.cal-comp-status.partial{color:#b9a6ff}

@media(max-width:620px){.cal-compounding-status,.cal-profit-status{grid-template-columns:1fr 1fr}.cal-compounding-lead{grid-column:1/-1}.cal-compounding-stat:last-child{grid-column:1/-1}.cal-cell.compounding-day{min-height:98px}.cal-comp-plan{grid-template-columns:1fr}.cal-comp-plan span:last-child{display:none}}
